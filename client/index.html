<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>H2 COLOMBIANO</title>
    <meta name="description" content="H2 COLOMBIANO" />

    <!-- Cache Control - Basico -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Ocultar dos mecanismos de busca -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#1a0a2e" />
    <!-- PWA: Apple iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meus Cartões" />
    <!-- PWA: Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA: Windows -->
    <meta name="msapplication-TileColor" content="#1a0a2e" />
    <meta name="msapplication-TileImage" content="/mstile-150x150.png" />
    <meta name="msapplication-config" content="none" />
    <!-- PWA: Geral -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Ícones PWA -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Montserrat e Poppins Bold para opcoes de fonte dos botoes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Limpar IndexedDB de versoes antigas (nao cancela mais o SW)
      if (window.indexedDB) {
        ['walk-contas', 'h2colombiano'].forEach((dbName) => {
          try { indexedDB.deleteDatabase(dbName); } catch (e) {}
        });
      }
      // IMPORTANTE: NAO limpar localStorage/sessionStorage aqui.
      // Isso apagava o token de login do Gestor de Gastos a cada F5/reload.
    </script>
  </body>
</html>
