name: VIP Operational UX Check
on:
  push:
    branches: [feat/vip-parcelamento-seguro-2026-09-12]
    paths: [.github/workflows/vip-operational-ux-check-20260912.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        shell: bash
        run: |
          sed -i 's/bg-red-500\/10 p-4/bg-red-500\/[0.06] p-4/g' scripts/apply_vip_operational_ux_20260912.py
          python scripts/apply_vip_operational_ux_20260912.py
      - name: Invariants
        shell: bash
        run: |
          grep -n "VER MINHAS PARCELAS VIP\|MINHAS PARCELAS VIP" client/src/components/VipInstallmentCheckoutBox.tsx
          grep -n "Vence hoje\|Recebido hoje\|Planos ativos\|Planos quitados" client/src/components/AdminVipReceivablesPanel.tsx
          git diff --check
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts shared/vipInstallments.test.ts
      - name: TypeScript
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(client/src/components/VipInstallmentCheckoutBox\.tsx|client/src/components/AdminVipReceivablesPanel\.tsx|server/routers\.ts)" /tmp/tsc.log > /tmp/vip-errors.log || true
          grep -vE "server/routers\.ts\([0-9]+,[0-9]+\): error TS2304: Cannot find name 'listOrderStatusTypes'\." /tmp/vip-errors.log > /tmp/new-errors.log || true
          if [ -s /tmp/new-errors.log ]; then cat /tmp/new-errors.log; exit 1; fi
      - name: Commit
        shell: bash
        run: |
          git config user.name h2-vip-guard
          git config user.email actions@users.noreply.github.com
          git rm -f .github/workflows/vip-operational-ux-check-20260912.yml scripts/apply_vip_operational_ux_20260912.py
          git add client/src/components/VipInstallmentCheckoutBox.tsx client/src/components/AdminVipReceivablesPanel.tsx
          git commit -m "feat(vip): complete receivables dashboard and customer access"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
