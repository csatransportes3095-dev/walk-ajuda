name: H2 AUTO - Editor responsivo celular e desktop
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - client/src/components/H2AutoTreeEditor.tsx
      - .github/workflows/h2-auto-tree-responsive-redesign.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
