name: H2 ColombiaBot - voltar para card de escolha
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'client/src/components/ColombiaBot.tsx'
      - 'client/src/lib/colombiaBotNavigation.ts'
      - 'server/colombiaBotBackNavigation.test.ts'
      - '.github/workflows/h2-colombia-bot-back-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  back-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias bloqueadas
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Testar navegacao e vitrine
        run: pnpm exec vitest run server/colombiaBotBackNavigation.test.ts server/colombiaBotStorefrontCards.test.ts
      - name: Compilar site
        run: pnpm build
