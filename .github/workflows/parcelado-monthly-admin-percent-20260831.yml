name: Parcelado monthly admin percent 20260831

on:
  push:
    branches:
      - fix/parcelado-admin-percent-monthly-20260831

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply parcelado patch
        run: python scripts/patch-parcelado-monthly-admin-percent-20260831.py

      - name: Verify monthly-only and ADM formula
        run: |
          grep -Fq 'calculateParceladoFromAdminPlan' server/routers/loans.ts
          grep -Fq "frequencia: z.literal('mensal').default('mensal')" server/routers/loans.ts
          grep -Fq "generateInstallments(input.releaseDate, 'mensal'" server/routers/loans.ts
          grep -Fq "frequencia: 'mensal'" client/src/pages/LoansTab.tsx
          ! grep -Fq 'parceladoFrequencia' client/src/pages/LoansTab.tsx

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Parcelado tests
        run: pnpm exec vitest run server/loans/parcelado.test.ts

      - name: TypeScript modified-files guard
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if grep -E 'server/loans/parcelado\.ts|server/loans/parcelado\.test\.ts|server/routers/loans\.ts|client/src/pages/LoansTab\.tsx' /tmp/tsc.log; then
            echo 'TypeScript error in modified parcelado files'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Only pre-existing TypeScript errors outside modified parcelado files remain.'
          fi

      - name: Production build
        run: pnpm build

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers/loans.ts client/src/pages/LoansTab.tsx
          if git diff --cached --quiet; then
            echo 'No integration changes to commit'
            exit 0
          fi
          git commit -m 'fix(loans): respeitar percentual ADM no parcelado mensal [skip ci]'
          git push origin HEAD:fix/parcelado-admin-percent-monthly-20260831
