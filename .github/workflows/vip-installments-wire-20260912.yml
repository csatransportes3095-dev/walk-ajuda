name: VIP Installments Guarded Wiring

on:
  push:
    branches:
      - feat/vip-parcelamento-seguro-2026-09-12
    paths:
      - .github/workflows/vip-installments-wire-20260912.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Integrate product rules panel
        run: python scripts/apply_vip_installment_product_panel_20260912.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts
      - name: Check only new VIP TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -E "(server/routers/vipInstallments\.ts|server/vipInstallmentPricing\.ts|server/vipInstallmentProductRules\.ts|shared/vipInstallments\.ts|shared/vipCheckoutPricing\.ts|client/src/components/AdminVipInstallmentsPanel\.tsx|client/src/components/AdminVipInstallmentProductsPanel\.tsx|client/src/pages/AdminVip\.tsx)" /tmp/tsc.log > /tmp/vip-errors.log || true
          if [ -s /tmp/vip-errors.log ]; then
            cat /tmp/vip-errors.log
            exit 1
          fi
          echo "No new VIP installment TypeScript errors."
      - name: Commit only after focused validations pass
        shell: bash
        run: |
          git config user.name "h2-vip-guard"
          git config user.email "actions@users.noreply.github.com"
          git add client/src/components/AdminVipInstallmentsPanel.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(vip): integrate per-product installment controls"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
