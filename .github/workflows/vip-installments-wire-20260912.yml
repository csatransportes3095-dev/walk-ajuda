name: VIP Installments Guarded Wiring

# final cleanup validation v2
on:
  push:
    branches:
      - feat/vip-parcelamento-seguro-2026-09-12
    paths:
      - .github/workflows/vip-installments-wire-20260912.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore main router from LIVE and register only official VIP router
        shell: bash
        run: |
          git show b416298093a2a816af0e3824658b1d197caec219:server/routers.ts > /tmp/live-routers.ts
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/live-routers.ts').read_text(encoding='utf-8')
          import_anchor = 'import { vipMembershipsRouter, getVipMembershipSnapshotMap, isVipMemberByPhone } from "./routers/vipMemberships";'
          import_line = 'import { vipInstallmentsRouter } from "./routers/vipInstallments";'
          route_anchor = '  vipMemberships: vipMembershipsRouter,'
          route_line = '  vipInstallments: vipInstallmentsRouter,'
          if source.count(import_anchor) != 1 or source.count(route_anchor) != 1:
              raise SystemExit('LIVE router anchors changed unexpectedly')
          expected = source.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          expected = expected.replace(route_anchor, route_anchor + '\n' + route_line, 1)
          Path('server/routers.ts').write_text(expected, encoding='utf-8')
          PY
      - name: Remove obsolete parallel VIP implementation and development scaffolding
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            server/routers/vipInstallmentPayments.ts \
            server/vipInstallmentContractService.ts \
            server/vipInstallmentEligibility.ts \
            client/src/pages/AdminVipReceivablesPage.tsx \
            client/src/pages/VipInstallmentsPage.tsx \
            .github/workflows/vip-installment-backend-integration-20260912.yml \
            .github/workflows/vip-installment-contract-safety-20260912.yml \
            .github/workflows/vip-installment-contracts-20260912.yml \
            .github/workflows/vip-installment-frontend-integration-20260912.yml \
            scripts/apply_vip_installment_admin_link_20260912.py \
            scripts/apply_vip_installment_checkout_backend_20260912.py \
            scripts/apply_vip_installment_checkout_intent_20260912.py \
            scripts/apply_vip_installment_checkout_ui_20260912.py \
            scripts/apply_vip_installment_contract_router_20260912.py \
            scripts/apply_vip_installment_contract_safety_20260912.py \
            scripts/apply_vip_installment_customer_admin_ui_20260912.py \
            scripts/apply_vip_installment_customer_order_number_20260912.py \
            scripts/apply_vip_installment_home_checkout_20260912.py \
            scripts/apply_vip_installment_overdue_refresh_20260912.py \
            scripts/apply_vip_installment_payment_router_20260912.py \
            scripts/apply_vip_installment_product_hardening_20260912.py \
            scripts/apply_vip_installment_product_panel_20260912.py \
            scripts/apply_vip_installment_routes_20260912.py \
            scripts/fix_vip_checkout_home_types_20260912.py
      - name: Assert obsolete runtime references are gone
        shell: bash
        run: |
          if grep -R -n -E "vipInstallmentPaymentsRouter|vipInstallmentContractService|VipInstallmentsPage|AdminVipReceivablesPage" server client/src --exclude-dir=node_modules; then
            echo "Obsolete VIP implementation still referenced"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/live-routers.ts').read_text(encoding='utf-8')
          import_anchor = 'import { vipMembershipsRouter, getVipMembershipSnapshotMap, isVipMemberByPhone } from "./routers/vipMemberships";'
          route_anchor = '  vipMemberships: vipMembershipsRouter,'
          expected = source.replace(import_anchor, import_anchor + '\nimport { vipInstallmentsRouter } from "./routers/vipInstallments";', 1)
          expected = expected.replace(route_anchor, route_anchor + '\n  vipInstallments: vipInstallmentsRouter,', 1)
          actual = Path('server/routers.ts').read_text(encoding='utf-8')
          if actual != expected:
              raise SystemExit('server/routers.ts is not LIVE plus the two official VIP router lines')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts shared/vipInstallments.test.ts
      - name: Check official VIP TypeScript regressions only
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -E "(server/routers/vipInstallments\.ts|server/vipInstallmentContracts\.ts|server/vipInstallmentPricing\.ts|server/vipInstallmentProductRules\.ts|shared/vipInstallments\.ts|shared/vipCheckoutPricing\.ts|client/src/App\.tsx|client/src/pages/Home\.tsx|client/src/pages/AdminVip\.tsx|client/src/pages/VipInstallmentPayments\.tsx|client/src/components/VipInstallmentCheckoutBox\.tsx|client/src/components/AdminVipInstallmentsPanel\.tsx|client/src/components/AdminVipInstallmentProductsPanel\.tsx|client/src/components/AdminVipReceivablesPanel\.tsx)" /tmp/tsc.log > /tmp/vip-errors.log || true
          grep -E "server/routers\.ts.*(vipInstallments|Duplicate identifier|Cannot find name 'vipInstallmentsRouter'|Cannot find module.*vipInstallments)" /tmp/tsc.log >> /tmp/vip-errors.log || true
          if [ -s /tmp/vip-errors.log ]; then
            cat /tmp/vip-errors.log
            exit 1
          fi
          echo "No official VIP installment TypeScript regressions; unrelated LIVE TypeScript debt is unchanged."
      - name: Check diff formatting
        run: git diff --check
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "h2-vip-guard"
          git config user.email "actions@users.noreply.github.com"
          git add server/routers.ts
          git add -u
          git rm -f --ignore-unmatch .github/workflows/vip-installments-wire-20260912.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(vip): keep single validated installment implementation"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
