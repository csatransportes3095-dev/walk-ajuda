name: Validate Home Session Reset

on:
  push:
    branches:
      - fix/home-clear-stale-customer-session

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply guarded patch
        run: node scripts/fix-home-stale-customer-session.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit validated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/WelcomeScreen.tsx
          git commit -m "fix(home): exigir identificacao nova antes de validar cadastro [skip ci]"
          git push origin HEAD:fix/home-clear-stale-customer-session
