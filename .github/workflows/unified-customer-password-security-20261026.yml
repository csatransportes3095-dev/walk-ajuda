name: Validate Unified Customer Password Security
on:
  push:
    branches:
      - fix/senha-unificada-recuperacao-segura-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - if: always()
        run: pnpm exec vitest run server/customerPasswordRecoveryPolicy.test.ts server/customerSession.test.ts server/customerProfileUpdateGates.test.ts server/customerSessionRefreshRegression.test.ts server/spreadsheetSession.test.ts
