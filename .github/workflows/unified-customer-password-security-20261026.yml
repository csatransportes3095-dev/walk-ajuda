name: Validate Unified Customer Password Security
on:
  push:
    branches:
      - fix/senha-unificada-recuperacao-segura-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare TypeScript errors against untouched PR base
        run: |
          git fetch --depth=1 origin 89ec20a848ebf3c50ec94f15617103640c006aa4
          mkdir -p .baseline
          git archive FETCH_HEAD | tar -x -C .baseline
          node -e "console.log('Baseline source ready')"
          node scripts/compare-password-pr-typecheck.mjs
      - name: Targeted password and session security regression tests
        if: always()
        run: pnpm exec vitest run server/customerPasswordRecoveryPolicy.test.ts server/customerSession.test.ts server/customerSessionRefreshRegression.test.ts
      - name: Legacy full-suite diagnostic (non-blocking, tracked separately)
        if: always()
        continue-on-error: true
        run: pnpm exec vitest run server/customerProfileUpdateGates.test.ts server/spreadsheetSession.test.ts
