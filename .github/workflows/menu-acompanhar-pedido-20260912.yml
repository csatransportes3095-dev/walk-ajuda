name: Menu Acompanhar Pedido

on:
  push:
    branches:
      - feat/menu-acompanhar-pedido-2026-09-12
    paths:
      - .github/workflows/menu-acompanhar-pedido-20260912.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/menu-acompanhar-pedido-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Adicionar acompanhar pedido no menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('client/src/pages/Home.tsx')
          s = p.read_text(encoding='utf-8')

          old = '        <div className="container flex items-center justify-between py-4">'
          new = '        <div className="container flex flex-col gap-3 py-4 sm:flex-row sm:items-center sm:justify-between">'
          if s.count(old) != 1:
              raise SystemExit(f'header anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '          <div className="flex items-center gap-3">\n            <p className="hidden md:block text-sm text-white/70">Atendimento Rápido no WhatsApp</p>'
          new = '          <div className="flex w-full items-center justify-end gap-2 sm:w-auto sm:gap-3">\n            <p className="hidden md:block text-sm text-white/70">Atendimento Rápido no WhatsApp</p>'
          if s.count(old) != 1:
              raise SystemExit(f'actions anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          pattern = re.compile(r'(\s*<UserCircle className="w-4 h-4" />\s*\n\s*Meus Dados\s*\n\s*</button>\s*\n\s*\)\})', re.M)
          match = pattern.search(s)
          if not match:
              raise SystemExit('Meus Dados block not found')
          block = '''
            <button
              onClick={() => { window.location.href = '/acompanhar'; }}
              className="flex items-center gap-1.5 px-2 py-1.5 bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-400/35 text-cyan-100 rounded-lg text-[10px] font-bold transition-colors sm:px-3 sm:text-xs"
              aria-label="Acompanhar seu pedido"
              title="Acompanhar seu pedido"
            >
              <Clock className="w-4 h-4 flex-shrink-0" />
              <span className="leading-tight text-left sm:whitespace-nowrap">Acompanhar seu<br className="sm:hidden" /> pedido</span>
            </button>'''
          s = s[:match.end()] + block + s[match.end():]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Conferir alteracao
        shell: bash
        run: |
          grep -n "Acompanhar seu pedido" client/src/pages/Home.tsx
          grep -n "window.location.href = '/acompanhar'" client/src/pages/Home.tsx
          grep -n "flex flex-col gap-3 py-4 sm:flex-row" client/src/pages/Home.tsx

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar TypeScript do Home
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep "client/src/pages/Home.tsx" /tmp/tsc.log > /tmp/home-errors.log || true
          if [ -s /tmp/home-errors.log ]; then
            cat /tmp/home-errors.log
            exit 1
          fi
          echo "No new Home.tsx TypeScript errors."

      - name: Validar diff
        run: git diff --check

      - name: Commitar somente a alteracao real
        shell: bash
        run: |
          git config user.name "h2-menu-guard"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/menu-acompanhar-pedido-20260912.yml
          git add client/src/pages/Home.tsx
          git commit -m "feat(menu): add order tracking shortcut"
          git push origin HEAD:feat/menu-acompanhar-pedido-2026-09-12
