name: H2ADS Privacy Guard CDP hotfix

on:
  push:
    branches:
      - fix/h2ads-privacy-guard-cdp-2026-09-17
    paths:
      - ".github/workflows/h2ads-privacy-guard-cdp-hotfix.yml"
      - ".github/scripts/h2ads-privacy-guard-cdp.py"

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-privacy-guard-cdp-2026-09-17
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/h2ads-privacy-guard-cdp.py
      - name: Validate JavaScript syntax
        run: node --check workers/windows/browser-session.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run H2ADS tests
        run: pnpm vitest run server/h2adsWorkerFoundation.test.ts server/h2adsWorkerRoute.test.ts
      - name: Build production bundle
        run: pnpm build
      - name: Verify exact scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "workers/windows/browser-session.mjs"
          ! grep -q -- '--load-extension=' workers/windows/browser-session.mjs
          grep -q 'cdp_local_redirect_v1' workers/windows/browser-session.mjs
      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/windows/browser-session.mjs
          git commit -m "fix(h2ads): proteger Google sorry no Chrome atual"
          git push origin HEAD:fix/h2ads-privacy-guard-cdp-2026-09-17
