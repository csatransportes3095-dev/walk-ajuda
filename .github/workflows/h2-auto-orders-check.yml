name: H2 AUTO Orders - validate integration
on:
  push:
    branches: [feature/h2-auto-pedidos-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated API compilation
        run: pnpm exec esbuild server/h2-auto-orders.ts --bundle --platform=node --packages=external --format=esm --outfile=/tmp/h2auto-orders-compile.js
      - name: Verify H2 AUTO TypeScript without unrelated legacy errors
        shell: bash
        run: |
          pnpm check > /tmp/h2auto-typecheck.log 2>&1 || true
          grep -E "error TS" /tmp/h2auto-typecheck.log | grep -E "(server/h2-auto-orders\\.ts|server/h2-auto-order-email\\.ts|server/h2-auto-remote\\.ts|client/src/pages/AdminH2Auto\\.tsx|server/_core/index\\.ts)" && exit 1 || true
          echo "H2 AUTO integration: no direct TypeScript errors in changed files."
          echo "Note: repository-wide TypeScript errors unrelated to H2 AUTO remain outside this check."
