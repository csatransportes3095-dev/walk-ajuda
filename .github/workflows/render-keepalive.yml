name: Manter Render ativa

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping h2colombiano.com
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Chamar rota leve de manutenção
        run: |
          set -euo pipefail
          curl \
            --http1.1 \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 120 \
            --write-out "\nHTTP %{http_code} em %{time_total}s\n" \
            "https://h2colombiano.com/api/ping"
