name: VIP Customer Rejection Reason
on:
  push:
    branches: [feat/vip-parcelamento-seguro-2026-09-12]
    paths: [.github/workflows/vip-customer-rejection-reason-20260912.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        run: python scripts/apply_vip_customer_rejection_reason_20260912.py
      - name: Invariants
        shell: bash
        run: |
          grep -n "lastRejectionReason\|lastRejectionAtMs" server/routers/vipInstallments.ts
          grep -n "Comprovante anterior rejeitado\|Motivo:" client/src/pages/VipInstallmentPayments.tsx
          git diff --check
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts shared/vipInstallments.test.ts
      - name: TypeScript
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(server/routers/vipInstallments\.ts|client/src/pages/VipInstallmentPayments\.tsx|server/routers\.ts)" /tmp/tsc.log > /tmp/vip-errors.log || true
          grep -vE "server/routers\.ts\([0-9]+,[0-9]+\): error TS2304: Cannot find name 'listOrderStatusTypes'\." /tmp/vip-errors.log > /tmp/new-errors.log || true
          if [ -s /tmp/new-errors.log ]; then cat /tmp/new-errors.log; exit 1; fi
      - name: Commit
        shell: bash
        run: |
          git config user.name h2-vip-guard
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/vip-customer-rejection-reason-20260912.yml scripts/apply_vip_customer_rejection_reason_20260912.py
          git add server/routers/vipInstallments.ts client/src/pages/VipInstallmentPayments.tsx
          git commit -m "feat(vip): show rejected proof reason to customer"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
