name: H2 ColombiaBot - manifesto versus cupom
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'client/src/components/QuestionBlockingManifestGuard.tsx'
      - 'client/src/components/ColombiaBot.tsx'
      - 'client/src/lib/questionBlockingMatch.ts'
      - 'server/questionBlockingBotCoupon.test.ts'
      - '.github/workflows/h2-colombia-bot-blocking-coupon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blocking-coupon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Testar manifesto e regressao do bot
        run: pnpm exec vitest run server/questionBlockingBotCoupon.test.ts server/colombiaBotAndroidCouponResume.test.ts server/colombiaBotBackNavigation.test.ts server/colombiaBotStorefrontCards.test.ts
      - name: Compilar site
        run: pnpm build
