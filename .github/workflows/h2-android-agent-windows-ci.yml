name: H2 Android Agent - conexao Windows

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/src/pages/AdminH2Android.tsx"
      - "server/h2AndroidAgentStore.ts"
      - "server/h2AndroidAgentRoute.ts"
      - "server/h2AndroidAgent.integration.test.ts"
      - "server/h2Android.integration.test.ts"
      - "server/routers/h2Android.ts"
      - "server/_core/index.ts"
      - "server/siteAccessPolicy.ts"
      - "workers/windows/H2AndroidAgent.ps1"
      - ".github/workflows/h2-android-agent-windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Android agent and access regressions
        run: pnpm exec vitest run server/h2AndroidAgent.integration.test.ts server/h2Android.integration.test.ts server/siteAccessPolicy.test.ts
      - name: Check TypeScript in H2 Android files
        shell: bash
        run: |
          set +e
          pnpm check > typecheck-output.log 2>&1
          check_status=$?
          set -e
          if grep -E '(client/src/pages/AdminH2Android|server/h2AndroidAgentStore|server/h2AndroidAgentRoute|server/h2AndroidAgent\\.integration|server/routers/h2Android|server/h2Android\\.integration)\\.(ts|tsx)\\([0-9]+,[0-9]+\\): error TS' typecheck-output.log; then
            echo "H2 Android has TypeScript errors."
            exit 1
          fi
          if [ "$check_status" -ne 0 ]; then
            echo "Existing unrelated TypeScript errors remain in this repository; no diagnostics in H2 Android changed files."
            grep -m 8 'error TS' typecheck-output.log || true
          fi
      - name: Production build
        run: pnpm build

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/workers/windows/H2AndroidAgent.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax verified."
