name: H2 Android - rota e card ADM

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/src/App.tsx"
      - "client/src/pages/AdminCodes.tsx"
      - "server/siteAccessPolicy.ts"
      - "server/siteAccessPolicy.test.ts"
      - "server/h2Android.integration.test.ts"
      - ".github/workflows/h2-android-route-card-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate access control and ADM card
        run: pnpm exec vitest run server/h2Android.integration.test.ts server/siteAccessPolicy.test.ts
      - name: Production build
        run: pnpm build
