name: H2 Android - fallback direto ADM

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/public/route-fallback-guard-v1.js"
      - "client/index.html"
      - "client/route-fallback-indicacoes.test.ts"
      - "server/route-fallback-indicacoes.test.ts"
      - ".github/workflows/h2-android-fallback-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Testar fallback e protecao ADM
        run: pnpm exec vitest run client/route-fallback-indicacoes.test.ts server/route-fallback-indicacoes.test.ts server/h2Android.integration.test.ts server/siteAccessPolicy.test.ts
      - name: Validar build de producao
        run: pnpm build
