name: Fix Price Category UX

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Aplicar fluxo coerente de categorias de preco
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Trecho nao encontrado: {label}')
              return text.replace(old, new, 1)

          # 1) Backend: titulo editavel por opcao, sem alterar productOptions.
          p = Path('server/routers/optionPriceModels.ts')
          s = p.read_text()
          s = replace_once(s,
              '  isActive: number;\n  createdAt?: string | Date | null;',
              '  isActive: number;\n  selectorLabel?: string | null;\n  createdAt?: string | Date | null;',
              'tipo selectorLabel')
          s = replace_once(s,
              '    `);\n\n    // Preset solicitado para o produto atual.',
              '''    `);\n    await db.execute(sql`\n      CREATE TABLE IF NOT EXISTS optionPriceModelSettings (\n        optionId INT NOT NULL PRIMARY KEY,\n        selectorLabel VARCHAR(128) NOT NULL DEFAULT 'Modelo / categoria',\n        updatedAt TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP\n      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci\n    `);\n\n    // Preset solicitado para o produto atual.''',
              'tabela de configuracao')
          s = replace_once(s,
              '  const activeSql = onlyActive ? " AND isActive = 1" : "";\n  const result = await db.execute(sql.raw(`\n    SELECT id, optionId, label, price, originalPrice, promoEndsAt, sortOrder, isActive, createdAt, updatedAt\n    FROM optionPriceModels\n    WHERE optionId IN (${idList})${activeSql}\n    ORDER BY optionId ASC, sortOrder ASC, id ASC\n  `));',
              '''  const activeSql = onlyActive ? " AND m.isActive = 1" : "";\n  const result = await db.execute(sql.raw(`\n    SELECT m.id, m.optionId, m.label, m.price, m.originalPrice, m.promoEndsAt, m.sortOrder, m.isActive,\n           m.createdAt, m.updatedAt, COALESCE(s.selectorLabel, 'Modelo / categoria') AS selectorLabel\n    FROM optionPriceModels m\n    LEFT JOIN optionPriceModelSettings s ON s.optionId = m.optionId\n    WHERE m.optionId IN (${idList})${activeSql}\n    ORDER BY m.optionId ASC, m.sortOrder ASC, m.id ASC\n  `));''',
              'listagem com configuracao')
          marker = '''  list: adminProcedure\n    .input(z.object({ optionId: z.number().int().positive() }))\n    .query(async ({ input }) => listModels([input.optionId], false)),\n\n'''
          addition = '''  list: adminProcedure\n    .input(z.object({ optionId: z.number().int().positive() }))\n    .query(async ({ input }) => listModels([input.optionId], false)),\n\n  getSettings: adminProcedure\n    .input(z.object({ optionId: z.number().int().positive() }))\n    .query(async ({ input }) => {\n      await ensureInfrastructure();\n      const db = await getDb();\n      if (!db) throw new Error("Banco de dados indisponível.");\n      const result = await db.execute(sql`\n        SELECT selectorLabel FROM optionPriceModelSettings WHERE optionId=${input.optionId} LIMIT 1\n      `);\n      const row = asRows<{ selectorLabel?: string | null }>(result)[0];\n      return { selectorLabel: row?.selectorLabel?.trim() || "Modelo / categoria" };\n    }),\n\n  updateSettings: adminProcedure\n    .input(z.object({ optionId: z.number().int().positive(), selectorLabel: z.string().trim().min(1).max(128) }))\n    .mutation(async ({ input }) => {\n      await ensureInfrastructure();\n      const db = await getDb();\n      if (!db) throw new Error("Banco de dados indisponível.");\n      await db.execute(sql`\n        INSERT INTO optionPriceModelSettings (optionId, selectorLabel)\n        VALUES (${input.optionId}, ${input.selectorLabel})\n        ON DUPLICATE KEY UPDATE selectorLabel=VALUES(selectorLabel)\n      `);\n      return { success: true };\n    }),\n\n'''
          s = replace_once(s, marker, addition, 'rotas de configuracao')
          p.write_text(s)

          # 2) ADM: titulo do seletor editavel + semantica correta Principal/Promocional.
          p = Path('client/src/pages/AdminProducts.tsx')
          s = p.read_text()
          s = replace_once(s,
              "  const [price, setPrice] = useState(model.price);\n  const [originalPrice, setOriginalPrice] = useState(model.originalPrice || '');",
              "  const [principalPrice, setPrincipalPrice] = useState(model.originalPrice?.trim() ? model.originalPrice : model.price);\n  const [promotionalPrice, setPromotionalPrice] = useState(model.originalPrice?.trim() ? model.price : '');",
              'estado de preco da linha')
          s = replace_once(s,
              '''        <div><label className="text-[10px] text-orange-300 block mb-1">Valor Principal</label><input value={originalPrice} onChange={e => setOriginalPrice(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '6px 10px' }} placeholder="Ex: 150,00" /></div>\n        <div><label className="text-[10px] text-green-300 block mb-1">Valor Promocional</label><input value={price} onChange={e => setPrice(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '6px 10px' }} placeholder="Ex: 100,00" /></div>''',
              '''        <div><label className="text-[10px] text-orange-300 block mb-1">Valor Principal</label><input value={principalPrice} onChange={e => setPrincipalPrice(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '6px 10px' }} placeholder="Ex: 150,00" /></div>\n        <div><label className="text-[10px] text-green-300 block mb-1">Valor Promocional</label><input value={promotionalPrice} onChange={e => setPromotionalPrice(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '6px 10px' }} placeholder="Opcional: 100,00" /></div>''',
              'inputs principal promocional')
          old_save = '''onClick={() => updateMut.mutate({ id: model.id, optionId: model.optionId, label: label.trim(), price: price.trim(), originalPrice: originalPrice.trim(), promoEndsAt: promoEndsAt ? new Date(promoEndsAt).getTime() : null, sortOrder: model.sortOrder, isActive: active })}'''
          new_save = '''onClick={() => { const principal = principalPrice.trim(); const promotional = promotionalPrice.trim(); if (!label.trim() || (!principal && !promotional)) { toast.error('Informe categoria e pelo menos um valor.'); return; } updateMut.mutate({ id: model.id, optionId: model.optionId, label: label.trim(), price: promotional || principal, originalPrice: promotional ? principal : '', promoEndsAt: promotional && promoEndsAt ? new Date(promoEndsAt).getTime() : null, sortOrder: model.sortOrder, isActive: active }); }}'''
          s = replace_once(s, old_save, new_save, 'salvar linha')
          s = replace_once(s,
              "  const query = trpc.optionPriceModels.list.useQuery({ optionId });\n  const [newLabel, setNewLabel] = useState('');",
              "  const query = trpc.optionPriceModels.list.useQuery({ optionId });\n  const settingsQuery = trpc.optionPriceModels.getSettings.useQuery({ optionId });\n  const [selectorLabel, setSelectorLabel] = useState('');\n  const [newLabel, setNewLabel] = useState('');",
              'query settings admin')
          s = replace_once(s,
              "  const refresh = () => { utils.optionPriceModels.list.invalidate({ optionId }); utils.products.list.invalidate(); };\n  const createMut = trpc.optionPriceModels.create.useMutation({ onSuccess: () => { setNewLabel(''); setNewOriginalPrice(''); setNewPrice(''); setNewPromoEndsAt(''); refresh(); toast.success('Categoria de preço criada!'); } });",
              "  const refresh = () => { utils.optionPriceModels.list.invalidate({ optionId }); utils.products.list.invalidate(); };\n  const updateSettingsMut = trpc.optionPriceModels.updateSettings.useMutation({ onSuccess: () => { utils.optionPriceModels.getSettings.invalidate({ optionId }); refresh(); toast.success('Nome do seletor atualizado!'); } });\n  const createMut = trpc.optionPriceModels.create.useMutation({ onSuccess: () => { setNewLabel(''); setNewOriginalPrice(''); setNewPrice(''); setNewPromoEndsAt(''); refresh(); toast.success('Categoria de preço criada!'); } });",
              'mutation settings admin')
          s = replace_once(s,
              '''      <div>\n        <p className="text-sm font-black text-cyan-300">MODELOS / CATEGORIAS DE PREÇO</p>\n        <p className="text-[10px] text-gray-400">Ficam dentro desta Opção de Compra. Não criam outro produto e não duplicam perguntas ou documentos.</p>\n      </div>''',
              '''      <div>\n        <p className="text-sm font-black text-cyan-300">MODELOS / CATEGORIAS DE PREÇO</p>\n        <p className="text-[10px] text-gray-400">Ficam dentro desta Opção de Compra. Quando houver categorias, o cliente precisa escolher uma antes de ver/usar o valor.</p>\n      </div>\n      <div className="rounded-lg border border-cyan-500/20 bg-black/30 p-3">\n        <label className="text-[10px] text-cyan-300 font-bold block mb-1">Nome do campo exibido ao cliente</label>\n        <div className="flex gap-2">\n          <input value={selectorLabel || settingsQuery.data?.selectorLabel || ''} onChange={e => setSelectorLabel(e.target.value)} placeholder="Ex: Escolha o tipo de serviço" style={{ ...whiteInputStyle, fontSize: '12px', padding: '6px 10px' }} />\n          <Button type="button" size="sm" className="bg-cyan-600 hover:bg-cyan-500 text-white whitespace-nowrap" disabled={updateSettingsMut.isPending} onClick={() => { const value = (selectorLabel || settingsQuery.data?.selectorLabel || '').trim(); if (!value) { toast.error('Informe o nome do campo.'); return; } updateSettingsMut.mutate({ optionId, selectorLabel: value }); }}><Save className="w-3 h-3 mr-1" /> Salvar nome</Button>\n        </div>\n      </div>''',
              'editor nome do campo')
          s = replace_once(s,
              'Nenhuma categoria cadastrada. O preço base da opção continua funcionando normalmente.',
              'Nenhuma categoria cadastrada. Sem categorias, o preço base da opção continua funcionando normalmente.',
              'texto vazio')
          p.write_text(s)

          # 3) Card cliente: escolha obrigatoria; preco base fica oculto enquanto houver categorias.
          p = Path('client/src/components/StorefrontProductCard.tsx')
          s = p.read_text()
          s = replace_once(s,
              'export type StorefrontPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; };',
              'export type StorefrontPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; selectorLabel?: string | null; };',
              'tipo card')
          s = replace_once(s,
              '''  const [priceModelId, setPriceModelId] = useState<number | null>(null);\n  // As categorias chegam por uma query separada. No primeiro render a lista pode estar vazia;\n  // quando ela carregar, a primeira categoria visivel precisa ser a categoria realmente ativa.\n  const selectedPriceModel = priceModels.find((model) => model.id === priceModelId) || priceModels[0] || null;\n  const effectivePrice = selectedPriceModel?.price || selectedTier?.price || item.option.price;\n  const effectiveOriginalPrice = selectedPriceModel?.originalPrice || selectedTier?.originalPrice || item.option.originalPrice;''',
              '''  const [priceModelId, setPriceModelId] = useState<number | null>(null);\n  const selectedPriceModel = priceModels.find((model) => model.id === priceModelId) || null;\n  const requiresPriceModelSelection = priceModels.length > 0;\n  const selectorLabel = priceModels[0]?.selectorLabel?.trim() || "Modelo / categoria";\n  const effectivePrice = requiresPriceModelSelection ? selectedPriceModel?.price : (selectedTier?.price || item.option.price);\n  const effectiveOriginalPrice = requiresPriceModelSelection ? selectedPriceModel?.originalPrice : (selectedTier?.originalPrice || item.option.originalPrice);''',
              'selecao obrigatoria card')
          s = replace_once(s,
              '''            <span className="mb-1.5 block text-xs font-bold text-cyan-200">Modelo / categoria</span>\n            <select value={selectedPriceModel?.id ?? ""} onChange={(event) => setPriceModelId(Number(event.target.value))} className="w-full rounded-xl border border-cyan-300/30 bg-slate-950/55 px-3 py-2.5 text-sm font-black text-white outline-none focus:border-cyan-300">\n              {priceModels.map(model => <option key={model.id} value={model.id}>{model.label} — {asMoney(model.price)}</option>)}\n            </select>''',
              '''            <span className="mb-1.5 block text-xs font-bold text-cyan-200">{selectorLabel}</span>\n            <select value={priceModelId ?? ""} onChange={(event) => setPriceModelId(event.target.value ? Number(event.target.value) : null)} className="w-full rounded-xl border border-cyan-300/30 bg-slate-950/55 px-3 py-2.5 text-sm font-black text-white outline-none focus:border-cyan-300">\n              <option value="" disabled>Selecione...</option>\n              {priceModels.map(model => <option key={model.id} value={model.id}>{model.label} — {asMoney(model.price)}</option>)}\n            </select>\n            {!selectedPriceModel && <span className="mt-1.5 block text-[11px] font-semibold text-amber-300">Escolha uma opção para ver o valor e continuar.</span>}''',
              'select cliente')
          old_price = '''        <div className="mt-5 flex items-end justify-between gap-3">\n          <div>\n            {effectiveOriginalPrice && <p className="mb-0.5 text-xs font-semibold text-white/40 line-through">{asMoney(effectiveOriginalPrice)}</p>}\n            <p className="text-2xl font-black text-white" style={textColor ? { color: textColor } : undefined}>{asMoney(effectivePrice)}</p>\n            {discount > 0 && <p className="mt-0.5 text-xs font-bold text-emerald-300">Economize {discount}%</p>}\n          </div>\n          {item.product.deliveryDays && <span className="rounded-lg border border-white/20 bg-white/[0.08] px-2 py-1 text-right text-[11px] font-bold text-white/75 shadow-[inset_0_1px_0_rgba(255,255,255,.12)] backdrop-blur-xl">Prazo: {item.product.deliveryDays}</span>}\n        </div>'''
          new_price = '''        <div className="mt-5 flex items-end justify-between gap-3">\n          <div>\n            {requiresPriceModelSelection && !selectedPriceModel ? (\n              <p className="text-sm font-bold text-white/50">Valor disponível após a escolha</p>\n            ) : (\n              <>\n                {effectiveOriginalPrice && <p className="mb-0.5 text-xs font-semibold text-white/40 line-through">{asMoney(effectiveOriginalPrice)}</p>}\n                <p className="text-2xl font-black text-white" style={textColor ? { color: textColor } : undefined}>{asMoney(effectivePrice)}</p>\n                {discount > 0 && <p className="mt-0.5 text-xs font-bold text-emerald-300">Economize {discount}%</p>}\n              </>\n            )}\n          </div>\n          {item.product.deliveryDays && <span className="rounded-lg border border-white/20 bg-white/[0.08] px-2 py-1 text-right text-[11px] font-bold text-white/75 shadow-[inset_0_1px_0_rgba(255,255,255,.12)] backdrop-blur-xl">Prazo: {item.product.deliveryDays}</span>}\n        </div>'''
          s = replace_once(s, old_price, new_price, 'preco oculto card')
          s = replace_once(s,
              '''            onClick={() => onBuy(selectedTier, selectedPriceModel)}\n            className="min-h-12 rounded-xl border border-white/60 bg-white/95 px-3 py-3 text-sm font-black text-slate-950 shadow-[0_8px_24px_rgba(255,255,255,.14)] transition-all hover:bg-white hover:shadow-[0_8px_28px_rgba(255,255,255,.25)] active:scale-[0.98]"''',
              '''            disabled={requiresPriceModelSelection && !selectedPriceModel}\n            onClick={() => { if (!requiresPriceModelSelection || selectedPriceModel) onBuy(selectedTier, selectedPriceModel); }}\n            className="min-h-12 rounded-xl border border-white/60 bg-white/95 px-3 py-3 text-sm font-black text-slate-950 shadow-[0_8px_24px_rgba(255,255,255,.14)] transition-all hover:bg-white hover:shadow-[0_8px_28px_rgba(255,255,255,.25)] active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-35"''',
              'botao comprar obrigatorio')
          s = replace_once(s,
              '''            onClick={() => onAddToCart(selectedTier, selectedPriceModel)}\n            className="inline-flex min-h-12 items-center justify-center gap-2 rounded-xl border px-3 py-3 text-sm font-black text-white shadow-[0_8px_24px_rgba(0,0,0,.18)] backdrop-blur-xl transition-all hover:brightness-125 active:scale-[0.98]"''',
              '''            disabled={requiresPriceModelSelection && !selectedPriceModel}\n            onClick={() => { if (!requiresPriceModelSelection || selectedPriceModel) onAddToCart(selectedTier, selectedPriceModel); }}\n            className="inline-flex min-h-12 items-center justify-center gap-2 rounded-xl border px-3 py-3 text-sm font-black text-white shadow-[0_8px_24px_rgba(0,0,0,.18)] backdrop-blur-xl transition-all hover:brightness-125 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-35"''',
              'botao carrinho obrigatorio')
          p.write_text(s)

          # 4) Home/checkout: o mesmo preco escolhido precisa chegar ao resumo, carrinho e pedido final.
          p = Path('client/src/pages/Home.tsx')
          s = p.read_text()
          s = replace_once(s,
              'type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; };',
              'type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; selectorLabel?: string | null; };',
              'tipo Home')
          # Totais e resumos do carrinho.
          s = s.replace("const price = item.option?.price || '0';", "const price = item.priceModel?.price || item.option?.price || '0';")
          s = s.replace("<span className=\"text-green-400 font-bold text-sm\">{item.option?.price || 'Consulte'}</span>", "<span className=\"text-green-400 font-bold text-sm\">{item.priceModel?.price || item.option?.price || 'Consulte'}</span>")
          # Preco final de pedido unico: categoria > garantia > opcao.
          s = s.replace("const rawPrice = selectedTier?.price || selectedOption?.price;", "const rawPrice = selectedPriceModel?.price || selectedTier?.price || selectedOption?.price;")
          s = s.replace("nameOption: selectedOption?.label || 'N/A',\n            price: singlePrice,", "nameOption: selectedOption ? `${selectedOption.label}${selectedPriceModel ? ` — ${selectedPriceModel.label}` : ''}` : 'N/A',\n            price: singlePrice,")
          s = s.replace("nameOption: item.option?.label || 'N/A',\n            price: item.option?.price || ''", "nameOption: item.option ? `${item.option.label}${item.priceModel ? ` — ${item.priceModel.label}` : ''}` : 'N/A',\n            price: item.priceModel?.price || item.option?.price || ''")
          # Dependencia do autosave inclui a categoria selecionada.
          s = replace_once(s,
              '}, [step, selectedProduct, selectedOption, questionAnswers, questionAudioAnswers, questionAudioFlowId, clientName, clientPhone, clientCity, clientEmail, couponCode, carDocumentYear, cadastroSubStep, flowOrigin]);',
              '}, [step, selectedProduct, selectedOption, selectedPriceModel, questionAnswers, questionAudioAnswers, questionAudioFlowId, clientName, clientPhone, clientCity, clientEmail, couponCode, carDocumentYear, cadastroSubStep, flowOrigin]);',
              'dependencia autosave')
          p.write_text(s)

          # 5) Teste dirigido documentando as duas regras solicitadas.
          p = Path('server/optionPriceModelsFlow.test.ts')
          s = p.read_text()
          s = replace_once(s,
              "    expect(card).toContain('Modelo / categoria');\n    expect(card).toContain('selectedPriceModel');",
              "    expect(card).toContain('selectorLabel');\n    expect(card).toContain('Selecione...');\n    expect(card).toContain('Valor disponível após a escolha');\n    expect(card).toContain('disabled={requiresPriceModelSelection && !selectedPriceModel}');\n    expect(card).toContain('selectedPriceModel');",
              'teste card obrigatorio')
          s = replace_once(s,
              "    expect(admin).toContain('Não criam outro produto e não duplicam perguntas ou documentos.');",
              "    expect(admin).toContain('Nome do campo exibido ao cliente');\n    expect(router).toContain('optionPriceModelSettings');\n    expect(router).toContain('updateSettings');",
              'teste admin nome editavel')
          s = replace_once(s,
              "    expect(home).toContain('selectedPriceModel.price');",
              "    expect(home).toContain('selectedPriceModel.price');\n    expect(home).toContain('selectedPriceModel?.price || selectedTier?.price || selectedOption?.price');",
              'teste preco checkout')
          p.write_text(s)
          PY
      - name: Validar whitespace
        run: git diff --check
      - run: pnpm install --frozen-lockfile
      - name: Teste direcionado
        run: pnpm exec vitest run server/optionPriceModelsFlow.test.ts
      - name: Build de producao
        run: pnpm build
      - name: Remover workflow temporario
        run: rm -f .github/workflows/fix-price-category-ux.yml
      - name: Commit da correcao validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/optionPriceModels.ts client/src/pages/AdminProducts.tsx client/src/components/StorefrontProductCard.tsx client/src/pages/Home.tsx server/optionPriceModelsFlow.test.ts
          git add -u .github/workflows/fix-price-category-ux.yml
          git commit -m "fix(products): exigir categoria e permitir titulo editavel"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
