name: Chassis service validation
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'server/chassisService*'
      - 'server/routers/chassisService.ts'
      - 'server/routers/vinRegistry.ts'
      - 'server/routers.ts'
      - 'shared/chassisService.ts'
      - 'drizzle/chassis-service.sql'
      - 'client/src/pages/*Chassis*'
      - 'client/src/pages/GeradorChassiPublico.tsx'
      - 'client/src/main.tsx'
      - 'client/src/App.tsx'
      - 'scripts/apply-chassis-service-migration.ts'
      - '.github/workflows/chassis-service-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: chassis_service_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CHASSIS_TEST_DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/chassis_service_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Login and credit unit checks
        run: pnpm vitest run server/chassisServiceCore.test.ts server/chassisServiceRouter.test.ts
      - name: Type checks for service files
        run: |
          pnpm exec tsc --noEmit --pretty false > /tmp/chassis-types.log 2>&1 || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const output = fs.readFileSync('/tmp/chassis-types.log', 'utf8');
          const errors = output.split('\n').filter(line => /^(server\/(chassisService[^/]*|routers\/chassisService\.ts)|shared\/chassisService\.ts|client\/src\/pages\/(AdminChassisPage|ChassisCustomerPage|GeradorChassiPublico)\.tsx)\(/.test(line));
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          if (output.trim() && !/error TS\d+/.test(output)) { console.error(output); process.exit(1); }
          console.log('Tipos do serviço verificados. Diagnósticos anteriores de outras áreas não fazem parte desta alteração.');
          JS
      - name: Isolated database, concurrency, purchases and rollback
        run: pnpm vitest run server/chassisServiceMysql.test.ts
      - name: Production bundle
        run: pnpm run build
