name: Fix most chosen default production 2026-09-07

# trigger v2
on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/fix-most-chosen-default-prod-20260907.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - name: Patch selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/components/StorefrontProductCard.tsx')
          s=p.read_text(encoding='utf-8')
          old='''  const selectablePriceModels = priceModels.filter(model => !isVipOnlyLocked(model, isVipCustomer));\n  const preferredModel = selectablePriceModels[Math.min(1, Math.max(0, selectablePriceModels.length - 1))] || selectablePriceModels[0] || null;\n  const [priceModelId, setPriceModelId] = useState<number | null>(preferredModel?.id ?? null);'''
          new='''  const selectablePriceModels = priceModels.filter(model => !isVipOnlyLocked(model, isVipCustomer));\n  const mostChosenModel = priceModels[1] || null;\n  const preferredModel = mostChosenModel && !isVipOnlyLocked(mostChosenModel, isVipCustomer)\n    ? mostChosenModel\n    : selectablePriceModels[0] || null;\n  const [priceModelId, setPriceModelId] = useState<number | null>(preferredModel?.id ?? null);'''
          if old not in s: raise SystemExit('initial selection block not found')
          s=s.replace(old,new,1)
          old2='''    if (!selectablePriceModels.some((model) => model.id === priceModelId)) {\n      setPriceModelId(selectablePriceModels[Math.min(1, Math.max(0, selectablePriceModels.length - 1))]?.id ?? selectablePriceModels[0]?.id ?? null);\n    }'''
          new2='''    if (!selectablePriceModels.some((model) => model.id === priceModelId)) {\n      const nextDefault = mostChosenModel && !isVipOnlyLocked(mostChosenModel, isVipCustomer)\n        ? mostChosenModel\n        : selectablePriceModels[0] || null;\n      setPriceModelId(nextDefault?.id ?? null);\n    }'''
          if old2 not in s: raise SystemExit('fallback selection block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm vitest run server/vipPricing.test.ts
          pnpm build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/StorefrontProductCard.tsx
          git commit -m "fix(storefront): manter mais escolhida como padrao"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
