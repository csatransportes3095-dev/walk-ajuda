name: Apply Schedule Central Update V2

on:
  push:
    branches:
      - fix/agendamento-atualizacao-central-20260830
    paths:
      - scripts/fix-schedule-central-update-v2.mjs
      - .github/workflows/apply-schedule-central-update-v2.yml
      - .github/schedule-central-update-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve and repair patch script
        run: |
          cp scripts/fix-schedule-central-update-v2.mjs /tmp/fix-schedule-central-update-v2.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/fix-schedule-central-update-v2.mjs')
          s = p.read_text()
          old = 'expect(page).toContain("const returnTo = `/agendar/${token}`");'
          new = 'expect(page).toContain("const returnTo = \\`/agendar/\\${token}\\`");'
          if old not in s:
              raise SystemExit('embedded template assertion not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Start clean branch from current production
        run: |
          git fetch origin main
          git checkout -B fix/agendamento-cadastro-central-final-20260830 origin/main
          node /tmp/fix-schedule-central-update-v2.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for validation
        run: pnpm install --no-frozen-lockfile

      - name: Restore repository lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Run focused profile and schedule tests
        run: pnpm exec vitest run server/customerProfile.test.ts server/scheduleProfileGuard.test.ts server/customerUpdateReturnPath.test.ts server/scheduleCentralUpdateWiring.test.ts

      - name: TypeScript check with compatible existing config
        run: |
          cp tsconfig.json /tmp/tsconfig.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsconfig.json')
          s = p.read_text()
          s = s.replace('"ignoreDeprecations": "6.0"', '"ignoreDeprecations": "5.0"')
          p.write_text(s)
          PY
          pnpm check
          cp /tmp/tsconfig.json tsconfig.json

      - name: Production build
        run: pnpm build

      - name: Ensure unrelated config stayed untouched
        run: |
          git checkout -- tsconfig.json pnpm-lock.yaml
          git status --short

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/customerUpdateReturnPath.ts client/src/components/CustomerProfileRedirectGate.tsx client/src/pages/AtualizarCadastro.tsx client/src/pages/SchedulePage.tsx server/scheduleProfileGuard.ts server/routers/schedule.ts server/scheduleProfileGuard.test.ts server/customerUpdateReturnPath.test.ts server/scheduleCentralUpdateWiring.test.ts
          git commit -m "fix(schedule): exigir atualização central antes do agendamento"
          git push origin HEAD:refs/heads/fix/agendamento-cadastro-central-final-20260830
