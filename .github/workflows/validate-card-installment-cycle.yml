name: Validate card installment billing cycle
on:
  push:
    branches: [fix/cartao-ciclo-vencimento-parcelas-20261001]
    paths:
      - 'server/cartaoInstallmentSchedule.ts'
      - 'server/cartaoInstallmentSchedule.test.ts'
      - 'server/routers/cartoes.ts'
      - 'client/src/pages/CartaoDetailPage.tsx'
      - 'scripts/repair-card-installments-created-20261001.ts'
      - 'scripts/render-start.sh'
      - '.github/workflows/validate-card-installment-cycle.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Billing-cycle regression tests
        run: pnpm exec vitest run server/cartaoInstallmentSchedule.test.ts server/cartaoRetroactivePurchase.test.ts server/cardInvoicePresentation.test.ts server/cardManualSettlementRecovery.test.ts
      - name: Boot script syntax
        run: sh -n scripts/render-start.sh
      - name: Production build
        run: pnpm build
