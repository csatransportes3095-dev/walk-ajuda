name: Menu Principais Rotas

on:
  push:
    branches:
      - feat/menu-principais-rotas-2026-09-12
    paths:
      - .github/workflows/menu-principais-rotas-20260912.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/menu-principais-rotas-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        run: python scripts/apply_primary_route_menu_20260912.py
      - name: Assert routes
        run: |
          test "$(grep -c "window.location.href = '/acompanhar'" client/src/pages/Home.tsx)" -eq 1
          test "$(grep -c "window.location.href = '/emprestimo'" client/src/pages/Home.tsx)" -eq 1
          test "$(grep -c "window.location.href = '/gastos'" client/src/pages/Home.tsx)" -eq 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Home TypeScript
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep "client/src/pages/Home.tsx" /tmp/tsc.log > /tmp/home-errors.log || true
          if [ -s /tmp/home-errors.log ]; then cat /tmp/home-errors.log; exit 1; fi
          echo "No new Home.tsx TypeScript errors."
      - name: Check diff
        run: git diff --check
      - name: Commit clean menu change
        shell: bash
        run: |
          git config user.name "h2-menu-guard"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin recovery/organizar-salvos-2026-08-24
          git checkout origin/recovery/organizar-salvos-2026-08-24 -- .github/workflows/fix-loan-settlement-reconciliation-20260907.yml
          git rm .github/workflows/menu-principais-rotas-20260912.yml scripts/apply_primary_route_menu_20260912.py
          git add client/src/pages/Home.tsx .github/workflows/fix-loan-settlement-reconciliation-20260907.yml
          git commit -m "feat(menu): organize primary customer routes"
          git push origin HEAD:feat/menu-principais-rotas-2026-09-12
