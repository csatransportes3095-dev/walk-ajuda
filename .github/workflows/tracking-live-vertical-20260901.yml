name: Tracking live vertical validation

on:
  push:
    branches:
      - feat/tracking-live-vertical-20260901
    paths:
      - ".github/workflows/tracking-live-vertical-20260901.yml"
      - "scripts/patch-tracking-live-vertical-20260901.py"
      - "server/orderTrackingLiveVertical.test.ts"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: "tracking-live-vertical-test-secret-20260901-minimum-32-chars"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tracking-live-vertical-20260901
          fetch-depth: 0
      - name: Apply tracking patch
        run: python3 scripts/patch-tracking-live-vertical-20260901.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tracking and progress tests
        run: pnpm vitest run server/orderTrackingLiveVertical.test.ts server/orderProgressSequence.test.ts server/globalOrderProgressIntegration.test.ts server/adminOrdersOperationalFilters.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/OrderTracking.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat(tracking): jornada vertical ao vivo [skip ci]"
          git push origin HEAD:feat/tracking-live-vertical-20260901
