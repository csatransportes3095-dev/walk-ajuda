name: Pedidos - Confirmacao para Foto WhatsApp
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'client/src/components/OrderPhotoConfirmation.tsx'
      - 'client/src/lib/photoConfirmationWhatsappMessage.ts'
      - 'server/photoConfirmationWhatsappMessage.test.ts'
      - '.github/workflows/photo-confirmation-whatsapp-message.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar mensagem com nome agendamento e confirmacao obrigatoria
        run: pnpm exec vitest run client/src/lib/photoConfirmationWhatsappMessage.test.ts
      - name: Compilar site e servidor
        run: pnpm build
