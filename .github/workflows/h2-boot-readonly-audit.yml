name: H2 Boot Readonly Audit Safety
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'scripts/render-start.sh'
      - 'server/_core/index.ts'
      - 'server/bootReadonlyAuditSafety.test.ts'
      - '.github/workflows/h2-boot-readonly-audit.yml'
permissions:
  contents: read
jobs:
  boot-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/bootReadonlyAuditSafety.test.ts
      - name: Verify Docker patch compatibility with runtime route
        run: node scripts/patch-media-local-export-20260910.mjs
      - run: pnpm build
