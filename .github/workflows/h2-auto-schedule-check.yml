name: Validate H2 AUTO schedule integration
on:
  push:
    branches: [feature/h2-auto-agendamento-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2-auto-order-schedule.test.ts server/h2-auto-order-history.test.ts
      - run: pnpm exec esbuild server/h2-auto-orders.ts --bundle --platform=node --packages=external --format=esm --outfile=/tmp/h2-auto-schedule-check.js
