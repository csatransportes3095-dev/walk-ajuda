          def write(file: str, content: str) -> None:
              Path(file).write_text(content, encoding="utf-8")

          def replace_required(file: str, old: str, new: str, count: int = 1) -> None:
              text = read(file)
              if old not in text:
                  raise SystemExit(f"Trecho esperado não encontrado em {file}: {old[:140]!r}")
              write(file, text.replace(old, new, count))

          def regex_required(file: str, pattern: str, replacement: str, flags: int = 0) -> None:
              text = read(file)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
