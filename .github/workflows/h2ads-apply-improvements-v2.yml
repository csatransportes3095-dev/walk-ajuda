              r'  try \{\n    while \(\$true\) \{\n      try \{ Invoke-WorkerHeartbeat \$config \} catch \{ \}\n      try \{ Invoke-PendingBrowserCommand \$config \} catch \{ \}\n      Start-Sleep -Seconds 10\n    \}\n  \} finally \{',
              textwrap.dedent('''\
                $nextHeartbeatAt = Get-Date
                try {
                  while ($true) {
                    $now = Get-Date
                    if ($now -ge $nextHeartbeatAt) {
