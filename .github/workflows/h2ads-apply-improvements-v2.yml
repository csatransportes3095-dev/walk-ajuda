      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused tests
        run: pnpm vitest run server/h2adsProxySecurity.test.ts server/h2adsWorkerRoute.test.ts server/h2adsWorkerFoundation.test.ts server/h2adsDesktopRotation.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Build production bundle
        run: pnpm build

