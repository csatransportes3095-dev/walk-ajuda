name: Apply H2 Ads improvements v2

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/h2ads-apply-improvements-v2.yml"

permissions:
  contents: write

concurrency:
  group: h2ads-apply-improvements-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply controlled H2 Ads improvements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
