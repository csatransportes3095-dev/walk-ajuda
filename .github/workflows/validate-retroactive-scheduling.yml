name: Validate retroactive scheduling fix
on:
  push:
    branches:
      - fix/agendamento-retroativo-pedidos-antigos-20260921

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: TypeScript diagnostic
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/check.log 2>&1
          rc=$?
          cat /tmp/check.log
          if grep -E "server/autoSchedule\.ts|server/routers/schedule\.ts" /tmp/check.log | grep -q "error TS"; then
            echo "TypeScript error found in retroactive scheduling files."
            exit 1
          fi
          echo "No TypeScript errors in the server scheduling files changed by this fix. Repository-wide check exit code: $rc"
          exit 0
      - run: pnpm build
