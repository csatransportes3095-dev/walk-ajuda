name: Validate retroactive scheduling fix
on:
  push:
    branches:
      - fix/agendamento-retroativo-pedidos-antigos-20260921

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
