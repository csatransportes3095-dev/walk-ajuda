name: Fix AtualizarCadastro Loop

on:
  push:
    branches:
      - fix/atualizarcadastro-loop-home

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atualizarcadastro-loop-home
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply guarded loop fix
        run: node scripts/fix-atualizarcadastro-loop.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AtualizarCadastro.tsx server/routers/customerUpdate.ts
          git rm -f scripts/fix-atualizarcadastro-loop.mjs .github/workflows/fix-atualizarcadastro-loop.yml
          git commit -m "fix(cadastro): sair do loop apos atualizacao [skip ci]"
          git push origin HEAD:fix/atualizarcadastro-loop-home
