name: H2 Safe Foto Analise Fix

on:
  push:
    branches:
      - fix/h2-foto-analise-safe-20260901
    paths:
      - "scripts/apply-h2-foto-analise-safe.py"
      - ".github/workflows/h2-safe-foto-analise.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply-h2-foto-analise-safe.py

      - name: Validate diff
        run: git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused tests
        run: pnpm vitest run server/scheduleOrderSync.test.ts server/adminOrdersOperationalFilters.test.ts server/h2FotoAnaliseSafe.test.ts

      # O branch estável já possui erros antigos de `pnpm check` fora deste patch.
      # A validação de segurança desta mudança usa regressões focadas + o mesmo build
      # que o Render executa para gerar o bundle de produção.
      - name: Production build
        run: pnpm build

      - name: Commit validated code only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server/routers.ts server/scheduleOrderSync.test.ts server/h2FotoAnaliseSafe.test.ts
          git commit -m "fix(h2): concluir agenda ao entrar em Foto em Analise com fallback seguro"
          git push origin HEAD:fix/h2-foto-analise-safe-20260901
