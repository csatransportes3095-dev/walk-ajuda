name: Temporary Auto Schedule Validation

on:
  push:
    branches:
      - feature/agendamento-automatico-vitrine-20260920

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Targeted automatic scheduling isolation tests
        run: pnpm vitest run server/autoScheduleIsolation.test.ts
      - name: Type check (baseline repository currently has unrelated errors)
        continue-on-error: true
        run: pnpm check
      - name: Production build
        run: pnpm build
