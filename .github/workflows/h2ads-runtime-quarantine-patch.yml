name: H2ADS Runtime Quarantine Patch

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - scripts/patch-h2ads-runtime-quarantine-20260903.py
      - .github/workflows/h2ads-runtime-quarantine-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply runtime quarantine patch
        run: python3 scripts/patch-h2ads-runtime-quarantine-20260903.py

      - name: Validate JavaScript syntax
        run: node --check workers/windows/browser-session.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit patched H2ADS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/windows/browser-session.mjs server/h2adsWorkerRoute.ts server/h2ads.ts client/src/pages/H2Ads.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(h2ads): quarentena ao detectar Google Sorry"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
