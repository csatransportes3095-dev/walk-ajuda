name: VIP Order Bind Hardening

on:
  push:
    branches:
      - feat/vip-parcelamento-seguro-2026-09-12
    paths:
      - .github/workflows/vip-order-bind-hardening-20260912.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply server-side order binding
        run: python scripts/apply_vip_order_bind_hardening_20260912.py
      - name: Assert order binding invariants
        shell: bash
        run: |
          grep -n "vipInstallmentCheckoutToken" server/routers.ts client/src/pages/Home.tsx
          grep -n "bindVipInstallmentCheckoutOrder" server/routers.ts server/vipInstallmentContracts.ts
          grep -n "recoverCheckout" server/routers/vipInstallments.ts client/src/pages/Home.tsx
          git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts shared/vipInstallments.test.ts
      - name: Check new VIP TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(server/routers\.ts|server/routers/vipInstallments\.ts|server/vipInstallmentContracts\.ts|server/vipInstallmentPricing\.ts|server/vipInstallmentProductRules\.ts|shared/vipInstallments\.ts|client/src/pages/Home\.tsx|client/src/components/VipInstallmentCheckoutBox\.tsx|client/src/pages/VipInstallmentPayments\.tsx)" /tmp/tsc.log > /tmp/vip-errors.log || true
          grep -vE "server/routers\.ts\([0-9]+,[0-9]+\): error TS2304: Cannot find name 'listOrderStatusTypes'\." /tmp/vip-errors.log > /tmp/vip-new-errors.log || true
          if [ -s /tmp/vip-new-errors.log ]; then
            cat /tmp/vip-new-errors.log
            exit 1
          fi
          echo "No new VIP order-binding TypeScript errors."
      - name: Commit validated order binding and remove temporary guard
        shell: bash
        run: |
          git config user.name "h2-vip-guard"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vip-order-bind-hardening-20260912.yml scripts/apply_vip_order_bind_hardening_20260912.py
          git add server/routers.ts server/routers/vipInstallments.ts server/vipInstallmentContracts.ts client/src/pages/Home.tsx
          git commit -m "fix(vip): bind persisted order to checkout token"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
