name: Validar instalador H2 AUTO assinado
on:
  push:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - client/public/downloads/H2_AUTO_1_16_INSTALAR.apk
      - client/public/downloads/h2-auto-release.json
      - .github/workflows/publish-h2-auto-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static APK inspection library
        run: python -m pip install 'androguard==4.1.3'
      - name: Validate promoted release, without temporary external URLs
        run: |
          python - <<'PY'
          import json, hashlib, re
          from pathlib import Path
          from androguard.core.apk import APK
          from loguru import logger
          logger.remove()
          root = Path('client/public/downloads')
          metadata = json.loads((root / 'h2-auto-release.json').read_text())
          assert re.fullmatch(r'H2_AUTO_[0-9_]+_INSTALAR\.apk', metadata['apkFile'])
          p = root / metadata['apkFile']
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == metadata['sha256']
          a = APK(str(p))
          assert a.get_package() == metadata['packageName'] == 'com.h2colombiano.auto'
          assert int(a.get_androidversion_code()) == metadata['versionCode'] >= 16
          assert a.get_androidversion_name() == metadata['versionName']
          expected = '3215b6d6b643ae6b57ffaf6e4854a40be267d4816166255872410c696384b393'
          fingerprints = [hashlib.sha256(c.dump()).hexdigest() for c in a.get_certificates()]
          assert fingerprints == [expected]
          assert metadata['certificateSha256'] == expected
          assert re.fullmatch(r'[a-f0-9]{40}', metadata['commit'])
          assert isinstance(metadata['workflowRun'], int) and metadata['workflowRun'] > 0
          assert b'AudioTranscriber' in a.get_dex() and b'MediaReplyPolicy' in a.get_dex()
          print('Verified H2 AUTO', metadata['versionName'], 'same certificate as 1.15')
          PY
