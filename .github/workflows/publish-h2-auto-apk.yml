name: Publicar instalador H2 AUTO 1.7 no site
on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/publish-h2-auto-apk.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h2-auto-site-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
      - name: Baixar APK com deduplicacao de notificacoes e textos de cadastro corrigidos
        env:
          ZIP_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e0b0-820e-9e65-60ff73ef4f08/raw?se=2026-10-25T23%3A22%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=c30dedb3-f145-5179-a38a-4796670f58ab&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T02%3A14%3A57Z&ske=2026-10-26T02%3A14%3A57Z&sks=b&skv=2026-02-06&sig=nYkfhpS4Qh6pLzpx4vdr/OS6K4%2BPFChmkFj7cbz644E%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --silent --show-error "$ZIP_URL" --output /tmp/h2-auto-1-7-build.zip
          unzip -t /tmp/h2-auto-1-7-build.zip
          mkdir -p client/public/downloads
          unzip -p /tmp/h2-auto-1-7-build.zip app-debug.apk > client/public/downloads/H2_AUTO_1_7_INSTALAR.apk
          echo 'Package contents checked by unzip -t'
          test "$(stat -c '%s' client/public/downloads/H2_AUTO_1_7_INSTALAR.apk)" -gt 35000
      - name: Publicar APK diretamente em h2colombiano.com/downloads
        run: |
          set -euo pipefail
          git config user.name "H2 Auto Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/downloads/H2_AUTO_1_7_INSTALAR.apk
          if git diff --cached --quiet; then
            echo "APK ja publicado na arvore de codigo."
          else
            git commit -m "fix(h2-auto): APK com respostas sem duplicacao e cadastro objetivo"
            git pull --rebase origin recovery/organizar-salvos-2026-08-24
            git push origin HEAD:recovery/organizar-salvos-2026-08-24
          fi
