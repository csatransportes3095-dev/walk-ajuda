name: VIP Entry Validation

on:
  push:
    branches:
      - feat/vip-entrada-global-2026-09-12
    paths:
      - .github/workflows/product-manifest-acceptance.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-entrada-global-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply entry patch
        run: python scripts/apply_vip_entry_global_20260912.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run shared/vipInstallments.test.ts server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts
      - name: Check VIP TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(shared/vipInstallments\.ts|shared/vipInstallments\.test\.ts|server/routers/vipInstallments\.ts|client/src/components/AdminVipInstallmentsPanel\.tsx|client/src/components/VipInstallmentCheckoutBox\.tsx)" /tmp/tsc.log > /tmp/vip-errors.log || true
          if [ -s /tmp/vip-errors.log ]; then cat /tmp/vip-errors.log; exit 1; fi
          echo "No new VIP entry TypeScript errors."
      - name: Check diff
        run: git diff --check
      - name: Commit validated entry
        shell: bash
        run: |
          git config user.name "h2-vip-fix"
          git config user.email "actions@users.noreply.github.com"
          git checkout c81b3940b6b86bc6f45d6ab946668933987f603c -- .github/workflows/product-manifest-acceptance.yml
          git rm .github/workflows/vip-entry-global-20260912.yml scripts/apply_vip_entry_global_20260912.py
          git add shared/vipInstallments.ts shared/vipInstallments.test.ts server/routers/vipInstallments.ts client/src/components/AdminVipInstallmentsPanel.tsx client/src/components/VipInstallmentCheckoutBox.tsx .github/workflows/product-manifest-acceptance.yml
          git commit -m "feat(vip): add configurable global entry"
          git push origin HEAD:feat/vip-entrada-global-2026-09-12
