          s = p.read_text()
          s = replace_once(s,
              '''type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; selectorLabel?: string | null; };\n\ntype ProductOption = {''',
              '''type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; selectorLabel?: string | null; };\ntype ProductManifest = { enabled: boolean; title: string; body: string; acceptLabel: string; buttonLabel: string; };\n\ntype ProductOption = {''',
              'tipo manifesto Home')
          s = replace_once(s,
              '''  deliveryDays?: string | null;\n  options: ProductOption[];''',
              '''  deliveryDays?: string | null;\n  manifest?: ProductManifest | null;\n  options: ProductOption[];''',
              'manifesto no Product Home')
          s = replace_once(s,
              '''  const baseProducts = rawProducts as unknown as Product[] | undefined;\n  const optionIds = useMemo''',
              '''  const baseProducts = rawProducts as unknown as Product[] | undefined;\n  const { data: settings } = trpc.settings.getAll.useQuery();\n  const optionIds = useMemo''',
              'settings antes do merge')
          old_products = '''    return baseProducts.map(product => ({\n      ...product,\n      options: product.options.map(option => ({ ...option, priceModels: byOption.get(option.id) || [] })),\n    }));\n  }, [baseProducts, activeOptionPriceModels]);\n  const { data: settings } = trpc.settings.getAll.useQuery();'''
          new_products = '''    return baseProducts.map(product => {\n      let manifest: ProductManifest | null = null;\n      const rawManifest = (settings as Record<string, string> | undefined)?.[`product_manifest_${product.id}`];\n      if (rawManifest) {\n        try {\n          const parsed = JSON.parse(rawManifest);\n          manifest = {\n            enabled: parsed?.enabled === true,\n            title: String(parsed?.title || 'Antes de continuar'),\n            body: String(parsed?.body || ''),\n            acceptLabel: String(parsed?.acceptLabel || 'Li, entendi e aceito as condições acima.'),\n            buttonLabel: String(parsed?.buttonLabel || 'ACEITAR E CONTINUAR'),\n          };\n        } catch { manifest = null; }\n      }\n      return {\n        ...product,\n        manifest,\n        options: product.options.map(option => ({ ...option, priceModels: byOption.get(option.id) || [] })),\n      };\n    });\n  }, [baseProducts, activeOptionPriceModels, settings]);'''
          s = replace_once(s, old_products, new_products, 'merge manifesto Home')
          p.write_text(s)

          # Card público: manifesto obrigatório ao selecionar ação/categoria ou antes de comprar.
          p = Path('client/src/components/StorefrontProductCard.tsx')
          s = p.read_text()
          s = replace_once(s,
              '''  deliveryDays?: string | null;\n};''',
              '''  deliveryDays?: string | null;\n  manifest?: { enabled: boolean; title: string; body: string; acceptLabel: string; buttonLabel: string } | null;\n};''',
              'manifesto no StorefrontProduct')
          s = replace_once(s,
              '''  const [priceModelId, setPriceModelId] = useState<number | null>(null);\n  const selectedPriceModel = priceModels.find((model) => model.id === priceModelId) || null;\n  const requiresPriceModelSelection = priceModels.length > 0;''',
              '''  const [priceModelId, setPriceModelId] = useState<number | null>(null);\n  const selectedPriceModel = priceModels.find((model) => model.id === priceModelId) || null;\n  const manifest = item.product.manifest;\n  const manifestEnabled = manifest?.enabled === true && !!manifest.body.trim();\n  const [manifestOpen, setManifestOpen] = useState(false);\n  const [manifestChecked, setManifestChecked] = useState(false);\n  const [manifestAcceptedKey, setManifestAcceptedKey] = useState<string | null>(null);\n  const [pendingPriceModelId, setPendingPriceModelId] = useState<number | null>(null);\n  const [pendingAction, setPendingAction] = useState<'buy' | 'cart' | null>(null);\n  const requiresPriceModelSelection = priceModels.length > 0;''',
              'estado manifesto card')
          s = replace_once(s,
              '''  const glassBackground = cardBackground\n    ? `linear-gradient(145deg, rgba(255,255,255,0.12) 0%, rgba(15,23,42,0.60) 42%, rgba(2,6,23,0.90) 100%), ${cardBackground}`\n    : "linear-gradient(145deg, rgba(30,41,59,0.72) 0%, rgba(8,15,32,0.88) 48%, rgba(2,6,23,0.96) 100%)";\n\n  return (''',
              '''  const glassBackground = cardBackground\n    ? `linear-gradient(145deg, rgba(255,255,255,0.12) 0%, rgba(15,23,42,0.60) 42%, rgba(2,6,23,0.90) 100%), ${cardBackground}`\n    : "linear-gradient(145deg, rgba(30,41,59,0.72) 0%, rgba(8,15,32,0.88) 48%, rgba(2,6,23,0.96) 100%)";\n  const currentManifestKey = selectedPriceModel ? `price:${selectedPriceModel.id}` : `base:${item.option.id}`;\n  const pendingPriceModel = priceModels.find(model => model.id === pendingPriceModelId) || selectedPriceModel;\n\n  const openManifest = (nextPriceModelId: number | null, action: 'buy' | 'cart' | null = null) => {\n    setPendingPriceModelId(nextPriceModelId);\n    setPendingAction(action);\n    setManifestChecked(false);\n    setManifestOpen(true);\n  };\n\n  const closeManifest = () => {\n    setManifestOpen(false);\n    setManifestChecked(false);\n    setPendingPriceModelId(null);\n    setPendingAction(null);\n  };\n\n  const acceptManifest = () => {\n    if (!manifestChecked) return;\n    const resolvedId = pendingPriceModelId ?? priceModelId;\n    const resolvedModel = priceModels.find(model => model.id === resolvedId) || selectedPriceModel;\n    if (pendingPriceModelId !== null) setPriceModelId(pendingPriceModelId);\n    setManifestAcceptedKey(resolvedId ? `price:${resolvedId}` : `base:${item.option.id}`);\n    const action = pendingAction;\n    setManifestOpen(false);\n    setManifestChecked(false);\n    setPendingPriceModelId(null);\n    setPendingAction(null);\n    if (action === 'buy') onBuy(selectedTier, resolvedModel);\n    if (action === 'cart') onAddToCart(selectedTier, resolvedModel);\n  };\n\n  const triggerAction = (action: 'buy' | 'cart') => {\n    if (requiresPriceModelSelection && !selectedPriceModel) return;\n    if (manifestEnabled && manifestAcceptedKey !== currentManifestKey) {\n      openManifest(selectedPriceModel?.id ?? null, action);\n      return;\n    }\n    if (action === 'buy') onBuy(selectedTier, selectedPriceModel);\n    else onAddToCart(selectedTier, selectedPriceModel);\n  };\n\n  return (\n    <>''',
              'funcoes manifesto card')
          s = replace_once(s,
              '''            <select value={priceModelId ?? ""} onChange={(event) => setPriceModelId(event.target.value ? Number(event.target.value) : null)} className="w-full rounded-xl border border-cyan-300/30 bg-slate-950/55 px-3 py-2.5 text-sm font-black text-white outline-none focus:border-cyan-300">''',
              '''            <select value={priceModelId ?? ""} onChange={(event) => { const nextId = event.target.value ? Number(event.target.value) : null; if (nextId == null) return; if (manifestEnabled) { openManifest(nextId); return; } setPriceModelId(nextId); }} className="w-full rounded-xl border border-cyan-300/30 bg-slate-950/55 px-3 py-2.5 text-sm font-black text-white outline-none focus:border-cyan-300">''',
              'selecao abre manifesto')
          s = replace_once(s,
