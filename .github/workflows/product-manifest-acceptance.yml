          git add client/src/pages/AdminProducts.tsx client/src/pages/Home.tsx client/src/components/StorefrontProductCard.tsx server/productManifestFlow.test.ts
          git add -u .github/workflows/product-manifest-acceptance.yml
          git commit -m "feat(products): manifesto editavel com aceite obrigatorio"
