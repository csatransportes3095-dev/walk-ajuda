name: VIP Entry Plus Installments

on:
  push:
    branches:
      - fix/vip-entrada-mais-parcelas-2026-09-12
    paths:
      - .github/workflows/product-manifest-acceptance.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vip-entrada-mais-parcelas-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        run: python scripts/apply_vip_entry_plus_installments_20260912.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run shared/vipInstallments.test.ts server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts
      - name: Check VIP TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(shared/vipInstallments\.ts|shared/vipInstallments\.test\.ts|server/vipInstallmentContracts\.ts|client/src/components/VipInstallmentCheckoutBox\.tsx|client/src/pages/VipInstallmentPayments\.tsx|client/src/components/AdminVipReceivablesPanel\.tsx)" /tmp/tsc.log > /tmp/vip-errors.log || true
          if [ -s /tmp/vip-errors.log ]; then cat /tmp/vip-errors.log; exit 1; fi
          echo "No new VIP TypeScript errors."
      - name: Check diff
        run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "h2-vip-fix"
          git config user.email "actions@users.noreply.github.com"
          git checkout 428b15fb73e1e6dd55a498ae6546aafcad256226 -- .github/workflows/product-manifest-acceptance.yml
          git rm scripts/apply_vip_entry_plus_installments_20260912.py
          git add shared/vipInstallments.ts shared/vipInstallments.test.ts server/vipInstallmentContracts.ts client/src/components/VipInstallmentCheckoutBox.tsx client/src/pages/VipInstallmentPayments.tsx client/src/components/AdminVipReceivablesPanel.tsx .github/workflows/product-manifest-acceptance.yml
          git commit -m "fix(vip): separate entry from installment count"
          git push origin HEAD:fix/vip-entrada-mais-parcelas-2026-09-12
