name: Product Manifest Acceptance

on:
  push:
    branches:
      - feat/product-manifest-acceptance-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Implementar manifesto por produto
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Trecho nao encontrado: {label}')
              return text.replace(old, new, 1)

          # ADM: editor do manifesto dentro do produto.
          p = Path('client/src/pages/AdminProducts.tsx')
          s = p.read_text()
          anchor = '''const PRESET_COLORS = [\n'''
          component = r'''type ProductManifestConfig = {
  enabled: boolean;
  title: string;
  body: string;
  acceptLabel: string;
  buttonLabel: string;
};

const DEFAULT_PRODUCT_MANIFEST: ProductManifestConfig = {
  enabled: false,
  title: 'Antes de continuar',
  body: '',
  acceptLabel: 'Li, entendi e aceito as condições acima.',
  buttonLabel: 'ACEITAR E CONTINUAR',
};

function parseProductManifest(raw: unknown): ProductManifestConfig {
  if (typeof raw !== 'string' || !raw.trim()) return DEFAULT_PRODUCT_MANIFEST;
  try {
    const parsed = JSON.parse(raw);
    return {
      enabled: parsed?.enabled === true,
      title: String(parsed?.title || DEFAULT_PRODUCT_MANIFEST.title),
      body: String(parsed?.body || ''),
      acceptLabel: String(parsed?.acceptLabel || DEFAULT_PRODUCT_MANIFEST.acceptLabel),
      buttonLabel: String(parsed?.buttonLabel || DEFAULT_PRODUCT_MANIFEST.buttonLabel),
    };
  } catch {
    return DEFAULT_PRODUCT_MANIFEST;
  }
}

function ProductManifestEditor({ productId }: { productId: number }) {
  const key = `product_manifest_${productId}`;
  const utils = trpc.useUtils();
  const { data: settings } = trpc.settings.getAll.useQuery();
  const [enabled, setEnabled] = useState(false);
  const [title, setTitle] = useState(DEFAULT_PRODUCT_MANIFEST.title);
  const [body, setBody] = useState('');
  const [acceptLabel, setAcceptLabel] = useState(DEFAULT_PRODUCT_MANIFEST.acceptLabel);
  const [buttonLabel, setButtonLabel] = useState(DEFAULT_PRODUCT_MANIFEST.buttonLabel);

  React.useEffect(() => {
    const config = parseProductManifest((settings as Record<string, string> | undefined)?.[key]);
    setEnabled(config.enabled);
    setTitle(config.title);
    setBody(config.body);
    setAcceptLabel(config.acceptLabel);
    setButtonLabel(config.buttonLabel);
  }, [settings, key]);

  const saveMut = trpc.settings.update.useMutation({
    onSuccess: () => {
      utils.settings.getAll.invalidate();
      toast.success('Manifesto do produto salvo!');
    },
  });

  const save = () => {
    if (enabled && !body.trim()) {
      toast.error('Digite o texto do manifesto antes de ativar.');
      return;
    }
    if (!title.trim() || !acceptLabel.trim() || !buttonLabel.trim()) {
      toast.error('Preencha título, frase de aceite e botão.');
      return;
    }
    const config: ProductManifestConfig = {
      enabled,
      title: title.trim(),
      body: body.trim(),
      acceptLabel: acceptLabel.trim(),
      buttonLabel: buttonLabel.trim(),
    };
    saveMut.mutate({ settings: { [key]: JSON.stringify(config) } });
  };

  return (
    <div className="rounded-xl border-2 border-amber-500/30 bg-amber-950/10 p-4 space-y-3">
      <div className="flex items-center justify-between gap-3">
        <div>
          <p className="text-sm font-black text-amber-300">MANIFESTO / TERMO DE ACEITE</p>
          <p className="text-[10px] text-gray-400">Configurado por produto. Quando ativo, o cliente precisa ler e aceitar antes de continuar.</p>
        </div>
        <label className="flex items-center gap-2 text-xs font-bold text-white">
          <input type="checkbox" checked={enabled} onChange={e => setEnabled(e.target.checked)} /> Ativo
        </label>
      </div>
      <div>
        <label className="text-[10px] text-amber-300 font-bold block mb-1">Título do manifesto</label>
        <input value={title} onChange={e => setTitle(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '7px 10px' }} placeholder="Ex: Antes de continuar" />
      </div>
      <div>
        <label className="text-[10px] text-amber-300 font-bold block mb-1">Texto que o cliente precisa ler</label>
        <textarea value={body} onChange={e => setBody(e.target.value)} rows={7} style={{ ...whiteInputStyle, fontSize: '12px', padding: '8px 10px', resize: 'vertical' }} placeholder="Digite aqui todas as regras, condições e avisos deste produto..." />
      </div>
      <div className="grid grid-cols-1 gap-2 md:grid-cols-2">
        <div>
          <label className="text-[10px] text-amber-300 font-bold block mb-1">Frase do aceite</label>
          <input value={acceptLabel} onChange={e => setAcceptLabel(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '7px 10px' }} />
        </div>
        <div>
          <label className="text-[10px] text-amber-300 font-bold block mb-1">Texto do botão</label>
          <input value={buttonLabel} onChange={e => setButtonLabel(e.target.value)} style={{ ...whiteInputStyle, fontSize: '12px', padding: '7px 10px' }} />
        </div>
      </div>
      <Button type="button" onClick={save} disabled={saveMut.isPending} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-black">
        <Save className="w-3 h-3 mr-1" /> Salvar Manifesto
      </Button>
    </div>
  );
}

'''
          s = replace_once(s, anchor, component + anchor, 'componente manifesto adm')
          s = replace_once(s,
              '''                    <h4 className="text-sm font-bold text-purple-400">Editar Card</h4>\n                    <div>''',
              '''                    <h4 className="text-sm font-bold text-purple-400">Editar Card</h4>\n                    <ProductManifestEditor productId={product.id} />\n                    <div>''',
