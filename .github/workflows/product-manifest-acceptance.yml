              'carrinho usa manifesto')
          s = replace_once(s,
              '''      </div>\n    </article>\n  );\n}''',
              '''      </div>\n    </article>\n    {manifestOpen && manifest && (\n      <div className="fixed inset-0 z-[250] flex items-center justify-center bg-black/90 p-4 backdrop-blur-md">\n        <div className="w-full max-w-lg overflow-hidden rounded-2xl border-2 border-amber-400/60 bg-[#060914] text-white shadow-[0_30px_100px_rgba(0,0,0,.8)]">\n          <div className="border-b border-amber-400/20 bg-amber-500/10 px-5 py-4">\n            <p className="text-xs font-black uppercase tracking-[0.16em] text-amber-300">Leitura obrigatória</p>\n            <h3 className="mt-1 text-xl font-black text-white">{manifest.title}</h3>\n            <p className="mt-2 text-xs font-semibold text-white/60">Ação selecionada: <span className="text-cyan-300">{pendingPriceModel?.label || item.option.label}</span></p>\n          </div>\n          <div className="space-y-4 p-5">\n            <div className="max-h-[45vh] overflow-y-auto whitespace-pre-wrap rounded-xl border border-white/10 bg-black/30 p-4 text-sm leading-6 text-slate-200">{manifest.body}</div>\n            <label className="flex cursor-pointer items-start gap-3 rounded-xl border border-amber-400/25 bg-amber-400/5 p-3 text-sm font-semibold text-white">\n              <input type="checkbox" checked={manifestChecked} onChange={e => setManifestChecked(e.target.checked)} className="mt-1 h-4 w-4" />\n              <span>{manifest.acceptLabel}</span>\n            </label>\n            <div className="grid grid-cols-2 gap-2">\n              <button type="button" onClick={closeManifest} className="rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-sm font-black text-white/80 hover:bg-white/10">VOLTAR</button>\n              <button type="button" disabled={!manifestChecked} onClick={acceptManifest} className="rounded-xl bg-amber-500 px-4 py-3 text-sm font-black text-black transition hover:bg-amber-400 disabled:cursor-not-allowed disabled:opacity-35">{manifest.buttonLabel}</button>\n            </div>\n          </div>\n        </div>\n      </div>\n    )}\n    </>\n  );\n}''',
