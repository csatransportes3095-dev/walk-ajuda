name: Fast Payment Proof Upload

on:
  push:
    branches:
      - fix/comprovante-upload-rapido-2026-09-12
    paths:
      - .github/workflows/product-manifest-acceptance.yml
      - scripts/apply_fast_payment_proof_upload_20260912.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comprovante-upload-rapido-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply fast upload patch
        run: python scripts/apply_fast_payment_proof_upload_20260912.py
      - name: Assert single compression path and instant lock
        shell: bash
        run: |
          grep -n "paymentProofUploadBusyRef" client/src/pages/Home.tsx
          grep -n "uploadFileToServer(selectedFile, 'comprovante-pix'" client/src/pages/Home.tsx
          python - <<'PY'
          from pathlib import Path
          s=Path('client/src/pages/Home.tsx').read_text()
          start=s.index('const uploadPaymentProof = async')
          end=s.index('const handlePaymentProofSelect', start)
          block=s[start:end]
          if 'compressImageFile(selectedFile)' in block:
              raise SystemExit('payment proof still compresses twice')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts shared/vipInstallments.test.ts
      - name: Check Home TypeScript regression
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep "client/src/pages/Home.tsx" /tmp/tsc.log > /tmp/home-errors.log || true
          if [ -s /tmp/home-errors.log ]; then
            cat /tmp/home-errors.log
            exit 1
          fi
          echo "No new Home.tsx TypeScript errors."
      - name: Check diff
        run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "h2-upload-guard"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- .github/workflows/product-manifest-acceptance.yml
          git rm scripts/apply_fast_payment_proof_upload_20260912.py
          git add client/src/pages/Home.tsx
          git commit -m "fix(upload): speed up payment proof upload"
          git push origin HEAD:fix/comprovante-upload-rapido-2026-09-12
