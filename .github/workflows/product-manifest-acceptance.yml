name: VIP PIX Entry Display

# validation trigger
on:
  push:
    branches:
      - fix/vip-pix-entrada-2026-09-12
    paths:
      - .github/workflows/product-manifest-acceptance.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vip-pix-entrada-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply PIX entry patch
        run: python scripts/apply_vip_pix_entry_20260912.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run shared/vipInstallments.test.ts server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts
      - name: Check VIP TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "client/src/pages/Home\.tsx" /tmp/tsc.log > /tmp/vip-errors.log || true
          if [ -s /tmp/vip-errors.log ]; then cat /tmp/vip-errors.log; exit 1; fi
          echo "No new Home TypeScript errors."
      - name: Check diff
        run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "h2-vip-fix"
          git config user.email "actions@users.noreply.github.com"
          git checkout c42aa05f43bb7a41546a96a542709576a749db9a -- .github/workflows/product-manifest-acceptance.yml
          git rm scripts/apply_vip_pix_entry_20260912.py
          git add client/src/pages/Home.tsx .github/workflows/product-manifest-acceptance.yml
          git commit -m "fix(vip): show entry amount on PIX screen"
          git push origin HEAD:fix/vip-pix-entrada-2026-09-12
