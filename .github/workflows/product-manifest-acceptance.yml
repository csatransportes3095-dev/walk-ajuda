          p.write_text(s)

          # Teste de regressao do manifesto por produto.
          Path('server/productManifestFlow.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
import fs from 'node:fs';

const admin = fs.readFileSync('client/src/pages/AdminProducts.tsx', 'utf8');
const home = fs.readFileSync('client/src/pages/Home.tsx', 'utf8');
const card = fs.readFileSync('client/src/components/StorefrontProductCard.tsx', 'utf8');

describe('manifesto por produto', () => {
  it('permite editar e salvar o manifesto pelo ADM no produto', () => {
    expect(admin).toContain('MANIFESTO / TERMO DE ACEITE');
    expect(admin).toContain('ProductManifestEditor productId={product.id}');
    expect(admin).toContain('product_manifest_${productId}');
    expect(admin).toContain('Salvar Manifesto');
  });

  it('carrega a configuracao por produto na vitrine', () => {
    expect(home).toContain('product_manifest_${product.id}');
    expect(home).toContain('manifest,');
  });

  it('exige leitura e aceite antes da acao', () => {
    expect(card).toContain('manifestOpen');
    expect(card).toContain('manifestAcceptedKey');
    expect(card).toContain('Leitura obrigatória');
    expect(card).toContain('disabled={!manifestChecked}');
    expect(card).toContain("triggerAction('buy')");
    expect(card).toContain("triggerAction('cart')");
    expect(card).toContain('openManifest(nextId)');
  });
});
''')
