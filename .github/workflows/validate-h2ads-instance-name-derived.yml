name: Validate H2ADS instance derived name
on:
  push:
    branches: [fix/h2ads-instance-name-derived-20260830]
    paths: [.github/workflows/validate-h2ads-instance-name-derived.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-instance-name-derived-20260830
      - name: Apply deterministic instance name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/H2Ads.tsx')
          s=p.read_text()
          old='const name = instanceForm.name.trim();'
          new='const name = newInstanceOrderLink ? suggestedH2AdsInstanceName(newInstanceOrderLink) : instanceForm.name.trim();'
          if old not in s:
              raise SystemExit('save name marker not found')
          s=s.replace(old,new,1)
          old2='value={instanceForm.name} onChange={event => setInstanceForm({ ...instanceForm, name: event.target.value })} placeholder="Ex.: Instância 01"'
          new2='value={newInstanceOrderLink ? suggestedH2AdsInstanceName(newInstanceOrderLink) : instanceForm.name} readOnly={Boolean(newInstanceOrderLink)} onChange={event => setInstanceForm({ ...instanceForm, name: event.target.value })} placeholder="Ex.: Instância 01"'
          if old2 not in s:
              raise SystemExit('input marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused tests
        run: pnpm vitest run server/h2adsOrderSearch.test.ts server/h2adsOrderLink.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/H2Ads.tsx
          git commit -m 'fix(h2ads): derivar nome da instancia do cliente vinculado'
          git push origin HEAD:fix/h2ads-instance-name-derived-20260830
