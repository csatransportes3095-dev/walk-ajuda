name: Validate H2ADS customer search fix
on:
  push:
    branches: [fix/h2ads-new-instance-customer-search-20260830]
    paths: [.github/workflows/validate-h2ads-customer-search-fix.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-new-instance-customer-search-20260830
      - name: Force automatic instance name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/H2Ads.tsx')
          s=p.read_text()
          old='onChange={order => { setNewInstanceOrderLink(order); if (order && (!instanceForm.name.trim() || /^instância\\s*\\d*$/i.test(instanceForm.name.trim()))) setInstanceForm({ ...instanceForm, name: suggestedH2AdsInstanceName(order) }); }}'
          new='onChange={order => { setNewInstanceOrderLink(order); if (order) setInstanceForm({ ...instanceForm, name: suggestedH2AdsInstanceName(order) }); }}'
          if old not in s:
              raise SystemExit('marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused tests
        run: pnpm vitest run server/h2adsOrderSearch.test.ts server/h2adsOrderLink.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated UI rule
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/H2Ads.tsx
          git commit -m 'fix(h2ads): preencher nome completo ao selecionar cliente'
          git push origin HEAD:fix/h2ads-new-instance-customer-search-20260830
