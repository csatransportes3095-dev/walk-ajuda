name: Unified Session Final Validation

on:
  push:
    branches:
      - fix/unify-customer-session-refresh-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply final hydration fix
        run: node scripts/finalize-unified-session-hydration.mjs
      - name: Validate patch
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm exec vitest run server/customerSessionRefreshRegression.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit final validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/GastosPage.tsx client/src/pages/EmprestimoPage.tsx server/customerSessionRefreshRegression.test.ts
          git commit -m "fix(auth): hidratar sessao unificada sem piscar login"
          git push origin HEAD:fix/unify-customer-session-refresh-20260901
