name: H2 AUTO Capture All Unanswered Safety
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'server/h2-auto-learning.ts'
      - 'server/h2-auto-diagnostics.ts'
      - 'server/h2AutoCaptureAllUnanswered.test.ts'
      - 'client/src/pages/AdminH2Auto.tsx'
      - '.github/workflows/h2auto-capture-all-safety.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2AutoCaptureAllUnanswered.test.ts server/h2AutoLearningBridge212.test.ts server/h2-auto-free-questions.test.ts server/h2-auto-unknown-reply.test.ts server/h2-auto-otp-continuity.test.ts
      - name: Check changed TypeScript files
        run: |
          pnpm exec tsc --noEmit > /tmp/h2-tsc.log 2>&1 || true
          if grep -E '^((server/h2-auto-learning.ts)|(server/h2-auto-diagnostics.ts)|(client/src/pages/AdminH2Auto.tsx))\\(' /tmp/h2-tsc.log; then
            exit 1
          fi
      - run: node scripts/patch-media-local-export-20260910.mjs
      - run: pnpm build
