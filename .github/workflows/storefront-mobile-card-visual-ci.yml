name: Storefront Mobile Card Visual Safety
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/src/components/StorefrontProductCard.tsx"
      - "server/storefrontProductCardVisual.test.ts"
      - ".github/workflows/storefront-mobile-card-visual-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Visual component behavior regression
        run: pnpm exec vitest run server/storefrontProductCardVisual.test.ts
      - name: Typecheck edited card
        run: |
          pnpm exec tsc --noEmit > /tmp/storefront-card-types.log 2>&1 || true
          if grep -F 'client/src/components/StorefrontProductCard.tsx(' /tmp/storefront-card-types.log; then
            exit 1
          fi
      - name: Production build
        run: |
          node scripts/patch-media-local-export-20260910.mjs
          pnpm build
