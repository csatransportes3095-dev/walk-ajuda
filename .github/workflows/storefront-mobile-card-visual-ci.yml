name: Storefront Mobile Card Visual Safety
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/src/components/StorefrontProductCard.tsx"
      - "client/src/pages/Home.tsx"
      - "client/src/components/StorefrontFilters.tsx"
      - "server/storefrontCompactMobileHeader.test.ts"
      - "client/public/h2-main-route-cards-v2.css"
      - "client/index.html"
      - "scripts/check-storefront-mobile-browser.mjs"
      - "server/storefrontProductCardVisual.test.ts"
      - ".github/workflows/storefront-mobile-card-visual-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Visual component behavior regression
        run: pnpm exec vitest run server/storefrontProductCardVisual.test.ts server/storefrontCompactMobileHeader.test.ts server/storefrontCategories.test.ts server/storefrontResponsiveAndVipInstallment.test.ts
      - name: Typecheck edited card
        run: |
          pnpm exec tsc --noEmit > /tmp/storefront-card-types.log 2>&1 || true
          if grep -E 'client/src/(components/(StorefrontProductCard|StorefrontFilters))\.tsx\(' /tmp/storefront-card-types.log; then
            exit 1
          fi
      - name: Production build
        run: |
          node scripts/patch-media-local-export-20260910.mjs
          pnpm build
      - name: Install isolated Chromium tooling
        run: |
          npm install --prefix /tmp/h2-storefront-browser --no-package-lock playwright@1.56.1
          /tmp/h2-storefront-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate rendered shortcuts and filters at real mobile widths
        env:
          H2_PLAYWRIGHT_MODULE: /tmp/h2-storefront-browser/node_modules/playwright/index.mjs
        run: node scripts/check-storefront-mobile-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-mobile-browser-evidence
          path: /tmp/storefront-mobile-evidence
          retention-days: 3
