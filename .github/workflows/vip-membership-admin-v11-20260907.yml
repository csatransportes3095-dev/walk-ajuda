name: Category sync storefront 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vip-membership-admin-v11-20260907.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - name: Backup production
        run: git push origin HEAD:refs/heads/backup/pre-category-sync-v11-20260907 || true
      - name: Apply category synchronization
        run: |
          curl -fsSL https://raw.githubusercontent.com/csatransportes3095-dev/walk-ajuda/main/scripts/apply_category_sync_20260907.py -o /tmp/apply_category_sync.py
          python /tmp/apply_category_sync.py
          git diff --check
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminProducts.tsx client/src/pages/Home.tsx
          git commit -m "fix(produtos): sincronizar categoria editada com cliente"
          git fetch origin recovery/organizar-salvos-2026-08-24
          git rebase origin/recovery/organizar-salvos-2026-08-24
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
