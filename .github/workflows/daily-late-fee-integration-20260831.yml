name: Daily late fee integration 20260831

on:
  push:
    branches:
      - fix/daily-late-fees-20260831

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated patch
        run: python scripts/patch-daily-late-fee-clean.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Restore legacy lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Formula and integration tests
        run: pnpm exec vitest run server/loans/lateFee.test.ts server/dailyLateFeeIntegration.test.ts

      - name: TypeScript baseline guard
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/check.log 2>&1
          status=$?
          cat /tmp/check.log
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          errors=$(grep -c "error TS" /tmp/check.log || true)
          if [ "$errors" -eq 1 ] && grep -Fq "tsconfig.json(17,29): error TS5103: Invalid value for '--ignoreDeprecations'." /tmp/check.log; then
            echo "Known main-branch tsconfig baseline only."
            exit 0
          fi
          exit 1

      - name: Production build
        run: pnpm build

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/loans.ts client/src/pages/LoansTab.tsx client/src/pages/AdminLoans.tsx server/dailyLateFeeIntegration.test.ts
          git commit -m "fix(loans): integrate daily late fee end to end [skip ci]"
          git push origin HEAD:fix/daily-late-fees-20260831
