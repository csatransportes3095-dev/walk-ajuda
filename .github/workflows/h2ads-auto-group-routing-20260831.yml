name: H2ADS auto group routing

on:
  push:
    branches:
      - feat/h2ads-auto-group-routing-20260831
    paths:
      - ".github/workflows/h2ads-auto-group-routing-20260831.yml"
      - "scripts/patch-h2ads-auto-group-routing-20260831.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h2ads-auto-group-routing-20260831
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-h2ads-auto-group-routing-20260831.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml
      - name: Routing tests
        run: pnpm vitest run server/h2adsGroupRouting.test.ts server/h2adsWorkerFoundation.test.ts server/h2adsWorkerRoute.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/h2adsGroupRouting.ts client/src/pages/H2Ads.tsx client/src/components/H2AdsOrderLinkControl.tsx server/h2adsGroupRouting.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(h2ads): trocar grupo manualmente e direcionar pelo pedido [skip ci]"
          git push origin HEAD:feat/h2ads-auto-group-routing-20260831
