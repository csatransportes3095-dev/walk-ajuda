name: H2BICO - fotos em lote com EAR e confirmacao
on:
  push:
    branches: [feat/h2bico-fotos-lote-ear-confirmacao-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar
        run: pnpm install --frozen-lockfile
      - name: Testes H2BICO existentes e novos
        run: pnpm exec vitest run server/h2bicoPhotoBatchActions.test.ts server/h2bicoEarMarkers.test.ts server/h2bicoReview.test.ts server/h2bicoBulkManager.test.ts
      - name: Build
        run: pnpm build
