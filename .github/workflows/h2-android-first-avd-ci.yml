name: H2 Android - Primeiro AVD

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "workers/windows/Preparar-H2Android-01.ps1"
      - "workers/windows/H2AndroidAgent.ps1"
      - "workers/windows/H2AndroidControl.ps1"
      - "server/h2AndroidAgentStore.ts"
      - "server/routers/h2Android.ts"
      - "client/src/components/H2AndroidLiveManager.tsx"
      - "server/h2AndroidControls.integration.test.ts"
      - "workers/windows/Preparar-Primeiro-Android.cmd"
      - "server/h2AndroidInstallerZip.ts"
      - "server/h2AndroidAgentRoute.ts"
      - "server/siteAccessPolicy.ts"
      - "client/src/pages/AdminH2Android.tsx"
      - "server/h2AndroidFirstAvd.integration.test.ts"
      - ".github/workflows/h2-android-first-avd-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Tests for AVD wizard, installer, ADM and isolation
        run: pnpm exec vitest run server/h2AndroidFirstAvd.integration.test.ts server/h2AndroidControls.integration.test.ts server/h2AndroidInstaller.integration.test.ts server/h2AndroidAgent.integration.test.ts server/h2Android.integration.test.ts server/siteAccessPolicy.test.ts
      - name: Production build
        run: pnpm build

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1 and check CMD launcher
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/workers/windows/Preparar-H2Android-01.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/workers/windows/H2AndroidAgent.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/workers/windows/H2AndroidControl.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $cmd = Get-Content "workers/windows/Preparar-Primeiro-Android.cmd" -Raw
          if ($cmd -notmatch 'powershell.exe.*Preparar-H2Android-01.ps1') { throw 'Launcher missing wizard.' }
          if ($cmd -notmatch 'pause') { throw 'Launcher must keep window open.' }
          Write-Host "Windows scripts validated."
