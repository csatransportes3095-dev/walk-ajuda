name: Site Security - validate

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'server/siteAccess*.ts'
      - 'server/siteSecurityRouter.ts'
      - 'server/_core/index.ts'
      - 'server/routers.ts'
      - 'client/src/pages/AdminSiteSecurity.tsx'
      - 'client/src/pages/AdminCodes.tsx'
      - 'client/src/App.tsx'
      - 'scripts/apply-site-security-migration.ts'
      - '.github/workflows/site-security-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run server/siteAccessPolicy.test.ts
      - run: pnpm build
