name: Repair Admin Loans Dashboard Diagnostic

on:
  push:
    paths:
      - '.github/workflows/repair-admin-loans-dashboard-diagnostic.yml'
      - 'scripts/repair-admin-loans-dashboard-diagnostic.cjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/repair-admin-loans-dashboard-diagnostic.cjs
      - name: Commit diagnostic and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/repair-admin-loans-dashboard-diagnostic.cjs .github/workflows/repair-admin-loans-dashboard-diagnostic.yml
          git add server/routers/loans.ts
          git commit -m "fix: mostra causa real da falha das parcelas no Dashboard"
          git push origin HEAD:main
