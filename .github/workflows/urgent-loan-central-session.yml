name: Urgent Loan Central Session

on:
  push:
    branches:
      - fix/loan-central-route-access-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.4.1 --activate
      - run: node scripts/patch-loan-central-session.mjs
      - run: git diff --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run server/customerSessionRefreshRegression.test.ts
      - run: pnpm build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/loans.ts server/customerSessionRefreshRegression.test.ts
          git commit -m "fix(loans): reconhecer sessão central na rota de empréstimos" || exit 0
          git push
