name: H2BICO Full Photo Crop Validation
on:
  push:
    branches:
      - fix/h2bico-auto-full-photo-crop-20261021
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2bicoAutoFullPhoto.test.ts server/h2bicoStandaloneAvatar.test.ts
      - run: pnpm run build
