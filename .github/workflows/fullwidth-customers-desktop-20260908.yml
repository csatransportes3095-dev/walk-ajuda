name: Full width customers desktop 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fullwidth-customers-desktop-20260908.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Backup production
        run: git push origin HEAD:refs/heads/backup/pre-customers-4x3-final-20260908 || true

      - name: Apply final customers desktop layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/AdminCustomers.tsx')
          text = path.read_text(encoding='utf-8')

          # 4 cards por linha no desktop, com menor espaco entre eles.
          old_grid = '<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">'
          new_grid = '<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">'
          if text.count(old_grid) == 1:
              text = text.replace(old_grid, new_grid, 1)
          elif text.count(new_grid) != 1:
              raise SystemExit('ABORT: customer grid not found in expected state')

          # Remove o botao de abrir/fechar detalhes.
          button_block = '''                  <button type="button" onClick={() => toggleCustomerDetails(c.id)} className="mt-2 w-full rounded-lg border border-white/10 bg-white/[0.04] px-2 py-1.5 text-[10px] font-bold text-cyan-100 transition hover:bg-cyan-500/10">
                    {expandedCustomerIds.has(c.id) ? 'Ocultar detalhes' : 'Ver dados e controles'}
                  </button>
'''
          if text.count(button_block) == 1:
              text = text.replace(button_block, '', 1)

          # Deixa os dados e controles sempre visiveis e reduz espacamento vertical.
          old_details = "{expandedCustomerIds.has(c.id) && <div className=\"mt-2 flex gap-0 border-t pt-2.5\" style={{ borderColor: 'rgba(255,255,255,0.07)' }}>"
          new_details = "{true && <div className=\"mt-1 flex gap-0 border-t pt-1.5\" style={{ borderColor: 'rgba(255,255,255,0.07)' }}>"
          if text.count(old_details) == 1:
              text = text.replace(old_details, new_details, 1)
          elif text.count(new_details) != 1:
              raise SystemExit('ABORT: customer details wrapper not found in expected state')

          # Compacta apenas o widget de rotas dentro do card para caber mais conteudo na altura.
          replacements = [
              ('rounded-xl border border-slate-500/45 bg-gradient-to-r from-slate-700/20 to-slate-700/10 p-2.5', 'rounded-lg border border-slate-500/45 bg-gradient-to-r from-slate-700/20 to-slate-700/10 p-1.5'),
              ('mb-1.5 flex items-center justify-between gap-2', 'mb-1 flex items-center justify-between gap-1.5'),
              ('<div className="grid gap-1.5">', '<div className="grid gap-1">'),
              ('grid h-10 cursor-pointer grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-2 rounded-lg border px-2.5', 'grid h-7 cursor-pointer grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-1.5 rounded-md border px-1.5'),
              ('mt-1.5 text-[9px] font-medium leading-tight text-cyan-200/75', 'mt-1 text-[8px] font-medium leading-tight text-cyan-200/75'),
          ]
          for old, new in replacements:
              if text.count(old) >= 1:
                  text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('OK: final layout = 4 cards per row, controls visible, compact height.')
          PY

          git diff --check
          grep -F 'lg:grid-cols-4 gap-3' client/src/pages/AdminCustomers.tsx
          grep -F '{true && <div className="mt-1 flex gap-0 border-t pt-1.5"' client/src/pages/AdminCustomers.tsx
          if grep -Fq 'Ver dados e controles' client/src/pages/AdminCustomers.tsx; then
            echo 'ABORT: details button still present'
            exit 1
          fi

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminCustomers.tsx
          git commit -m "feat(customers): grade 4x3 com controles sempre visiveis"
          git fetch origin recovery/organizar-salvos-2026-08-24
          git rebase origin/recovery/organizar-salvos-2026-08-24
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
