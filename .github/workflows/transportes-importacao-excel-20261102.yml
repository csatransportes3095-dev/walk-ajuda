name: Transportes - importacao Excel real
on:
  push:
    branches: [fix/transportes-excel-import-real-data-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar
        run: pnpm install --frozen-lockfile
      - name: Testar importacao e CNPJ
        run: pnpm exec vitest run server/transportesImport.test.ts server/transportes.test.ts
      - name: Compilar
        run: pnpm build
