name: H2BICO - opcoes sempre visiveis
on:
  push:
    branches: [fix/h2bico-ear-visible-post-import-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2bicoRecentPhotoBatch.test.ts server/h2bicoPhotoBatchActions.test.ts server/h2bicoEarMarkers.test.ts server/h2bicoReview.test.ts
      - run: pnpm build
