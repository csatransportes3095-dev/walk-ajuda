name: H2ADS unique customer search

on:
  push:
    branches:
      - fix/h2ads-unique-customer-search-20260830
    paths:
      - "client/src/components/H2AdsOrderLinkControl.tsx"
      - "shared/h2adsOrderSearch.ts"
      - "server/h2adsOrderSearch.test.ts"
      - ".github/workflows/h2ads-unique-customer-search.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused tests
        run: pnpm vitest run server/h2adsOrderSearch.test.ts

      - name: Build production bundle
        run: pnpm build
