name: H2 Ads visual staging check

on:
  push:
    branches:
      - staging/h2ads-colors-4cards-2026-08-28

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact localStorage typing fix in staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/H2Ads.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''const readVisualColors = (): VisualColors => {
            if (typeof window === "undefined") return {};
            try {
              const parsed = JSON.parse(window.localStorage.getItem(H2ADS_VISUAL_COLORS_KEY) || "{}");
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
              return Object.fromEntries(Object.entries(parsed).filter(([, value]) => typeof value === "string" && /^#[0-9a-fA-F]{6}$/.test(value)));
            } catch { return {}; }
          };'''
          new = '''const readVisualColors = (): VisualColors => {
            if (typeof window === "undefined") return {};
            try {
              const parsed: unknown = JSON.parse(window.localStorage.getItem(H2ADS_VISUAL_COLORS_KEY) || "{}");
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
              const colors: VisualColors = {};
              for (const [key, value] of Object.entries(parsed as Record<string, unknown>)) {
                if (typeof value === "string" && /^#[0-9a-fA-F]{6}$/.test(value)) colors[key] = value.toUpperCase();
              }
              return colors;
            } catch { return {}; }
          };'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected readVisualColors block not found')
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Commit validated typing fix
        run: |
          if git diff --quiet -- client/src/pages/H2Ads.tsx; then
            echo "No typing fix to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/H2Ads.tsx
          git commit -m "fix(h2ads): type visual color storage safely"
          git push
