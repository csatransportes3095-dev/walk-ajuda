name: Customer Passkey library validation

on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/tests/customer-passkey-library/**'
      - '.github/workflows/customer-passkey-library-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test real WebAuthn library with isolated browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm install --prefix "$RUNNER_TEMP/passkey-browser-tools" --no-package-lock --no-audit --no-fund playwright@1.57.0
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/passkey-browser-tools/node_modules/playwright/index.mjs"
          node scripts/tests/customer-passkey-library/smoke.mjs
