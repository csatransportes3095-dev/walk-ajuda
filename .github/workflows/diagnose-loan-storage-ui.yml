name: Diagnose Loan Storage UI

on:
  push:
    paths:
      - 'scripts/diagnose-loan-storage-ui.cjs'
      - '.github/workflows/diagnose-loan-storage-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/diagnose-loan-storage-ui.cjs
      - name: Commit diagnostic UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/diagnose-loan-storage-ui.cjs .github/workflows/diagnose-loan-storage-ui.yml
          git add server/routers/loans.ts client/src/pages/AdminLoans.tsx
          git commit -m "fix: diagnóstico independente do armazenamento de empréstimos"
          git push origin HEAD:main
