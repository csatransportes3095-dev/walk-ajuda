name: Validate checkout WhatsApp recovery

on:
  push:
    branches:
      - fix/postorder-whatsapp-recovery-20261014
    paths:
      - 'client/src/pages/Home.tsx'
      - 'client/src/pages/SchedulePage.tsx'
      - 'server/postOrderScheduleFlow.test.ts'
      - '.github/workflows/validate-postorder-whatsapp-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Post-order flow and WhatsApp regression tests
        run: pnpm exec vitest run server/postOrderScheduleFlow.test.ts server/postOrderCustomerPhotoWhatsapp.test.ts
      - name: TypeScript check
        run: pnpm check
      - name: Production build
        run: pnpm build
