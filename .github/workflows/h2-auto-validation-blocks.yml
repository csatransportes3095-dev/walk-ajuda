name: H2 AUTO - Validacao e Bloqueios (PR)
on:
  pull_request:
    branches:
      - feature/h2auto-whatsapp-identity-gate-20261027
    paths:
      - "server/h2-auto-access.ts"
      - "server/h2-auto-remote.ts"
      - "server/h2-auto-validation-*.ts"
      - "client/src/components/H2AutoValidationBlocks.tsx"
      - "client/src/pages/AdminH2Auto.tsx"
      - ".github/workflows/h2-auto-validation-blocks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript audit with strict regression checks on reported screens
        run: |
          pnpm exec tsc --noEmit > /tmp/h2auto-typescript.log 2>&1 && exit 0
          cat /tmp/h2auto-typescript.log
          if grep -E '^(client/src/components/(AdminEmailGenerator|PasswordGate|UnifiedCustomerAccessGate|H2AutoValidationBlocks)|client/src/pages/(AdminGlobalPromotion|EmprestimoPage|GastosPage|OrderTracking|ProtectedPhotoPage)|server/(routers/customerPassword|h2-auto-[^/]+))\.(ts|tsx)\([0-9]+,[0-9]+\): error TS' /tmp/h2auto-typescript.log; then
            echo "ERROR: reported customer-access or H2 Auto TypeScript failures remain."
            exit 1
          fi
          echo "Unrelated baseline TypeScript errors are still present; none on the reported screens."
      - name: Compile validation backend
        run: pnpm exec esbuild server/h2-auto-access.ts --bundle --platform=node --packages=external --format=esm --outfile=/tmp/h2-auto-access.js
      - name: Phone-number policy tests
        run: pnpm exec vitest run server/h2-auto-validation-policy.test.ts
      - name: Build web and server
        run: pnpm build
