name: Patch automatic customer number from 470

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/patch-customer-number-470.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Patch automatic generator only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/db.ts')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          marker = 'SELECT COALESCE(MAX(CASE WHEN customerNumber <> 99999 THEN customerNumber END), 451) + 1 AS nextNum FROM customers'
          matches = [i for i, line in enumerate(lines) if marker in line]
          if len(matches) != 1:
              raise SystemExit(f'Gerador automatico esperado nao encontrado exatamente uma vez: {len(matches)}')
          i = matches[0]
          if i < 1 or i + 1 >= len(lines):
              raise SystemExit('Bloco automatico incompleto')
          if lines[i - 1].strip() != '// Gerar número de cadastro sequencial':
              raise SystemExit('Comentario do gerador automatico nao confere')
          if 'const nextNum = maxRow[0]?.nextNum ?? 1;' not in lines[i + 1]:
              raise SystemExit('Linha nextNum esperada nao confere')

          replacement = [
              '  // Gerador AUTOMÁTICO: começa em 470 e não usa números manuais altos como base.',
              '  // Escolhe o primeiro número livre >= 470 sem alterar cadastros já existentes.',
              '  const numberRows = await db.execute(sql`',
              '    SELECT customerNumber',
              '    FROM customers',
              '    WHERE customerNumber IS NOT NULL',
              '      AND customerNumber >= 470',
              '      AND customerNumber <> 99999',
              '    ORDER BY customerNumber ASC',
              '  `) as unknown as [Array<{ customerNumber: number | string | null }>, unknown];',
              '  const usedNumbers = new Set(',
              '    (numberRows[0] || [])',
              '      .map((row) => Number(row.customerNumber))',
              '      .filter((value) => Number.isInteger(value) && value >= 470 && value !== 99999),',
              '  );',
              '  let nextNum = 470;',
              '  while (usedNumbers.has(nextNum) || nextNum === 99999) nextNum += 1;',
          ]
          lines[i - 1:i + 2] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate isolated change
        shell: bash
        run: |
          git diff --check
          grep -n "Gerador AUTOMÁTICO" server/db.ts
          grep -n "let nextNum = 470" server/db.ts
          grep -n "MAX(CASE WHEN customerNumber <> 99999" server/routers/customerUpdate.ts
          test "$(git diff --name-only | grep -v '^server/db.ts$' | wc -l)" -eq 0

      - name: Remove one-time workflow
        run: git rm .github/workflows/patch-customer-number-470.yml

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customers): reiniciar numeracao automatica em 470"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
