name: H2 Internal Stage Persistence Final

on:
  push:
    branches:
      - fix/h2-internal-stage-persistence-final-20260901
    paths:
      - "scripts/apply-h2-internal-stage-persistence-final.py"
      - ".github/workflows/h2-internal-stage-persistence-final.yml"

permissions:
  contents: write

jobs:
  validate-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply-h2-internal-stage-persistence-final.py

      - name: Validate diff
        run: git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Targeted regression tests
        run: pnpm vitest run server/internalStagePersistence.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated production files only
        run: |
          rm -f scripts/apply-h2-internal-stage-persistence-final.py
          rm -f .github/workflows/h2-internal-stage-persistence-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts server/db.ts server/routers.ts client/src/pages/AdminOrders.tsx server/internalStagePersistence.test.ts scripts/apply-h2-internal-stage-persistence-final.py .github/workflows/h2-internal-stage-persistence-final.yml
          git commit -m "fix(h2): persistir etapa interna por pedido e subpedido [skip ci]"
          git push origin HEAD:fix/h2-internal-stage-persistence-final-20260901
