name: H2 Android proxy vault tests
on:
  pull_request:
    paths:
      - 'server/routers/h2Android.ts'
      - 'server/h2Android.native.test.ts'
      - 'client/src/pages/AdminH2Android.tsx'
      - '.github/workflows/h2-android-proxy-vault-check.yml'
jobs:
  test-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate H2 Android security guards and UI
        run: pnpm exec vitest run server/h2Android.native.test.ts
      - name: Check H2 Android TypeScript files (baseline errors in other modules ignored)
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit > /tmp/h2-tsc.log 2>&1
          set -e
          if grep -E '^(client/src/pages/AdminH2Android\.tsx|server/routers/h2Android\.ts|server/h2Android\.native\.test\.ts)\([0-9]+,[0-9]+\): error TS' /tmp/h2-tsc.log; then
            echo 'TypeScript errors found in H2 Android files'
            exit 1
          fi
          echo 'H2 Android TypeScript files have no errors (unrelated baseline issues excluded).'
      - name: Compile H2 Android website bundle
        run: pnpm run build
