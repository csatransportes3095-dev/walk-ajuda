name: Schedule consume rules 2026-09-08

on:
  push:
    paths:
      - .github/workflows/schedule-consume-rules-20260908.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Backup production
        run: git push origin HEAD:refs/heads/backup/pre-schedule-consume-rules-20260908 || true

      - name: Apply correct schedule rules
        run: |
          python scripts/apply_schedule_consume_rules_20260908.py
          git diff --check

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test schedule rules
        run: pnpm vitest run server/scheduleConsumeRules.test.ts

      - name: Build
        run: pnpm build

      - name: Commit production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server/routers/schedule.ts server/scheduleConsumeRules.test.ts
          git commit -m "fix(schedule): consumir horarios e reagendar somente em data futura"
          git fetch origin recovery/organizar-salvos-2026-08-24
          git rebase origin/recovery/organizar-salvos-2026-08-24
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
