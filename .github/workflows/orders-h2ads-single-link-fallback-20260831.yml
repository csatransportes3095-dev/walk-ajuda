name: Orders H2ADS single link fallback

on:
  push:
    branches:
      - hotfix/orders-h2ads-single-link-fallback-20260831
    paths:
      - ".github/workflows/orders-h2ads-single-link-fallback-20260831.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/orders-h2ads-single-link-fallback-20260831
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shortcut tests
        run: pnpm vitest run server/h2adsOrderBrowserShortcut.test.ts
      - name: Production build
        run: pnpm build
