name: Transportes - build e regressao
on:
  push:
    branches:
      - feature/transportes-cnpj-importacao
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-transportes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # O package.json do projeto já diverge do lockfile (dependência @types/express).
      # A verificação isolada não deve alterar dependências da produção.
      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile
      - name: Testes da nova rota
        run: pnpm exec vitest run server/transportes.test.ts
      # O tsconfig atual do projeto usa ignoreDeprecations 6.0, mas a versão
      # fixada no package.json é TypeScript 5.9.3. Compatibilidade só na CI.
      - name: Build de producao
        run: pnpm build
      - name: Auditoria TypeScript completa (erros legados reportados)
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit --ignoreDeprecations 5.0 --target es2022 > /tmp/transportes-tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "TypeScript completo aprovado"
          else
            echo "::warning::O projeto possui erros TypeScript preexistentes; relatório abaixo."
            grep 'error TS' /tmp/transportes-tsc.log | head -100 || true
          fi
          if grep -E '^(client/src/pages/AdminTransportes.tsx|client/src/lib/transportesExcel.ts|server/routers/transportes.ts|shared/transportes.ts)\\(.*error TS' /tmp/transportes-tsc.log; then
            echo "::error::Falha de tipagem em arquivos do módulo Transportes."
            exit 1
          fi
          echo "Sem erros TypeScript nos arquivos novos de Transportes."
