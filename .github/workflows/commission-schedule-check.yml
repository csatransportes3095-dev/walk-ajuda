name: Commission booking gate validation
on:
  push:
    branches: [feat/commission-schedule-confirmed-20261027]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run server/referralCommissionPolicy.test.ts
      - run: pnpm build
