name: Order Warranty Display Guarded

on:
  push:
    branches:
      - fix/order-warranty-display-20260901

permissions:
  contents: write

jobs:
  validate-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply-order-warranty-display.py

      - name: Validate diff
        run: |
          git diff --check
          git status --short

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Targeted regression tests
        run: pnpm exec vitest run server/orderWarrantyDisplay.test.ts server/internalStagePersistence.test.ts server/scheduleOrderSync.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated production files only
        run: |
          rm -f scripts/apply-order-warranty-display.py .github/workflows/order-warranty-display-guarded.yml
          git add client/src/pages/AdminOrders.tsx server/routers.ts server/orderWarrantyDisplay.test.ts
          git add -u scripts/apply-order-warranty-display.py .github/workflows/order-warranty-display-guarded.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(h2): exibir garantia real nos cards de pedido [skip ci]"
          git push origin HEAD:fix/order-warranty-display-20260901
