name: FIPE Chassi - isolated catalogue checks

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'server/fipeCatalogProxy.ts'
      - 'server/fipeCatalogProxy.test.ts'
      - 'server/_core/index.ts'
      - 'client/src/pages/GeradorChassiPublico.tsx'
      - '.github/workflows/fipe-catalog-ci.yml'
      - '.github/workflows/customer-otp-migration.yml'
      - 'server/customerRouteAudit.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: FIPE cache, error and security tests
        run: pnpm exec vitest run server/fipeCatalogProxy.test.ts
      - name: Verify live backup model catalogue response
        run: |
          node --input-type=module <<'NODE'
          const url = "https://brasilapi.com.br/api/fipe/veiculos/v1/carros/59";
          const response = await fetch(url, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(12000),
          });
          if (!response.ok) {
            throw new Error("FIPE backup API unavailable: HTTP " + response.status);
          }
          const data = await response.json();
          if (!Array.isArray(data) || data.length === 0 ||
              !data.some((x) => typeof x.modelo === "string" &&
                               typeof x.valor === "string")) {
            throw new Error("FIPE backup API shape invalid");
          }
          console.log("Backup FIPE model catalogue accessible:", data.length, "models");
          NODE
      - name: Existing admin-route audit expectation regression tests
        run: pnpm exec vitest run server/customerRouteAudit.test.ts
      - name: FIPE and two approved CI check fixes scope audit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Files modified in this PR:"
          printf '%s\n' "$files"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              server/fipeCatalogProxy.ts|server/fipeCatalogProxy.test.ts|server/_core/index.ts|client/src/pages/GeradorChassiPublico.tsx|.github/workflows/fipe-catalog-ci.yml|.github/workflows/customer-otp-migration.yml|server/customerRouteAudit.test.ts) ;;
              *) echo "Non-FIPE file modified: $file" >&2; exit 1 ;;
            esac
          done <<< "$files"
          # Never modify the VIN motor, registry, reservation, schema or database.
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '(^client/src/lib/vinGenerator\.ts$|^server/routers/vinRegistry\.ts$|^server/vinRegistry|^drizzle/)'; then
            echo 'VIN engine or database change detected' >&2
            exit 1
          fi
      - name: Ensure direct FIPE browser dependency is removed
        run: |
          grep -Fq 'const FIPE_BASE = "/api/fipe/catalog"' client/src/pages/GeradorChassiPublico.tsx
          ! grep -Fq 'https://fipe.parallelum.com.br' client/src/pages/GeradorChassiPublico.tsx
