name: H2BICO One Card Per Person
on:
  push:
    branches:
      - fix/h2bico-single-card-cpf-photo-20261021
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2bicoScreenshotPersonLink.test.ts server/h2bicoScreenshotOcr.test.ts
      - run: pnpm run build
