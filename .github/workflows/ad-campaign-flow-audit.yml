name: Ad Campaign Flow Audit

on:
  push:
    branches:
      - fix/ad-campaign-flow-audit-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ad-campaign-flow-audit-20260901
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Apply audited patch
        run: node scripts/apply-ad-campaign-flow-audit.mjs
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run targeted regression test
        run: pnpm vitest run server/adCampaignFlowAudit.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          rm scripts/apply-ad-campaign-flow-audit.mjs
          rm .github/workflows/ad-campaign-flow-audit.yml
          git add server/routers/adCampaigns.ts client/src/pages/AdminAdCampaigns.tsx server/adCampaignFlowAudit.test.ts scripts/apply-ad-campaign-flow-audit.mjs .github/workflows/ad-campaign-flow-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ads): normalizar URLs e datas no fluxo de campanhas"
          git push origin HEAD:fix/ad-campaign-flow-audit-20260901
