name: Patch route block reason

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/patch-route-block-reason.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch_route_block_reason.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''    if count != 1:\n        raise SystemExit(f"{label}: esperado 1 bloco, encontrado {count}")''', '''    if count < 1:\n        raise SystemExit(f"{label}: bloco nao encontrado")''', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 .github/scripts/patch_route_block_reason.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/customerAccess.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const permissions = await rows(db, sql`\n    SELECT route FROM customerRoutePermissions\n    WHERE customerId=${customerId} AND status='approved'\n  `);\n  const routes = permissions\n    .map((row: any) => String(row.route || ""))\n    .filter((route: string): route is CustomerRoute => (CUSTOMER_ROUTES as readonly string[]).includes(route));\n  // Sem registro = cliente antigo. Preserva o acesso total já existente.\n  return { restricted: routes.length > 0, routes };'''
          new = '''  const permissions = await rows(db, sql`\n    SELECT route FROM customerRoutePermissions\n    WHERE customerId=${customerId} AND status='approved'\n  `);\n  const restrictionRows = await rows(db, sql`\n    SELECT route FROM customerRouteRestrictionReasons\n    WHERE customerId=${customerId}\n  `);\n  const routes = permissions\n    .map((row: any) => String(row.route || ""))\n    .filter((route: string): route is CustomerRoute => (CUSTOMER_ROUTES as readonly string[]).includes(route));\n  // Cliente legado sem permissao e sem motivo continua com acesso total.\n  // Motivo ativo preserva a restricao mesmo quando nenhuma rota esta liberada.\n  return { restricted: routes.length > 0 || restrictionRows.length > 0, routes };'''
          if s.count(old) != 1:
              raise SystemExit(f'getRouteAccess: esperado 1 bloco, encontrado {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('client/src/pages/AdminGastosPage.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''                                        restrictionReason,\n'''
          new = '''                                        restrictionReason: restrictionReason || undefined,\n'''
          if s.count(old) != 1:
              raise SystemExit(f'AdminGastos restrictionReason: esperado 1 bloco, encontrado {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate scope
        shell: bash
        run: |
          git diff --check
          grep -n 'customerRouteRestrictionReasons' server/customerAccess.ts
          grep -n 'restrictionRows.length > 0' server/customerAccess.ts
          grep -n 'restrictionReason' server/routers/spreadsheet.ts
          grep -n 'Motivo informado' client/src/pages/GastosPage.tsx
          grep -n 'Motivo informado' client/src/pages/EmprestimoPage.tsx
          grep -n 'Motivo informado' client/src/pages/GastosLoginPage.tsx
          grep -n 'askRouteRestrictionReason' client/src/pages/AdminGastosPage.tsx
          grep -n 'restrictionReason: restrictionReason || undefined' client/src/pages/AdminGastosPage.tsx
          grep -n 'restrictionReason' client/src/pages/AdminCustomers.tsx
          test "$(git diff --name-only | grep -Ev '^(server/customerAccess.ts|server/routers/spreadsheet.ts|client/src/pages/AdminGastosPage.tsx|client/src/pages/AdminCustomers.tsx|client/src/pages/GastosLoginPage.tsx|client/src/pages/GastosPage.tsx|client/src/pages/EmprestimoPage.tsx|.github/scripts/patch_route_block_reason.py)$' | wc -l)" -eq 0

      - name: TypeScript regression check
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          code=$?
          set -e
          cat /tmp/tsc.log
          if [ "$code" -ne 0 ]; then
            if grep -Eq 'server/customerAccess\.ts|server/routers/spreadsheet\.ts|client/src/pages/(AdminGastosPage|AdminCustomers|GastosLoginPage)\.tsx' /tmp/tsc.log; then
              echo 'Erro TypeScript relacionado ao ajuste.'
              exit 1
            fi
            if grep -E 'client/src/pages/(GastosPage|EmprestimoPage)\.tsx' /tmp/tsc.log | grep -Ev '(66|67|68),' | grep -q .; then
              echo 'Novo erro TypeScript na tela de acesso restrito.'
              exit 1
            fi
            echo 'Somente erros TypeScript preexistentes permaneceram.'
          fi

      - name: Remove temporary files
        run: |
          git rm .github/workflows/patch-route-block-reason.yml
          git rm -f .github/scripts/patch_route_block_reason.py

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(acesso): informar motivo de bloqueio por rota"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
