name: Urgent Auth Gastos Emprestimo

on:
  push:
    branches:
      - fix/gastos-emprestimo-login-loop-20260901

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run server/customerSessionRefreshRegression.test.ts
      - run: pnpm build
