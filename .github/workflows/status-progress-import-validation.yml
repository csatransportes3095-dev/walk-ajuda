name: Status progress import validation
on:
  push:
    branches: [fix/status-progress-import-20261001]
    paths: ['.github/workflows/status-progress-import-validation.yml','scripts/fix-status-progress-import.mjs','server/statusProgressRead.test.ts']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-progress-import-20261001
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install locked dependencies
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Apply one-line reviewed import repair
        run: node scripts/fix-status-progress-import.mjs
      - name: Preserve reviewed application source
        run: cp server/routers.ts /tmp/routers-reviewed.ts
      - name: Verify route callbacks, global progress and login compatibility
        run: |
          mkdir -p /tmp/progress-report
          set -o pipefail
          pnpm exec vitest run server/statusProgressRead.test.ts server/orderProgressSequence.test.ts server/globalOrderProgressIntegration.test.ts 2>&1 | tee /tmp/progress-report/route-tests.txt
          node --test scripts/order-login-render-compat.test.mjs 2>&1 | tee /tmp/progress-report/login-build-tests.txt
      - name: Execute Docker preparation and production build
        run: |
          set -o pipefail
          node --input-type=module <<'JS' 2>&1 | tee /tmp/progress-report/preparation.txt
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const scripts=[...fs.readFileSync('Dockerfile','utf8').matchAll(/&& node (scripts\/[^\s]+)/g)].map(m=>m[1]);
          for(const script of scripts) {
            if(!/^scripts\/[A-Za-z0-9._/-]+\.mjs$/.test(script)) throw new Error('Unexpected script');
            execFileSync(process.execPath,[script],{stdio:'inherit'});
          }
          console.log(`All ${scripts.length} preparation scripts passed.`);
          JS
          pnpm exec vitest run server/statusProgressRead.test.ts 2>&1 | tee /tmp/progress-report/prepared-route-tests.txt
          pnpm build 2>&1 | tee /tmp/progress-report/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-progress-import-evidence
          path: /tmp/progress-report
          retention-days: 5
      - name: Commit only the validated import repair
        run: |
          git restore .
          cp /tmp/routers-reviewed.ts server/routers.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          git commit -m 'fix(status): import catalogue reader used by global progress routes'
          git push origin HEAD:fix/status-progress-import-20261001
