name: Validate Zoho email provisioning fix

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply Zoho email provisioning fix
        run: python scripts/apply-zoho-email-create-fix.py

      - name: Complete internal OAuth test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/_core/index.ts')
          text = path.read_text(encoding='utf-8')
          marker = "const testData = {"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('internal Zoho test fixture not found')
          end = text.find('};', start)
          if end < 0:
              raise SystemExit('internal Zoho test fixture end not found')
          block = text[start:end]
          if 'domain:' not in block:
              redirect = "        redirectUri: 'https://h2colombiano.com/api/zoho-oauth-callback',"
              if redirect not in block:
                  raise SystemExit('internal Zoho test fixture redirectUri not found')
              block = block.replace(redirect, "        domain: 'walkajuda.com',\n" + redirect, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Zoho provisioning tests
        run: pnpm vitest run server/zohoProvisioning.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Commit validated Zoho email provisioning fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/zoho.ts server/zohoProvisioning.ts server/zohoProvisioning.test.ts server/routers.ts server/db.ts server/_core/index.ts client/src/pages/AdminEmail.tsx client/src/pages/AdminZohoConfig.tsx
          git commit -m "fix(zoho): make email provisioning domain-safe"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
