name: Fix bot public visibility

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Force root bot visibility from Chat enabled
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('client/src/components/WelcomeScreen.tsx')
          text = p.read_text(encoding='utf-8')
          old = '''  const supportVisible =
    !!onlineSupportState?.chatEnabled &&
    !!onlineSupportState?.welcomeButtonEnabled &&
    !!onlineSupportState?.showOnPage;'''
          new = '''  const supportVisible = location === "/"
    ? !!onlineSupportState?.chatEnabled
    : !!onlineSupportState?.chatEnabled &&
      !!onlineSupportState?.welcomeButtonEnabled &&
      !!onlineSupportState?.showOnPage;'''
          if old not in text:
              raise SystemExit('supportVisible snippet not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Build
        run: pnpm build

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/WelcomeScreen.tsx
          git commit -m "fix(bot): show public button whenever chat is enabled"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
