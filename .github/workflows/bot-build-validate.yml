name: Validate resilient Google Drive backup upload

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply resilient Drive upload repair
        run: python scripts/apply-google-drive-resumable-chunks.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Backup and Drive tests
        run: pnpm vitest run server/backupService.test.ts server/backupRestoreService.test.ts server/disasterRecoveryKit.test.ts server/googleDriveResumableUpload.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Commit validated Drive upload repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/backupService.ts server/googleDriveResumableUpload.ts server/googleDriveResumableUpload.test.ts client/src/pages/AdminBackup.tsx
          git commit -m "fix(backup): make Google Drive upload resumable"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
