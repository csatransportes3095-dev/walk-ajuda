name: Validate backup deep integrity

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - name: Apply backup deep integrity finalizer
        run: python scripts/finalize-backup-integrity.py
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Backup tests
        run: pnpm vitest run server/backupService.test.ts
      - name: TypeScript check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Commit validated backup integrity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/backupService.ts server/routers/backup.ts client/src/pages/AdminBackup.tsx server/backupService.test.ts
          git commit -m "fix(backup): add deep stored artifact verification"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
