name: Validate H2 ADS UX performance v2

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - name: Apply H2 ADS UX performance v2
        run: python scripts/apply-h2ads-ux-performance-v2.py
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Commit validated H2 ADS changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/h2ads.ts server/routers/h2ads.ts client/src/pages/H2Ads.tsx
          git commit -m "feat(h2ads): clarify instance controls and improve responsiveness"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
