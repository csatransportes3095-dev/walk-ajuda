name: Validate bot home visibility fallback

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - name: Apply home fallback
        run: python scripts/fix-online-support-home-fallback.py
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Commit validated fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/WelcomeScreen.tsx
          git commit -m "fix(bot): keep home button visible while public state loads"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
