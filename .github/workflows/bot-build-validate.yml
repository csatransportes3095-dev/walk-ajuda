name: Validate protected backup restore

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - ".github/workflows/bot-build-validate.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - name: Apply protected restore flow
        run: python scripts/apply-protected-backup-restore.py
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Backup and restore tests
        run: pnpm vitest run server/backupService.test.ts server/backupRestoreService.test.ts
      - name: TypeScript check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Commit validated protected restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example server/backupService.ts server/backupRestoreService.ts server/backupRestoreService.test.ts server/routers/backup.ts server/_core/trpc.ts client/src/pages/AdminBackup.tsx
          git commit -m "feat(backup): add protected restore flow"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
