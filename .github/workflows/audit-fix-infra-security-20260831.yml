name: Audit fix infra security 20260831

on:
  push:
    branches:
      - audit/fix-infra-security-2026-08-31

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify security invariants
        shell: python
        run: |
          from pathlib import Path
          source = Path("server/_core/index.ts").read_text(encoding="utf-8")
          forbidden = [
              'app.get("/api/zoho-test-session"',
              'TEST_walk1',
              'function isPortAvailable',
              'function findAvailablePort',
              'import net from "net"',
              'ClientSecret match',
          ]
          required = [
              'server.listen(port, "0.0.0.0"',
              'server.once("error"',
              'Number.parseInt(process.env.PORT || "3000", 10)',
          ]
          for item in forbidden:
              if item in source:
                  raise SystemExit(f"Forbidden legacy code remains: {item}")
          for item in required:
              if item not in source:
                  raise SystemExit(f"Required protection missing: {item}")

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression test
        run: pnpm exec vitest run server/infraSecurityRegression.test.ts

      - name: Type check
        run: pnpm check

      - name: Production build
        run: pnpm build
