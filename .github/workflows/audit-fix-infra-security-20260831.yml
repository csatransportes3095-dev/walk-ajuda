name: Audit fix infra security 20260831

on:
  push:
    branches:
      - audit/fix-infra-security-2026-08-31

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact safe patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("server/_core/index.ts")
          source = path.read_text(encoding="utf-8")
          original = source

          def replace_once(pattern: str, replacement: str, label: str, flags=0):
              global source
              updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              source = updated

          replace_once(r'^import net from "net";\n', '', 'remove net import', re.MULTILINE)

          replace_once(
              r'function isPortAvailable\(port: number\): Promise<boolean> \{.*?\n\}\n\nasync function findAvailablePort\(startPort: number = 3000\): Promise<number> \{.*?\n\}\n\n',
              '',
              'remove port scanner',
              re.DOTALL,
          )

          start_marker = '  // Endpoint de teste para debugar sessão OAuth\n'
          end_marker = '  // Pixel de rastreamento de abertura de e-mail\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('Zoho test route markers changed; refusing unsafe patch')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          source = source[:start] + source[end:]

          replace_once(
              r'  const preferredPort = parseInt\(process\.env\.PORT \|\| "3000"\);\n\s*const port = await findAvailablePort\(preferredPort\);\n\s*if \(port !== preferredPort\) \{\n\s*console\.log\(`Port \$\{preferredPort\} is busy, using port \$\{port\} instead`\);\n\s*\}\n\s*server\.listen\(port, \(\) => \{\n\s*console\.log\(`Server running on http://localhost:\$\{port\}/`\);',
              '''  const port = Number.parseInt(process.env.PORT || "3000", 10);\n  if (!Number.isInteger(port) || port < 1 || port > 65535) {\n    throw new Error("Invalid PORT configuration");\n  }\n\n  server.once("error", (error) => {\n    console.error("[Server] failed to listen on configured PORT:", error);\n    process.exit(1);\n  });\n\n  server.listen(port, "0.0.0.0", () => {\n    console.log(`Server running on http://0.0.0.0:${port}/`);''',
              'Render PORT binding',
          )

          if source == original:
              raise SystemExit('No changes produced')

          forbidden = [
              'app.get("/api/zoho-test-session"',
              'TEST_walk1',
              'function isPortAvailable',
              'function findAvailablePort',
              'import net from "net"',
          ]
          for item in forbidden:
              if item in source:
                  raise SystemExit(f'Forbidden legacy code remains: {item}')

          required = [
              'server.listen(port, "0.0.0.0"',
              'server.once("error"',
              'Number.parseInt(process.env.PORT || "3000", 10)',
          ]
          for item in required:
              if item not in source:
                  raise SystemExit(f'Required protection missing: {item}')

          path.write_text(source, encoding="utf-8")

          test = Path("server/infraSecurityRegression.test.ts")
          test.write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst projectRoot = path.resolve(import.meta.dirname, "..");\nconst indexSource = fs.readFileSync(path.join(projectRoot, "server/_core/index.ts"), "utf8");\n\ndescribe("infra/security regression", () => {\n  it("uses exactly Render configured PORT without scanning alternate ports", () => {\n    expect(indexSource).toContain('Number.parseInt(process.env.PORT || "3000", 10)');\n    expect(indexSource).toContain('server.listen(port, "0.0.0.0"');\n    expect(indexSource).toContain('server.once("error"');\n    expect(indexSource).not.toContain('function isPortAvailable');\n    expect(indexSource).not.toContain('function findAvailablePort');\n    expect(indexSource).not.toContain('import net from "net"');\n  });\n\n  it("does not publish the temporary Zoho OAuth debug route or embedded test secret", () => {\n    expect(indexSource).not.toContain('/api/zoho-test-session');\n    expect(indexSource).not.toContain('TEST_walk1');\n    expect(indexSource).not.toMatch(/zohoClientSecret\\s*:\\s*["'][^"']+["']/);\n    expect(indexSource).not.toContain('ClientSecret match');\n  });\n});\n''', encoding="utf-8")

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression test
        run: pnpm exec vitest run server/infraSecurityRegression.test.ts

      - name: Type check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/index.ts server/infraSecurityRegression.test.ts
          git commit -m "fix(infra): harden Render port and remove Zoho debug secret"
          git push origin HEAD:audit/fix-infra-security-2026-08-31
