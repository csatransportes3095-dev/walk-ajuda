name: Validate automatic scheduling PR
on:
  push:
    branches: [auto-agendamento-produtos]
  pull_request:
    branches: [main]
    paths:
      - 'server/autoSchedule.ts'
      - 'server/routers.ts'
      - 'server/routers/schedule.ts'
      - 'client/src/pages/Home.tsx'
      - 'client/src/pages/OrderTracking.tsx'
      - 'client/src/pages/AdminProducts.tsx'
      - '.github/workflows/validate-auto-schedule-pr.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
