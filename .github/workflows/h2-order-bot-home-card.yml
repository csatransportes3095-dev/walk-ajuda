name: H2 - atalho assistente de pedidos na pagina principal
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'client/src/pages/HomeRouteCards.tsx'
      - 'server/homeOrderBotShortcut.test.ts'
      - '.github/workflows/h2-order-bot-home-card.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Verify assistant shortcut and original cards
        run: pnpm exec vitest run server/homeOrderBotShortcut.test.ts
      - name: Compile production website
        run: pnpm build
