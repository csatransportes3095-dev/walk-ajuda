name: Repair Admin Loans Consistency

on:
  push:
    paths:
      - '.github/workflows/repair-admin-loans-consistency.yml'
      - 'scripts/repair-admin-loans-consistency.cjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/repair-admin-loans-consistency.cjs
      - name: Commit fixes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/repair-admin-loans-consistency.cjs .github/workflows/repair-admin-loans-consistency.yml
          git add server/routers/loans.ts
          git commit -m "fix: corrige consistência financeira do ADM empréstimos"
          git push origin HEAD:main
