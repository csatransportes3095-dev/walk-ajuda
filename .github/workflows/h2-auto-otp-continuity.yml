name: H2 AUTO - OTP continuity diagnostics
on:
  pull_request:
    paths:
      - 'server/h2-auto-diagnostics.ts'
      - 'client/src/pages/AdminH2Auto.tsx'
      - 'server/h2-auto-otp-continuity.test.ts'
      - '.github/workflows/h2-auto-otp-continuity.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2-auto-otp-continuity.test.ts
