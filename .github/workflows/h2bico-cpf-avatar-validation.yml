name: H2BICO CPF Face Association
on:
  push:
    branches:
      - fix/h2bico-cpf-avatar-automatic-pairing-20261021
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2bicoCpfAvatarMatcher.test.ts
      - run: pnpm run build
