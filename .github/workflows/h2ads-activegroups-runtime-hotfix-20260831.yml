name: H2ADS activeGroups runtime hotfix

on:
  push:
    branches:
      - hotfix/h2ads-activegroups-runtime-20260831
    paths:
      - ".github/workflows/h2ads-activegroups-runtime-hotfix-20260831.yml"
      - "scripts/hotfix-h2ads-activegroups-runtime-20260831.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/h2ads-activegroups-runtime-20260831
          fetch-depth: 0
      - name: Apply hotfix
        run: python scripts/hotfix-h2ads-activegroups-runtime-20260831.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml
      - name: Runtime scope guard
        shell: python
        run: |
          from pathlib import Path
          source = Path('client/src/pages/H2Ads.tsx').read_text(encoding='utf-8')
          start = source.index('function GroupSection(')
          end = source.index('function InstanceCard(', start)
          section = source[start:end]
          if 'activeGroups' in section:
              raise SystemExit('activeGroups leaked into GroupSection runtime scope')
          if 'groups={groups} onMoveGroup={onMoveInstanceGroup}' not in section:
              raise SystemExit('GroupSection does not pass groups prop to InstanceCard')
          print('H2ADS_ACTIVEGROUPS_RUNTIME_GUARD_OK')
      - name: H2ADS routing tests
        run: pnpm vitest run server/h2adsGroupRouting.test.ts server/h2adsWorkerFoundation.test.ts server/h2adsWorkerRoute.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/H2Ads.tsx
          git diff --cached --check
          git commit -m "hotfix(h2ads): corrigir activeGroups fora de escopo [skip ci]"
          git push origin HEAD:hotfix/h2ads-activegroups-runtime-20260831
