name: Ad Video End Close Fix

on:
  push:
    branches:
      - fix/ad-video-end-close-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Apply patch
        run: node scripts/apply-ad-video-end-close-fix.mjs
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run regression test
        run: pnpm exec vitest run server/adCampaignVideoEndClose.test.ts server/publicVideoRange.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx client/src/pages/OrderTracking.tsx client/src/pages/SpreadsheetPage.tsx server/adCampaignVideoEndClose.test.ts
          git commit -m "fix(ads): fechar video no final e voltar para pagina"
          git push origin HEAD:fix/ad-video-end-close-20260901
