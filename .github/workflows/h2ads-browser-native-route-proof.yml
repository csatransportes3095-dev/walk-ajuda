name: H2ADS Browser Native Route Proof

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - scripts/patch-h2ads-browser-native-route-proof-20260903.py
      - .github/workflows/h2ads-browser-native-route-proof.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply browser-native route proof
        run: python3 scripts/patch-h2ads-browser-native-route-proof-20260903.py

      - name: Validate touched files
        run: |
          node --check workers/windows/browser-session.mjs
          git diff --check

      - name: Commit patched H2ADS protection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/windows/browser-session.mjs client/src/pages/H2Ads.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(h2ads): comprovar rota dentro do navegador"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
