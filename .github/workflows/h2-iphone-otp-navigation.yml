name: H2 iPhone OTP Safari navigation safety
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'client/src/components/CustomerOtpLogin.tsx'
      - 'server/customerOtpIphoneNavigation.test.ts'
      - 'scripts/tests/customer-otp-delivery-ui/**'
      - '.github/workflows/h2-iphone-otp-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  otp-ios-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Run isolated iPhone OTP regression
        run: pnpm exec vitest run server/customerOtpIphoneNavigation.test.ts
      - name: Build production site
        run: pnpm build
      - name: Verify actual WebKit engine navigation, reload and code entry
        env:
          PLAYWRIGHT_BROWSER: webkit
          CUSTOMER_OTP_DELIVERY_UI_OUTPUT_DIR: ${{ runner.temp }}/otp-webkit-safari
        run: |
          mkdir -p "$CUSTOMER_OTP_DELIVERY_UI_OUTPUT_DIR"
          npm install --prefix "$RUNNER_TEMP/otp-webkit-tools" --no-package-lock --no-audit --no-fund playwright@1.57.0
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/otp-webkit-tools/node_modules/playwright/index.mjs"
          "$RUNNER_TEMP/otp-webkit-tools/node_modules/.bin/playwright" install --with-deps webkit
          node scripts/tests/customer-otp-delivery-ui/server.mjs > "$CUSTOMER_OTP_DELIVERY_UI_OUTPUT_DIR/server.log" 2>&1 &
          otp_server_pid=$!
          trap 'kill "$otp_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 1 http://127.0.0.1:4177/test-control > /dev/null; then
              break
            fi
            if ! kill -0 "$otp_server_pid" 2>/dev/null; then
              cat "$CUSTOMER_OTP_DELIVERY_UI_OUTPUT_DIR/server.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --max-time 2 http://127.0.0.1:4177/test-control > /dev/null
          node scripts/tests/customer-otp-delivery-ui/navigation-qa.mjs
      - name: Keep WebKit Safari navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-iphone-otp-webkit-evidence
          path: |
            ${{ runner.temp }}/otp-webkit-safari/*.png
            ${{ runner.temp }}/otp-webkit-safari/*.json
            ${{ runner.temp }}/otp-webkit-safari/*.log
          if-no-files-found: ignore
          retention-days: 7
