name: H2 iPhone OTP Safari navigation safety
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'client/src/components/CustomerOtpLogin.tsx'
      - 'server/customerOtpIphoneNavigation.test.ts'
      - '.github/workflows/h2-iphone-otp-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  otp-ios-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Run isolated iPhone OTP regression
        run: pnpm exec vitest run server/customerOtpIphoneNavigation.test.ts
      - name: Build production site
        run: pnpm build
