name: Apply customer address patch

on:
  push:
    branches:
      - feat/endereco-completo-cadastro-v2
    paths:
      - scripts/_apply_customer_address_patch.py
      - .github/workflows/apply-customer-address-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/endereco-completo-cadastro-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align patch with safe baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_customer_address_patch.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('# 1) Banco / schema')
          end = s.index("migration = '''", start)
          schema_block = '''# 1) Banco / schema
          replace_once(
              'drizzle/schema.ts',
              '  email: varchar("email", { length: 320 }),\\n  city: varchar("city", { length: 128 }),\\n  uf: varchar("uf", { length: 2 }),\\n  cpf: varchar("cpf", { length: 14 }),',
              '  email: varchar("email", { length: 320 }),\\n  cep: varchar("cep", { length: 9 }),\\n  street: varchar("street", { length: 255 }),\\n  addressNumber: varchar("addressNumber", { length: 30 }),\\n  neighborhood: varchar("neighborhood", { length: 150 }),\\n  addressComplement: varchar("addressComplement", { length: 255 }),\\n  city: varchar("city", { length: 128 }),\\n  uf: varchar("uf", { length: 2 }),\\n  cpf: varchar("cpf", { length: 14 }),'
          )

          '''
          s = s[:start] + schema_block + s[end:]

          start = s.index('# 2) Política central de atualização obrigatória')
          end = s.index('# 3) Backend de atualização cadastral', start)
          policy_block = '''# 2) Política central de atualização obrigatória
          replace_once(
              'shared/customerProfileUpdate.ts',
              '  { id: "email", label: "E-mail" },\\n  { id: "city", label: "Cidade" },',
              '  { id: "email", label: "E-mail" },\\n  { id: "cep", label: "CEP" },\\n  { id: "street", label: "Rua / Logradouro" },\\n  { id: "addressNumber", label: "Número" },\\n  { id: "neighborhood", label: "Bairro" },\\n  { id: "city", label: "Cidade" },'
          )
          replace_once(
              'shared/customerProfileUpdate.ts',
              '    case "email":\\n      return !/^\\\\S+@\\\\S+\\\\.\\\\S+$/.test(String(customer?.email || "").trim());\\n    case "city":',
              '    case "email":\\n      return !/^\\\\S+@\\\\S+\\\\.\\\\S+$/.test(String(customer?.email || "").trim());\\n    case "cep":\\n      return String(customer?.cep || "").replace(/\\\\D/g, "").length !== 8;\\n    case "street":\\n      return String(customer?.street || "").trim().length < 2;\\n    case "addressNumber":\\n      return String(customer?.addressNumber || "").trim().length < 1;\\n    case "neighborhood":\\n      return String(customer?.neighborhood || "").trim().length < 2;\\n    case "city":'
          )

          '''
          s = s[:start] + policy_block + s[end:]

          start = s.index('# 6) Backend principal: cadastro + pedidos ADM')
          end = s.index('# 7) ADM clientes:', start)
          routers_block = '''# 6) Backend principal: cadastro + pedidos ADM
          p = 'server/routers.ts'
          replace_once(p,
              '        cpf: z.string().min(11, "CPF inválido").max(18),\\n        city: z.string().min(1, "Cidade é obrigatória"),\\n        uf: z.string().length(2, "UF deve ter 2 caracteres"),',
              '        cpf: z.string().min(11, "CPF inválido").max(18),\\n        cep: z.string().trim().min(8, "CEP é obrigatório").max(9),\\n        street: z.string().trim().min(2, "Rua / logradouro é obrigatório").max(255),\\n        addressNumber: z.string().trim().min(1, "Número é obrigatório").max(30),\\n        neighborhood: z.string().trim().min(2, "Bairro é obrigatório").max(150),\\n        addressComplement: z.string().trim().max(255).optional(),\\n        city: z.string().trim().min(1, "Cidade é obrigatória"),\\n        uf: z.string().trim().length(2, "UF deve ter 2 caracteres"),'
          )
          replace_once(p,
              '          cpf: normalizeCustomerCpf(input.cpf),\\n          profilePhotoUrl: input.profilePhotoUrl,\\n          city: input.city || undefined,\\n          uf: input.uf || undefined,',
              '          cpf: normalizeCustomerCpf(input.cpf),\\n          cep: input.cep.replace(/\\\\D/g, "").replace(/^(\\\\d{5})(\\\\d{3})$/, "$1-$2"),\\n          street: input.street.trim(),\\n          addressNumber: input.addressNumber.trim(),\\n          neighborhood: input.neighborhood.trim(),\\n          addressComplement: input.addressComplement?.trim() || undefined,\\n          profilePhotoUrl: input.profilePhotoUrl,\\n          city: input.city.trim(),\\n          uf: input.uf.trim().toUpperCase(),'
          )
          replace_all(p,
              '          c.city as customerCity,\\n          c.uf as customerUf,',
              '          c.cep as customerCep,\\n          c.street as customerStreet,\\n          c.addressNumber as customerAddressNumber,\\n          c.neighborhood as customerNeighborhood,\\n          c.addressComplement as customerAddressComplement,\\n          c.city as customerCity,\\n          c.uf as customerUf,',
              minimum=1
          )
          replace_all(p,
              '            c.city AS customerCity,\\n            c.uf AS customerUf,',
              '            c.cep AS customerCep,\\n            c.street AS customerStreet,\\n            c.addressNumber AS customerAddressNumber,\\n            c.neighborhood AS customerNeighborhood,\\n            c.addressComplement AS customerAddressComplement,\\n            c.city AS customerCity,\\n            c.uf AS customerUf,',
              minimum=1
          )
          replace_all(p,
              '            customerCity: row.customerCity,\\n            customerUf: row.customerUf,',
              '            customerCep: row.customerCep,\\n            customerStreet: row.customerStreet,\\n            customerAddressNumber: row.customerAddressNumber,\\n            customerNeighborhood: row.customerNeighborhood,\\n            customerAddressComplement: row.customerAddressComplement,\\n            customerCity: row.customerCity,\\n            customerUf: row.customerUf,',
              minimum=1
          )

          '''
          s = s[:start] + routers_block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply isolated address patch
        run: python scripts/_apply_customer_address_patch.py
      - name: Audit forbidden files
        run: |
          git diff --name-only > /tmp/working.txt
          cat /tmp/working.txt
          if grep -Eq '^(client/src/components/StorefrontProductCard.tsx|client/src/components/ui/tabs.tsx|client/src/pages/Gastos.tsx)$' /tmp/working.txt; then
            echo 'Forbidden file changed' >&2
            exit 1
          fi
      - name: Install and validate
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore scripts/_apply_customer_address_patch.py .github/workflows/apply-customer-address-patch.yml
          git add drizzle/schema.ts shared/customerProfileUpdate.ts server/routers/customerUpdate.ts client/src/pages/AtualizarCadastro.tsx client/src/components/PasswordGate.tsx server/routers.ts client/src/pages/AdminCustomers.tsx client/src/pages/AdminOrders.tsx scripts/apply-customer-address-migration.ts scripts/render-start.sh
          git commit -m 'feat(cadastro): endereço completo obrigatório' || exit 0
          git push origin HEAD:feat/endereco-completo-cadastro-v2
