name: Apply customer address patch

on:
  push:
    branches:
      - feat/endereco-completo-cadastro-v2
    paths:
      - scripts/_apply_customer_address_patch.py
      - .github/workflows/apply-customer-address-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/endereco-completo-cadastro-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply isolated address patch
        run: python scripts/_apply_customer_address_patch.py
      - name: Audit forbidden files
        run: |
          git diff --name-only 015f969fbc515836261d9585511276d994534e33...HEAD > /tmp/before.txt || true
          git diff --name-only > /tmp/working.txt
          if grep -Eq '^(client/src/components/StorefrontProductCard.tsx|client/src/components/ui/tabs.tsx|client/src/pages/Gastos.tsx)$' /tmp/working.txt; then
            echo 'Forbidden file changed' >&2
            cat /tmp/working.txt
            exit 1
          fi
      - name: Install and validate
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drizzle/schema.ts shared/customerProfileUpdate.ts server/customerProfileUpdatePolicy.ts server/routers/customerUpdate.ts client/src/pages/AtualizarCadastro.tsx client/src/components/PasswordGate.tsx server/routers.ts client/src/pages/AdminCustomers.tsx client/src/pages/AdminOrders.tsx scripts/apply-customer-address-migration.ts scripts/render-start.sh
          git commit -m 'feat(cadastro): endereço completo obrigatório' || exit 0
          git push origin HEAD:feat/endereco-completo-cadastro-v2
