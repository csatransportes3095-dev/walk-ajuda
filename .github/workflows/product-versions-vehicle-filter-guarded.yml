name: Product Versions Vehicle Filter Guarded

on:
  push:
    branches:
      - feat/product-versions-vehicle-filter-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Harden patch targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-product-versions-vehicle-filter.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    if (section.includes('promoEndsAt: z.number().nullable().optional()') && section.includes('originalPrice: z.string().optional()')) return section;\n", "")
          s = s.replace("  src = src.replace('grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 items-end', 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-2 items-end');\n", "")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply guarded patch
        run: node scripts/apply-product-versions-vehicle-filter.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Targeted regression
        run: pnpm exec vitest run server/productVersionVehicleFlow.test.ts
      - name: Production build
        run: pnpm build
      - name: Remove temporary machinery
        run: rm -f scripts/apply-product-versions-vehicle-filter.mjs .github/workflows/product-versions-vehicle-filter-guarded.yml
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx client/src/pages/AdminProducts.tsx server/db.ts server/routers.ts shared/vehicleCatalog.ts scripts/rebuild-question-tree.mjs server/productVersionVehicleFlow.test.ts
          git commit -m "feat(products): versoes com preco e filtro compacto de veiculo"
          git push origin HEAD:feat/product-versions-vehicle-filter-20260901
