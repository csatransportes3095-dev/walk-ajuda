name: Transportes - validacao producao
on:
  push:
    branches: [feature/transportes-producao-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependencias do Dockerfile
        run: pnpm install --frozen-lockfile
      - name: Testar CNPJs
        run: pnpm exec vitest run server/transportes.test.ts
      - name: Compilar app
        run: pnpm run build
