name: H2 AUTO device controls check
on:
  push:
    branches: [feature/h2-auto-desvincular-remover-20261025]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec esbuild server/h2-auto-remote.ts --bundle --platform=node --packages=external --outfile=/tmp/h2-auto-device.js
      - run: pnpm exec esbuild client/src/pages/AdminH2Auto.tsx --bundle --platform=browser --packages=external --loader:.css=empty --outfile=/tmp/h2-auto-ui.js
