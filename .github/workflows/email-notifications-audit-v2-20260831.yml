name: Email notifications audit v2

on:
  push:
    branches:
      - audit/email-notifications-20260831-v2
    paths:
      - ".github/workflows/email-notifications-audit-v2-20260831.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/email-notifications-20260831-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Email notification tests
        run: pnpm vitest run server/email-notifications.test.ts
      - name: Type check
        run: pnpm check
      - name: Production build
        run: pnpm build
