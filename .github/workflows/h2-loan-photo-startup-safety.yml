name: H2 Loan Photo Startup Safety
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'scripts/render-start.sh'
      - 'scripts/apply-loans-recovery-20260822-fix.ts'
      - 'server/_core/index.ts'
      - 'server/loanPhotoPostListenSafety.test.ts'
      - '.github/workflows/h2-loan-photo-startup-safety.yml'
permissions:
  contents: read
jobs:
  verify-loan-photo-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/loanPhotoPostListenSafety.test.ts server/bootReadonlyAuditSafety.test.ts
      - run: node scripts/patch-media-local-export-20260910.mjs
      - run: pnpm build
