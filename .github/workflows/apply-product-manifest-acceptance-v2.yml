name: Apply Product Manifest Acceptance V2
on:
  push:
    branches:
      - feat/product-manifest-acceptance-20260901
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python3 scripts/apply-product-manifest-acceptance.py
      - run: git diff --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/optionPriceModelsFlow.test.ts server/productManifestFlow.test.ts
      - run: pnpm build
      - run: rm -f .github/workflows/apply-product-manifest-acceptance-v2.yml scripts/apply-product-manifest-acceptance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/ProductManifestEditor.tsx client/src/components/ProductManifestGuard.tsx client/src/lib/productManifest.ts client/src/pages/AdminProducts.tsx client/src/components/StorefrontProductCard.tsx client/src/main.tsx server/productManifestFlow.test.ts
          git add -u .github/workflows/apply-product-manifest-acceptance-v2.yml scripts/apply-product-manifest-acceptance.py
          git commit -m "feat(products): manifesto por produto com aceite obrigatorio"
          git push origin HEAD:feat/product-manifest-acceptance-20260901
