name: Prod hardening release 20260831

on:
  push:
    branches:
      - release/prod-hardening-20260831

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated daily fee core and server flow
        run: |
          git fetch origin fix/daily-late-fees-20260831 fix/daily-late-fee-audit-20260831
          git checkout origin/fix/daily-late-fees-20260831 -- server/loans/lateFee.ts server/loans/lateFee.test.ts
          git show origin/fix/daily-late-fee-audit-20260831:scripts/patch-daily-late-fee.mjs > /tmp/daily-patch.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/daily-patch.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("patchLoansRouter();\npatchAdminLoans();\npatchPublicLoans();\nconsole.log('PATCH_DAILY_LATE_FEE_OK');", "patchLoansRouter();\nconsole.log('PATCH_DAILY_LATE_FEE_SERVER_OK');")
          p.write_text(s, encoding='utf-8')
          PY
          node /tmp/daily-patch.mjs

      - name: Finish daily fee production integration
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('server/routers/loans.ts')
          s=p.read_text(encoding='utf-8')

          # Proxima parcela recebe o mesmo valor efetivo do fluxo detalhado.
          old='SELECT li.*, l.id as loanId FROM loanInstallments li'
          if s.count(old) != 1: raise SystemExit(f'next select mismatch {s.count(old)}')
          s=s.replace(old,'SELECT li.*, l.id as loanId, l.paymentType AS loanPaymentType FROM loanInstallments li',1)
          anchor='      nextInstallment = nextInsts[0] || null;\n'
          if s.count(anchor) != 1: raise SystemExit(f'next assignment mismatch {s.count(anchor)}')
          extra='''      nextInstallment = nextInsts[0] || null;
          if (nextInstallment && String(nextInstallment.loanPaymentType || '') === 'diario' && !client.late_fee_disabled) {
            const nextFeeConfigRows = await qRows(db, drizzleSql`SELECT * FROM loan_late_fee_config WHERE id=1 LIMIT 1`);
            const nextBaseAmount = nextInstallment.originalAmount != null ? Number(nextInstallment.originalAmount || 0) : Number(nextInstallment.amount || 0);
            const nextStoredFee = Number(nextInstallment.feeApplied || 0);
            const nextAutomaticFee = calculateLateFeeForInstallment({ dueDate: nextInstallment.dueDate, amount: nextBaseAmount, config: nextFeeConfigRows[0], clock: getBrazilClock() });
            const nextEffectiveFee = Math.max(nextStoredFee, nextAutomaticFee);
            if (nextEffectiveFee > 0) {
              nextInstallment = { ...nextInstallment, amount: Math.round((nextBaseAmount + nextEffectiveFee) * 100) / 100, originalAmount: nextBaseAmount.toFixed(2), feeApplied: nextEffectiveFee.toFixed(2), lateFeePreview: nextAutomaticFee > nextStoredFee };
            }
          }
          '''
          s=s.replace(anchor,extra,1)

          # Aplicacao manual: pode ser feita a qualquer hora, mas nunca reduz taxa valida.
          manual_pattern=r'''    // O ADM pode aplicar manualmente a taxa em qualquer data/horário\.[\s\S]*?    return \{ ok: true, originalAmount, feeAmount: input\.feeAmount, newAmount \};'''
          manual_repl='''    // O ADM pode aplicar manualmente a taxa em qualquer data/horário.
              // Mesmo no manual, nunca e permitido reduzir uma taxa automatica valida ou uma taxa ja gravada.
              const originalAmount = current.originalAmount != null ? parseFloat(current.originalAmount) : parseFloat(current.amount);
              const storedFee = current.feeApplied != null ? parseFloat(current.feeApplied) : 0;
              const cfgRows = await qRows(db, drizzleSql`SELECT * FROM loan_late_fee_config WHERE id=1 LIMIT 1`);
              const automaticFee = calculateLateFeeForInstallment({ dueDate: current.dueDate, amount: originalAmount, config: cfgRows[0], clock: getBrazilClock() });
              const effectiveFee = Math.max(storedFee, input.feeAmount, automaticFee);
              const newAmount = Math.round((originalAmount + effectiveFee) * 100) / 100;
              const spNow = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
              const note = input.feeNote || `Taxa diaria manual: +R$ ${effectiveFee.toFixed(2).replace('.', ',')} aplicada pelo ADM em ${spNow}`;
              await db.execute(drizzleSql`
                UPDATE loanInstallments
                SET amount=${newAmount.toFixed(2)}, originalAmount=${originalAmount.toFixed(2)}, feeApplied=${effectiveFee.toFixed(2)}, notes=${note}
                WHERE id=${input.installmentId}
              `);
              return { ok: true, originalAmount, feeAmount: effectiveFee, newAmount };'''
          s,n=re.subn(manual_pattern,manual_repl,s,count=1)
          if n != 1: raise SystemExit(f'manual maximum mismatch {n}')

          # ADM detalhado usa a mesma formula central, preservando outros recursos atuais da producao.
          get_pattern=r'''  getLoan: adminProcedure\.input\(z\.object\(\{ id: z\.number\(\) \}\)\)\.query\(async \(\{ input \}\) => \{[\s\S]*?\n  \}\),\n\n  createLoan:'''
          get_repl='''  getLoan: adminProcedure.input(z.object({ id: z.number() })).query(async ({ input }) => {
            const db = await getDb() as any;
            const rows = await qRows(db, drizzleSql`
              SELECT l.*, lc.name as clientName, lc.phone as clientPhone, lc.cpf as clientCpf,
                lc.late_fee_disabled as clientLateFeeDisabled
              FROM loans l JOIN loanClients lc ON lc.id = l.clientId WHERE l.id=${input.id}
            `);
            if (!rows.length) throw new TRPCError({ code: "NOT_FOUND" });
            const clock = getBrazilClock();
            const rawInstallments = await qRows(db, drizzleSql`SELECT * FROM loanInstallments WHERE loanId=${input.id} ORDER BY installmentNumber ASC`);
            const scoreByInstallment = await getH2ScoreSubmissionMap(db, rawInstallments.map((i: any) => Number(i.id)));
            const configRows = await qRows(db, drizzleSql`SELECT * FROM loan_late_fee_config WHERE id=1 LIMIT 1`);
            const lateFeeConfig = configRows[0];
            const isDailyLoan = String(rows[0].paymentType || '') === 'diario';
            const instRows = rawInstallments.map((i: any) => {
              const baseAmount = i.originalAmount != null ? Number(i.originalAmount || 0) : Number(i.amount || 0);
              const storedFee = i.feeApplied != null ? Number(i.feeApplied || 0) : 0;
              const canCalculateAutomaticFee = isDailyLoan && !rows[0].clientLateFeeDisabled && ['pendente', 'atrasado'].includes(i.status);
              const automaticFee = canCalculateAutomaticFee ? calculateLateFeeForInstallment({ dueDate: i.dueDate, amount: baseAmount, config: lateFeeConfig, clock }) : 0;
              const effectiveFee = isDailyLoan ? Math.max(storedFee, automaticFee) : 0;
              const effectiveAmount = effectiveFee > 0 ? Math.round((baseAmount + effectiveFee) * 100) / 100 : i.amount;
              return { ...i, amount: effectiveAmount, ...(isDailyLoan && effectiveFee > 0 ? { originalAmount: baseAmount.toFixed(2), feeApplied: effectiveFee.toFixed(2), lateFeePreview: automaticFee > storedFee } : {}), h2ScoreSubmission: scoreByInstallment.get(Number(i.id)) || null, isOverdue: !['pago','cancelado','reprovado','em_analise'].includes(i.status) && i.dueDate < clock.today };
            });
            const h2Score = await getClientH2ScoreSummary(db, [Number(rows[0].clientId)]);
            return { ...rows[0], installments: instRows, h2Score };
          }),

          createLoan:'''
          s,n=re.subn(get_pattern,get_repl,s,count=1)
          if n != 1: raise SystemExit(f'ADM getLoan mismatch {n}')

          if 'isLateFeeWindowOpen' in s:
            raise SystemExit('old isLateFeeWindowOpen remains after server patch')
          required=["AND l.paymentType = 'diario'","Math.max(storedFee, input.feeAmount, automaticFee)","Math.max(nextStoredFee, nextAutomaticFee)","String(row.loanPaymentType || '') === 'diario'","String(installment.loanPaymentType || '') !== 'diario'","const isDailyLoan = String(rows[0].paymentType || '') === 'diario';"]
          for item in required:
            if item not in s: raise SystemExit(f'missing loan invariant: {item}')
          p.write_text(s,encoding='utf-8')

          # Interface publica: regras somente para diario e horarios exatos.
          pub=Path('client/src/pages/LoansTab.tsx')
          q=pub.read_text(encoding='utf-8')
          pairs=[
            ('function LateFeePanel({ config, installmentAmount }: { config: any; installmentAmount?: number }) {\n  if (!config?.enabled) return null;','function LateFeePanel({ config, installmentAmount, paymentType }: { config: any; installmentAmount?: number; paymentType?: string }) {\n  if (!config?.enabled || paymentType !== "diario") return null;'),
            ('Das 18h até 19:59:','Das 18:01 até 20:00:'),('A partir das 20h:','Das 20:01 até 23:58:'),('Após 23:59:','Às 23:59 e depois:'),
            ('<LateFeePanel config={lateFeeConfig} />','<LateFeePanel config={lateFeeConfig} paymentType="diario" />'),
            ('<LateFeePanel config={lateFeeConfig} installmentAmount={totalAmt / Math.max(totalCount, 1)} />','<LateFeePanel config={lateFeeConfig} installmentAmount={totalAmt / Math.max(totalCount, 1)} paymentType={loan.paymentType} />'),
          ]
          for old,new in pairs:
            if old not in q: raise SystemExit(f'public UI marker missing: {old[:60]}')
            q=q.replace(old,new,1)
          pub.write_text(q,encoding='utf-8')

          # ADM: +Taxa em diario a qualquer momento e preset 23:59 usa maior valor.
          adm=Path('client/src/pages/AdminLoans.tsx')
          a=adm.read_text(encoding='utf-8')
          old='const feeMidnight = Math.round(originalAmt * (feeMidnightPct / 100) * 100) / 100;'
          if old not in a: raise SystemExit('admin midnight marker missing')
          a=a.replace(old,'const feeMidnight = Math.max(feeTotal18_20, Math.round(originalAmt * (feeMidnightPct / 100) * 100) / 100);',1)
          marker=') : inst.isOverdue ? ('
          if a.count(marker) != 2: raise SystemExit(f'admin +Taxa marker count {a.count(marker)}')
          a=a.replace(marker,') : loan.paymentType === "diario" ? (')
          a=a.replace('Taxa 18h–20h','Taxa manual — regra 18:01')
          a=a.replace('Taxa 20h–23:59 (acumulada)','Taxa manual acumulada — regra 20:01')
          a=a.replace('Taxa após meia-noite ({feeMidnightPct}%)','Taxa final — 23:59 ({feeMidnightPct}%)')
          adm.write_text(a,encoding='utf-8')

      - name: Apply Render PORT hardening
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('server/_core/index.ts'); s=p.read_text(encoding='utf-8')
          if s.count('import net from "net";\n') != 1: raise SystemExit('net import mismatch')
          s=s.replace('import net from "net";\n','',1)
          s,n=re.subn(r'function isPortAvailable\(port: number\): Promise<boolean> \{.*?\n\}\n\nasync function findAvailablePort\(startPort: number = 3000\): Promise<number> \{.*?\n\}\n\n','',s,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'port scanner mismatch {n}')
          old='''  const preferredPort = Number(process.env.PORT || 3000);
          const port = await findAvailablePort(preferredPort);
          server.listen(port, () => {
            console.log(`Server running on http://localhost:${port}/`);
          });'''
          new='''  const port = Number.parseInt(process.env.PORT || "3000", 10);
          if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error("Invalid PORT configuration");
          server.once("error", (error) => {
            console.error("[Server] failed to listen on configured PORT:", error);
            scheduleFatalProcessExit();
          });
          server.listen(port, "0.0.0.0", () => {
            console.log(`Server running on http://0.0.0.0:${port}/`);
          });'''
          if s.count(old) != 1: raise SystemExit(f'startup marker mismatch {s.count(old)}')
          s=s.replace(old,new,1)
          for x in ['findAvailablePort','isPortAvailable','import net from "net"','/api/zoho-test-session','TEST_walk1']:
            if x in s: raise SystemExit(f'infra invariant failed: {x}')
          p.write_text(s,encoding='utf-8')

      - name: Apply H2ADS Google sorry privacy guard
        run: |
          git fetch origin fix/h2ads-google-sorry-privacy-20260831 automation/apply-h2ads-linked-instance-20260830
          git diff --binary origin/automation/apply-h2ads-linked-instance-20260830...origin/fix/h2ads-google-sorry-privacy-20260831 -- workers/windows/browser-session.mjs > /tmp/h2ads.patch
          git apply --3way /tmp/h2ads.patch

      - name: Add production regression tests
        shell: python
        run: |
          from pathlib import Path
          Path('server/prodHardeningRegression.test.ts').write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\nconst root=path.resolve(import.meta.dirname,"..");\nconst indexSource=fs.readFileSync(path.join(root,"server/_core/index.ts"),"utf8");\nconst router=fs.readFileSync(path.join(root,"server/routers/loans.ts"),"utf8");\nconst worker=fs.readFileSync(path.join(root,"workers/windows/browser-session.mjs"),"utf8");\ndescribe("production hardening release",()=>{\n it("binds Render port exactly",()=>{expect(indexSource).toContain('server.listen(port, "0.0.0.0"');expect(indexSource).not.toContain('findAvailablePort');});\n it("keeps Zoho debug route absent",()=>{expect(indexSource).not.toContain('/api/zoho-test-session');expect(indexSource).not.toContain('TEST_walk1');});\n it("protects Google sorry page",()=>{expect(worker).toContain('createGoogleSorryPrivacyGuard');expect(worker).toContain('declarativeNetRequest');expect(worker).toContain('/sorry');expect(worker).toContain('googleSorryPrivacyGuard: "enabled"');});\n it("isolates and preserves daily fee",()=>{expect(router).toContain("AND l.paymentType = 'diario'");expect(router).toContain("Math.max(storedFee, input.feeAmount, automaticFee)");expect(router).toContain("Math.max(nextStoredFee, nextAutomaticFee)");});\n});\n''',encoding='utf-8')
          # Reuse the validated end-to-end assertions from PR 70.
          import subprocess
          subprocess.run(['git','checkout','origin/fix/daily-late-fees-20260831','--','server/dailyLateFeeIntegration.test.ts'],check=True)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml
      - name: Focused tests
        run: pnpm exec vitest run server/loans/lateFee.test.ts server/dailyLateFeeIntegration.test.ts server/prodHardeningRegression.test.ts
      - name: TypeScript check
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/index.ts server/routers/loans.ts server/loans/lateFee.ts server/loans/lateFee.test.ts server/dailyLateFeeIntegration.test.ts server/prodHardeningRegression.test.ts client/src/pages/AdminLoans.tsx client/src/pages/LoansTab.tsx workers/windows/browser-session.mjs
          git commit -m "fix(release): harden production infra loans and h2ads [skip ci]"
          git push origin HEAD:release/prod-hardening-20260831
