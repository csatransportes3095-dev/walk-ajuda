name: Prod hardening release 20260831

on:
  push:
    branches:
      - release/prod-hardening-20260831

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production hardening patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/apply-prod-hardening-20260831.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("        'google\\\\.com/sorry',\n        'google\\\\.com\\\\.br/sorry',\n", "        'regexFilter:',\n        '/sorry',\n")
          p.write_text(s, encoding='utf-8')
          exec(compile(s, str(p), 'exec'))

      - name: Add focused regression tests
        shell: python
        run: |
          from pathlib import Path
          Path('server/prodHardeningRegression.test.ts').write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst root = path.resolve(import.meta.dirname, "..");\nconst indexSource = fs.readFileSync(path.join(root, "server/_core/index.ts"), "utf8");\nconst router = fs.readFileSync(path.join(root, "server/routers/loans.ts"), "utf8");\nconst worker = fs.readFileSync(path.join(root, "workers/windows/browser-session.mjs"), "utf8");\n\ndescribe("production hardening", () => {\n  it("binds exactly to Render PORT", () => {\n    expect(indexSource).toContain('server.listen(port, "0.0.0.0"');\n    expect(indexSource).not.toContain('findAvailablePort');\n    expect(indexSource).not.toContain('import net from "net"');\n  });\n\n  it("keeps Zoho debug secret route absent", () => {\n    expect(indexSource).not.toContain('/api/zoho-test-session');\n    expect(indexSource).not.toContain('TEST_walk1');\n  });\n\n  it("protects Google sorry pages inside H2ADS", () => {\n    expect(worker).toContain('createGoogleSorryPrivacyGuard');\n    expect(worker).toContain('declarativeNetRequest');\n    expect(worker).toContain('/sorry');\n    expect(worker).toContain('googleSorryPrivacyGuard: "enabled"');\n  });\n\n  it("keeps daily fee isolated and maximum-preserving", () => {\n    expect(router).toContain("AND l.paymentType = 'diario'");\n    expect(router).toContain("Math.max(storedFee, input.feeAmount, automaticFee)");\n    expect(router).toContain("Math.max(nextStoredFee, nextAutomaticFee)");\n    expect(router).toContain("const isDailyLoan = String(rows[0].paymentType || '') === 'diario';");\n  });\n});\n''', encoding='utf-8')

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Run focused tests
        run: pnpm exec vitest run server/loans/lateFee.test.ts server/prodHardeningRegression.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Commit validated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/index.ts server/routers/loans.ts client/src/pages/AdminLoans.tsx workers/windows/browser-session.mjs server/prodHardeningRegression.test.ts
          git commit -m "fix(release): harden production infra loans and h2ads [skip ci]"
          git push origin HEAD:release/prod-hardening-20260831
