name: Prod hardening release 20260831

on:
  push:
    branches:
      - release/prod-hardening-20260831

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated daily fee changes onto production lineage
        run: |
          git fetch origin main fix/daily-late-fees-20260831
          git checkout origin/fix/daily-late-fees-20260831 -- server/loans/lateFee.ts server/loans/lateFee.test.ts server/dailyLateFeeIntegration.test.ts
          git diff --binary origin/main...origin/fix/daily-late-fees-20260831 -- server/routers/loans.ts client/src/pages/AdminLoans.tsx client/src/pages/LoansTab.tsx > /tmp/daily-fee.patch
          git apply --3way /tmp/daily-fee.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('server/routers/loans.ts')
          s = p.read_text(encoding='utf-8')
          # A producao tinha uma barreira antiga auxiliar. Depois do patch validado,
          # ela nao deve continuar importada se deixou de ser usada.
          if 'isLateFeeWindowOpen(' not in s:
              s = s.replace('import { calculateLateFeeForInstallment, isLateFeeWindowOpen } from "../loans/lateFee";', 'import { calculateLateFeeForInstallment } from "../loans/lateFee";')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply Render PORT hardening
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('server/_core/index.ts')
          s = p.read_text(encoding='utf-8')
          original = s
          if s.count('import net from "net";\n') != 1:
              raise SystemExit('Render patch: net import changed')
          s = s.replace('import net from "net";\n', '', 1)
          s, n = re.subn(r'function isPortAvailable\(port: number\): Promise<boolean> \{.*?\n\}\n\nasync function findAvailablePort\(startPort: number = 3000\): Promise<number> \{.*?\n\}\n\n', '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Render patch: port scanner mismatch {n}')
          old = '''  const preferredPort = Number(process.env.PORT || 3000);
          const port = await findAvailablePort(preferredPort);
          server.listen(port, () => {
            console.log(`Server running on http://localhost:${port}/`);
          });'''
          new = '''  const port = Number.parseInt(process.env.PORT || "3000", 10);
          if (!Number.isInteger(port) || port < 1 || port > 65535) {
            throw new Error("Invalid PORT configuration");
          }

          server.once("error", (error) => {
            console.error("[Server] failed to listen on configured PORT:", error);
            scheduleFatalProcessExit();
          });

          server.listen(port, "0.0.0.0", () => {
            console.log(`Server running on http://0.0.0.0:${port}/`);
          });'''
          if s.count(old) != 1:
              raise SystemExit(f'Render patch: startup mismatch {s.count(old)}')
          s = s.replace(old, new, 1)
          if s == original:
              raise SystemExit('Render patch produced no changes')
          for forbidden in ['findAvailablePort', 'isPortAvailable', 'import net from "net"', '/api/zoho-test-session', 'TEST_walk1']:
              if forbidden in s:
                  raise SystemExit(f'Render/security invariant failed: {forbidden}')
          p.write_text(s, encoding='utf-8')

      - name: Apply H2ADS Google sorry privacy guard
        run: |
          git fetch origin fix/h2ads-google-sorry-privacy-20260831 automation/apply-h2ads-linked-instance-20260830
          git diff --binary origin/automation/apply-h2ads-linked-instance-20260830...origin/fix/h2ads-google-sorry-privacy-20260831 -- workers/windows/browser-session.mjs > /tmp/h2ads-privacy.patch
          git apply --3way /tmp/h2ads-privacy.patch

      - name: Add production regression test
        shell: python
        run: |
          from pathlib import Path
          Path('server/prodHardeningRegression.test.ts').write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst root = path.resolve(import.meta.dirname, "..");\nconst indexSource = fs.readFileSync(path.join(root, "server/_core/index.ts"), "utf8");\nconst router = fs.readFileSync(path.join(root, "server/routers/loans.ts"), "utf8");\nconst worker = fs.readFileSync(path.join(root, "workers/windows/browser-session.mjs"), "utf8");\n\ndescribe("production hardening release", () => {\n  it("uses exactly Render configured PORT", () => {\n    expect(indexSource).toContain('server.listen(port, "0.0.0.0"');\n    expect(indexSource).toContain('server.once("error"');\n    expect(indexSource).not.toContain('findAvailablePort');\n    expect(indexSource).not.toContain('import net from "net"');\n  });\n\n  it("keeps removed Zoho debug route absent", () => {\n    expect(indexSource).not.toContain('/api/zoho-test-session');\n    expect(indexSource).not.toContain('TEST_walk1');\n  });\n\n  it("protects Google sorry pages in the H2ADS browser", () => {\n    expect(worker).toContain('createGoogleSorryPrivacyGuard');\n    expect(worker).toContain('declarativeNetRequest');\n    expect(worker).toContain('/sorry');\n    expect(worker).toContain('`--load-extension=${privacyGuardExtension}`');\n    expect(worker).toContain('googleSorryPrivacyGuard: "enabled"');\n  });\n\n  it("keeps daily late fee isolated and maximum-preserving", () => {\n    expect(router).toContain("AND l.paymentType = 'diario'");\n    expect(router).toContain("Math.max(storedFee, input.feeAmount, automaticFee)");\n    expect(router).toContain("Math.max(nextStoredFee, nextAutomaticFee)");\n    expect(router).toContain("const isDailyLoan = String(rows[0].paymentType || '') === 'diario';");\n    expect(router).not.toContain('Taxa de atraso só pode ser aplicada após o vencimento da parcela.');\n  });\n});\n''', encoding='utf-8')

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: Run focused tests
        run: pnpm exec vitest run server/loans/lateFee.test.ts server/dailyLateFeeIntegration.test.ts server/prodHardeningRegression.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Commit validated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/index.ts server/routers/loans.ts server/loans/lateFee.ts server/loans/lateFee.test.ts server/dailyLateFeeIntegration.test.ts server/prodHardeningRegression.test.ts client/src/pages/AdminLoans.tsx client/src/pages/LoansTab.tsx workers/windows/browser-session.mjs
          git commit -m "fix(release): harden production infra loans and h2ads [skip ci]"
          git push origin HEAD:release/prod-hardening-20260831
