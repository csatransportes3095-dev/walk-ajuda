name: H2ADS group card colors
on:
  push:
    branches:
      - feat/h2ads-group-card-colors-20260830
    paths:
      - ".github/workflows/h2ads-group-card-colors.yml"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h2ads-group-card-colors-20260830
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-h2ads-group-card-colors.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          git add -N drizzle/0144_h2ads_group_card_color.sql scripts/apply-h2ads-group-card-color-migration.ts
          git diff --name-only | tee /tmp/files
          grep -qx 'client/src/pages/H2Ads.tsx' /tmp/files
          grep -qx 'drizzle/0144_h2ads_group_card_color.sql' /tmp/files
          grep -qx 'drizzle/schema.ts' /tmp/files
          grep -qx 'package.json' /tmp/files
          grep -qx 'scripts/apply-h2ads-group-card-color-migration.ts' /tmp/files
          grep -qx 'scripts/render-start.sh' /tmp/files
          grep -qx 'server/h2ads.ts' /tmp/files
          grep -qx 'server/routers/h2ads.ts' /tmp/files
          test "$(wc -l < /tmp/files)" -eq 8
          grep -q 'cardColor' drizzle/schema.ts
          grep -q 'Cor dos cards das instâncias' client/src/pages/H2Ads.tsx
          grep -q 'visualColor={groupColor}' client/src/pages/H2Ads.tsx
          ! grep -q 'Escolher cor da instância' client/src/pages/H2Ads.tsx
      - name: Build
        run: pnpm build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/H2Ads.tsx drizzle/0144_h2ads_group_card_color.sql drizzle/schema.ts package.json scripts/apply-h2ads-group-card-color-migration.ts scripts/render-start.sh server/h2ads.ts server/routers/h2ads.ts
          git commit -m "feat(h2ads): herdar cor dos cards pelo grupo"
          git push origin HEAD:feat/h2ads-group-card-colors-20260830
