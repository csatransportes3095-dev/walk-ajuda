name: Remove Admin Profile Update Rule

on:
  push:
    branches:
      - fix/remove-admin-profile-update-rule

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply guarded rule removal
        run: node scripts/remove-admin-profile-update-rule.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit validated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/customerProfileUpdatePolicy.ts client/src/pages/AdminCustomers.tsx server/routers.ts
          git commit -m "fix(cadastro): remover regra manual de atualizacao [skip ci]"
          git push origin HEAD:fix/remove-admin-profile-update-rule
