name: H2 Ads order instance link v3

on:
  push:
    branches:
      - feat/h2ads-order-instance-link-v2-2026-08-30
    paths:
      - ".github/workflows/h2ads-order-instance-link-v3.yml"

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: feat/h2ads-order-instance-link-v2-2026-08-30
          fetch-depth: 0

      - name: Reuse vetted implementation generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/h2ads-order-instance-link-v2.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          lines = []
          for line in source[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines)
          exec(compile(script, 'h2ads-order-link-generator', 'exec'), {})
          PY

      - name: Harden live synchronization and cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = r'''import { useMemo, useState } from "react";
          import { toast } from "sonner";
          import { trpc } from "@/lib/trpc";

          type AdminOrder = {
            id: number;
            phone?: string | null;
            subOrderIndex?: number;
            orderNumber?: number | null;
            customerName?: string | null;
            serviceName?: string | null;
            serviceOption?: string | null;
            latestStatus?: string | null;
          };

          const STATUS_LABELS: Record<string, string> = {
            recebido: "Recebido",
            pedido_recebido: "Pedido recebido",
            pagamento_recebido: "Pagamento recebido",
            em_andamento: "Em andamento",
            em_montagem: "Em montagem",
            documentos_aprovados: "Documentos aprovados",
            conta_ativa: "Conta ativa",
            aguardando_ativa: "Aguardando ficar ativa",
            pedido_entregue: "Pedido entregue",
            cancelado: "Cancelado",
          };

          const keyFor = (registrationId: number, subOrderIndex: number) => `${registrationId}:${subOrderIndex}`;
          const statusLabel = (status?: string | null) => status ? (STATUS_LABELS[status] || status.replace(/_/g, " ")) : "Sem status";

          export default function H2AdsOrderLinkControl({ instanceId }: { instanceId: number }) {
            const utils = trpc.useUtils();
            const [search, setSearch] = useState("");
            const linksQuery = trpc.h2Ads.listOrderLinks.useQuery(undefined, { staleTime: 0, refetchOnWindowFocus: true });
            const ordersQuery = trpc.orderStatus.listOrders.useQuery(undefined, {
              staleTime: 0,
              refetchOnWindowFocus: true,
              refetchInterval: 15_000,
              refetchIntervalInBackground: false,
            });
            const setLink = trpc.h2Ads.setOrderLink.useMutation({
              onSuccess: async (_, vars) => {
                toast.success(vars.registrationId === null ? "Vínculo do pedido removido." : "Pedido vinculado à instância.");
                await utils.h2Ads.listOrderLinks.invalidate();
              },
              onError: error => toast.error(error.message || "Não foi possível atualizar o vínculo do pedido."),
            });

            const links = linksQuery.data ?? [];
            const orders = (ordersQuery.data ?? []) as unknown as AdminOrder[];
            const current = links.find(link => link.instanceId === instanceId);
            const currentKey = current ? keyFor(current.registrationId, current.subOrderIndex) : "";
            const normalizedSearch = search.trim().toLowerCase();
            const ownerByOrder = useMemo(() => new Map(links.map(link => [keyFor(link.registrationId, link.subOrderIndex), link.instanceId])), [links]);
            const selectableOrders = useMemo(() => orders.filter(order => {
              const sub = order.subOrderIndex ?? 0;
              const key = keyFor(order.id, sub);
              const active = order.latestStatus !== "pedido_entregue" && order.latestStatus !== "cancelado";
              if (!active && key !== currentKey) return false;
              if (!normalizedSearch || key === currentKey) return true;
              const haystack = [order.orderNumber, order.id, order.customerName, order.phone, order.serviceName, order.serviceOption, order.latestStatus]
                .filter(value => value !== null && value !== undefined)
                .join(" ")
                .toLowerCase();
              return haystack.includes(normalizedSearch);
            }).sort((a, b) => (b.orderNumber ?? b.id) - (a.orderNumber ?? a.id)).slice(0, 80), [orders, currentKey, normalizedSearch]);

            const update = async (value: string) => {
              if (!value) {
                await setLink.mutateAsync({ instanceId, registrationId: null, subOrderIndex: 0 });
                return;
              }
              const [registrationRaw, subRaw] = value.split(":");
              const registrationId = Number(registrationRaw);
              const subOrderIndex = Number(subRaw);
              if (!Number.isInteger(registrationId) || registrationId < 1 || !Number.isInteger(subOrderIndex) || subOrderIndex < 0) return;
              await setLink.mutateAsync({ instanceId, registrationId, subOrderIndex });
            };

            const currentOrder = current ? orders.find(order => order.id === current.registrationId && (order.subOrderIndex ?? 0) === current.subOrderIndex) : undefined;

            return <div className="mt-3 rounded-xl border border-violet-400/20 bg-violet-400/[0.04] p-3">
              <div className="flex items-center justify-between gap-2"><p className="text-[10px] font-black uppercase tracking-[0.12em] text-violet-200">Pedido vinculado</p><span className="text-[10px] font-bold text-slate-500">Sincronização automática</span></div>

              {current && <div className="mt-2 grid grid-cols-2 gap-2 rounded-lg border border-white/8 bg-black/20 p-2 text-[10px]">
                <div><p className="font-semibold text-slate-500">Pedido</p><p className="mt-0.5 font-black text-white">#{currentOrder?.orderNumber ?? current.registrationId}{current.subOrderIndex > 0 ? ` · item ${current.subOrderIndex + 1}` : ""}</p></div>
                <div><p className="font-semibold text-slate-500">Status do pedido</p><p className="mt-0.5 font-black text-emerald-200">{statusLabel(currentOrder?.latestStatus)}</p></div>
                <div><p className="font-semibold text-slate-500">Produto</p><p className="mt-0.5 truncate font-bold text-slate-200" title={currentOrder?.serviceName || ""}>{currentOrder?.serviceName || "Não informado"}</p></div>
                <div><p className="font-semibold text-slate-500">Opção</p><p className="mt-0.5 truncate font-bold text-slate-200" title={currentOrder?.serviceOption || ""}>{currentOrder?.serviceOption || "Não informada"}</p></div>
              </div>}

              <input value={search} onChange={event => setSearch(event.target.value)} placeholder="Buscar pedido, cliente, telefone ou produto" className="mt-2 h-9 w-full rounded-lg border border-white/10 bg-black/20 px-2 text-xs font-bold text-slate-100 outline-none placeholder:text-slate-600" />
              <select value={currentKey} disabled={setLink.isPending || linksQuery.isLoading || ordersQuery.isLoading} onChange={event => { void update(event.target.value); }} className="mt-2 h-9 w-full rounded-lg border border-white/10 bg-black/20 px-2 text-xs font-bold text-slate-100 disabled:opacity-50">
                <option value="">Sem pedido vinculado</option>
                {selectableOrders.map(order => {
                  const subOrderIndex = order.subOrderIndex ?? 0;
                  const key = keyFor(order.id, subOrderIndex);
                  const owner = ownerByOrder.get(key);
                  const unavailable = owner !== undefined && owner !== instanceId;
                  const detail = [order.serviceName, order.serviceOption].filter(Boolean).join(" · ");
                  return <option key={key} value={key} disabled={unavailable}>#{order.orderNumber ?? order.id} · {order.customerName || "Cliente"}{subOrderIndex > 0 ? ` · item ${subOrderIndex + 1}` : ""}{detail ? ` · ${detail}` : ""}{unavailable ? " · já vinculado" : ""}</option>;
                })}
              </select>
              <p className="mt-2 text-[10px] leading-4 text-slate-500">O H2ADS apenas lê os dados do pedido. Alterar o estado da instância não altera o status do pedido.</p>
            </div>;
          }
          '''
          Path('client/src/components/H2AdsOrderLinkControl.tsx').write_text(component, encoding='utf-8')

          h2ads = Path('server/h2ads.ts')
          text = h2ads.read_text(encoding='utf-8')
          text = text.replace('import { and, asc, desc, eq, gt, isNull } from "drizzle-orm";', 'import { and, asc, desc, eq, gt, isNull, sql } from "drizzle-orm";', 1)
          cleanup_marker = '    await tx.delete(h2AdsInstanceNetworkProfiles).where(eq(h2AdsInstanceNetworkProfiles.instanceId, id));\n    const deleted = await tx.delete(h2AdsInstances).where(eq(h2AdsInstances.id, id));'
          cleanup_replacement = '    await tx.delete(h2AdsInstanceNetworkProfiles).where(eq(h2AdsInstanceNetworkProfiles.instanceId, id));\n    await tx.execute(sql`DELETE FROM h2ads_order_links WHERE instanceId = ${id}`);\n    const deleted = await tx.delete(h2AdsInstances).where(eq(h2AdsInstances.id, id));'
          if cleanup_marker not in text:
              raise SystemExit('H2Ads delete cleanup marker not found')
          text = text.replace(cleanup_marker, cleanup_replacement, 1)
          h2ads.write_text(text, encoding='utf-8')

          wiring = r'''import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const read = (path: string) => readFileSync(path, "utf8");

          describe("H2 Ads order link wiring", () => {
            it("mantém a persistência isolada em tabela h2ads própria", () => {
              const migration = read("drizzle/0143_h2ads_order_links.sql");
              expect(migration).toContain("CREATE TABLE IF NOT EXISTS `h2ads_order_links`");
              expect(migration).not.toMatch(/\b(DROP|TRUNCATE|ALTER)\b/i);
            });

            it("não cria caminho para alterar status do pedido pelo H2ADS", () => {
              const router = read("server/h2adsOrderLinkRouter.ts");
              expect(router).not.toContain("updateLastOrderStatus");
              expect(router).not.toContain("addOrderStatus");
            });

            it("sincroniza visualmente status e produto sem mexer no fluxo da instância", () => {
              const component = read("client/src/components/H2AdsOrderLinkControl.tsx");
              const page = read("client/src/pages/H2Ads.tsx");
              expect(component).toContain("refetchInterval: 15_000");
              expect(component).toContain("Status do pedido");
              expect(component).toContain("Produto");
              expect(component).toContain("Opção");
              expect(component).toContain("Buscar pedido, cliente, telefone ou produto");
              expect(page).toContain("<H2AdsOrderLinkControl instanceId={instance.id} />");
            });

            it("remove o vínculo ao excluir a instância", () => {
              const service = read("server/h2ads.ts");
              expect(service).toContain("DELETE FROM h2ads_order_links WHERE instanceId = ${id}");
            });
          });
          '''
          Path('server/h2adsOrderLinkWiring.test.ts').write_text(wiring, encoding='utf-8')
          PY

      - name: Verify exact file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
            'client/src/components/H2AdsOrderLinkControl.tsx',
            'client/src/pages/H2Ads.tsx',
            'drizzle/0143_h2ads_order_links.sql',
            'package.json',
            'scripts/apply-h2ads-order-link-migration.ts',
            'scripts/render-start.sh',
            'server/h2ads.ts',
            'server/h2adsOrderLink.test.ts',
            'server/h2adsOrderLink.ts',
            'server/h2adsOrderLinkRouter.ts',
            'server/h2adsOrderLinkWiring.test.ts',
            'server/routers/h2ads.ts',
          }
          actual = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          unexpected = actual - expected
          missing = expected - actual
          print('Changed files:', *sorted(actual), sep='\n- ')
          if unexpected:
              raise SystemExit('Unexpected changed files: ' + ', '.join(sorted(unexpected)))
          if missing:
              raise SystemExit('Expected files not changed: ' + ', '.join(sorted(missing)))
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused and H2ADS regression tests
        run: pnpm vitest run server/h2adsOrderLink.test.ts server/h2adsOrderLinkWiring.test.ts server/h2adsRouter.test.ts server/h2adsSchemaMigration.test.ts server/h2adsIsolation.test.ts

      - name: TypeScript regression check for changed files
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          code=$?
          set -e
          cat /tmp/tsc.log
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if grep -E '^(client/src/components/H2AdsOrderLinkControl\.tsx|client/src/pages/H2Ads\.tsx|server/h2ads\.ts|server/h2adsOrderLink\.ts|server/h2adsOrderLinkRouter\.ts|server/routers/h2ads\.ts|scripts/apply-h2ads-order-link-migration\.ts)' /tmp/tsc.log; then
            echo "New TypeScript regression found in H2ADS order-link files."
            exit 1
          fi
          echo "Global TypeScript baseline still has unrelated pre-existing errors; no error belongs to this H2ADS change."

      - name: Build production bundle
        run: pnpm build

      - name: Verify no order mutation path was introduced
        shell: bash
        run: |
          ! grep -E 'updateLastOrderStatus|addOrderStatus' server/h2adsOrderLink.ts server/h2adsOrderLinkRouter.ts
          grep -q 'h2ads_order_links' drizzle/0143_h2ads_order_links.sql
          grep -q 'db:migrate:h2ads-order-links' scripts/render-start.sh

      - name: Commit only validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/h2ads-order-instance-link-v2.yml .github/workflows/h2ads-order-instance-link-v3.yml
          git add -A
          git commit -m "feat(h2ads): sincronizar pedido com instancia sem alterar fluxo"
          git push origin HEAD:feat/h2ads-order-instance-link-v2-2026-08-30
