name: Profile Production Port

on:
  push:
    branches:
      - fix/profile-producao-atual
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-producao-atual
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Apply profile patch on current production
        run: |
          node scripts/profile-pr38-patch.mjs
          node scripts/profile-pr38-hardening.mjs
          node scripts/profile-pr38-types-fix.mjs
          node scripts/profile-pr38-final-audit.mjs
          node scripts/profile-pr38-registration-address.mjs
          node scripts/profile-pr38-online-registration.mjs
      - run: git diff --check
      - run: pnpm install --no-frozen-lockfile
      - name: Profile tests
        run: pnpm exec vitest run server/customerProfile.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated production port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(profile): port centralized profile to production branch [skip ci]"
          git push origin HEAD:fix/profile-producao-atual
