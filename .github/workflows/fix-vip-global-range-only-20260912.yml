name: Fix VIP Global Range Only

on:
  push:
    branches:
      - fix/vip-global-faixa-unica-2026-09-12
    paths:
      - .github/workflows/fix-vip-global-range-only-20260912.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vip-global-faixa-unica-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply global-range-only fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          router = Path('server/routers/vipInstallments.ts')
          text = router.read_text(encoding='utf-8')

          old = '''  const customerMax = effectiveMaxInstallments(config, permission);\n  const productMax = productRule?.maxInstallments == null ? null : Number(productRule.maxInstallments);\n  const maxInstallments = Math.max(config.minInstallments, Math.min(customerMax, productMax ?? customerMax));\n  const caps = [\n    { source: "global" as const, value: config.maxInstallments },\n    ...(permission.maxInstallments == null ? [] : [{ source: "customer" as const, value: Number(permission.maxInstallments) }]),\n    ...(productMax == null ? [] : [{ source: "product" as const, value: productMax }]),\n  ];\n  const limiting = caps.reduce((best, current) => current.value < best.value ? current : best);'''
          new = '''  const maxInstallments = config.maxInstallments;'''
          text = replace_once(text, old, new, 'eligibility max calculation')

          old = '''      maxInstallments,\n      globalMaxInstallments: config.maxInstallments,\n      customerMaxInstallments: permission.maxInstallments,\n      productMaxInstallments: productMax,\n      limitingSource: limiting.source,'''
          new = '''      maxInstallments,\n      globalMaxInstallments: config.maxInstallments,\n      customerMaxInstallments: null,\n      productMaxInstallments: null,\n      limitingSource: "global" as const,'''
          text = replace_once(text, old, new, 'eligibility effective rules')

          old = '''function effectiveMaxInstallments(config: VipInstallmentConfig, permission: Awaited<ReturnType<typeof permissionForCustomer>>) {\n  const customerMax = permission.maxInstallments == null ? config.maxInstallments : permission.maxInstallments;\n  return Math.max(config.minInstallments, Math.min(config.maxInstallments, customerMax));\n}\n\n'''
          text = replace_once(text, old, '', 'remove effective max helper')

          old = '''  const customerMax = effectiveMaxInstallments(eligibility.config, eligibility.permission);\n  const maxInstallments = Math.min(customerMax, productRule.maxInstallments ?? customerMax);\n  if (maxInstallments < eligibility.config.minInstallments) {\n    throw new TRPCError({ code: "FORBIDDEN", message: "Este produto não possui uma quantidade de parcelas compatível com as regras atuais." });\n  }\n  if (input.installmentCount < eligibility.config.minInstallments || input.installmentCount > maxInstallments) {\n    throw new TRPCError({ code: "BAD_REQUEST", message: `Escolha entre ${eligibility.config.minInstallments} e ${maxInstallments} parcelas.` });\n  }'''
          new = '''  const maxInstallments = eligibility.config.maxInstallments;\n  if (input.installmentCount < eligibility.config.minInstallments || input.installmentCount > maxInstallments) {\n    throw new TRPCError({ code: "BAD_REQUEST", message: `Escolha entre ${eligibility.config.minInstallments} e ${maxInstallments} parcelas.` });\n  }'''
          text = replace_once(text, old, new, 'checkout global range')

          old = '''          maxInstallments: input.maxInstallments ?? null,'''
          new = '''          maxInstallments: null,'''
          text = replace_once(text, old, new, 'product max ignored')

          old = '''          (${input.customerId}, ${input.enabled ? 1 : 0}, ${input.maxInstallments ?? null}, ${input.interestBps ?? null}, ${input.creditLimitCents ?? null},'''
          new = '''          (${input.customerId}, ${input.enabled ? 1 : 0}, ${null}, ${input.interestBps ?? null}, ${input.creditLimitCents ?? null},'''
          text = replace_once(text, old, new, 'customer max ignored')
          router.write_text(text, encoding='utf-8')

          checkout = Path('client/src/components/VipInstallmentCheckoutBox.tsx')
          text = checkout.read_text(encoding='utf-8')
          old = '''  const globalMax = Number(effectiveRules?.globalMaxInstallments ?? config?.maxInstallments ?? effectiveMax);\n  const limitSourceLabel = effectiveRules?.limitingSource === "customer" ? "CLIENTE" : effectiveRules?.limitingSource === "product" ? "PRODUTO" : "GLOBAL";'''
          new = '''  const globalMax = Number(effectiveRules?.globalMaxInstallments ?? config?.maxInstallments ?? effectiveMax);'''
          text = replace_once(text, old, new, 'checkout source label')

          old = '''          {effectiveRules && <div className="rounded-xl border border-cyan-400/20 bg-cyan-500/[0.06] p-3 text-[11px] leading-relaxed text-slate-300"><p><strong className="text-cyan-200">Faixa global:</strong> {minCount}x a {globalMax}x. <strong className="text-cyan-200">Limite aplicado:</strong> até {effectiveMax}x ({limitSourceLabel}).</p>{effectiveMax === minCount && globalMax > minCount ? <p className="mt-1 text-amber-200">Por isso aparece somente {minCount}x. Para liberar mais parcelas, remova/reduza o limite específico em Cliente ou Produto.</p> : null}</div>}'''
          new = '''          {effectiveRules && <div className="rounded-xl border border-cyan-400/20 bg-cyan-500/[0.06] p-3 text-[11px] leading-relaxed text-slate-300"><p><strong className="text-cyan-200">Parcelas permitidas:</strong> {minCount}x até {globalMax}x. A quantidade é definida somente na configuração GLOBAL.</p></div>}'''
          text = replace_once(text, old, new, 'checkout explanation')
          checkout.write_text(text, encoding='utf-8')

          admin = Path('client/src/components/AdminVipInstallmentsPanel.tsx')
          text = admin.read_text(encoding='utf-8')
          old = '''        <div className="rounded-2xl border border-amber-400/25 bg-amber-500/[0.07] p-4 text-xs leading-relaxed text-slate-300"><p className="font-black uppercase text-amber-200">Qual configuração vale?</p><p className="mt-2"><strong>Parcelas:</strong> o Global define a faixa base. Produto e Cliente podem limitar o máximo. Vale sempre o <strong>menor máximo</strong> entre os três. Campo vazio = herdar, sem criar limite próprio.</p><p className="mt-1"><strong>Juros:</strong> Cliente específico tem prioridade; se estiver vazio, usa Produto; se Produto estiver vazio, usa Global.</p><p className="mt-1"><strong>Periodicidade:</strong> qualquer bloqueio no Global, Produto ou Cliente bloqueia aquela opção.</p><p className="mt-2 text-amber-100">Exemplo: Global 5–20x, Produto até 12x e Cliente até 8x → cliente verá 5x até 8x.</p></div>'''
          new = '''        <div className="rounded-2xl border border-amber-400/25 bg-amber-500/[0.07] p-4 text-xs leading-relaxed text-slate-300"><p className="font-black uppercase text-amber-200">Qual configuração vale?</p><p className="mt-2"><strong>Quantidade de parcelas:</strong> somente o GLOBAL define mínimo e máximo. Exemplo: Global 5–20x = todo cliente liberado verá 5x até 20x.</p><p className="mt-1"><strong>Cliente:</strong> libera/bloqueia o Parcelamento VIP, define limite de crédito e pode ter juros específicos.</p><p className="mt-1"><strong>Produto:</strong> libera/bloqueia o produto e pode ter juros específicos.</p><p className="mt-1"><strong>Juros:</strong> Cliente específico → Produto → Global.</p><p className="mt-1"><strong>Periodicidade:</strong> qualquer bloqueio no Global, Produto ou Cliente bloqueia aquela opção.</p></div>'''
          text = replace_once(text, old, new, 'admin rules explanation')

          old = '''          <label className="text-[11px] font-black uppercase text-slate-300">Máximo do cliente<input type="number" min={2} max={120} value={permissionForm.maxInstallments} onChange={(event) => setPermissionForm((value) => ({ ...value, maxInstallments: event.target.value }))} placeholder={`Vazio = herdar até ${config.maxInstallments}x`} className={inputClass} /><span className="mt-1 block normal-case font-medium text-slate-500">Se preencher um número menor, ele reduz o máximo disponível para este cliente.</span></label>'''
          new = '''          <div className="rounded-xl border border-white/10 bg-black/20 p-3 text-xs text-slate-400"><span className="font-black uppercase text-slate-300">Parcelas do cliente</span><p className="mt-1">Usa sempre a faixa GLOBAL: {config.minInstallments}x até {config.maxInstallments}x.</p></div>'''
          text = replace_once(text, old, new, 'remove customer max field')

          old = '''    const maxInstallments = permissionForm.maxInstallments.trim() ? Number(permissionForm.maxInstallments) : null;\n    const interestRaw = permissionForm.interestPercent.trim() ? Number(permissionForm.interestPercent.replace(",", ".")) : null;\n    if (maxInstallments != null && (!Number.isInteger(maxInstallments) || maxInstallments < 2 || maxInstallments > 120)) {\n      toast.error("Máximo de parcelas do cliente inválido.");\n      return;\n    }'''
          new = '''    const interestRaw = permissionForm.interestPercent.trim() ? Number(permissionForm.interestPercent.replace(",", ".")) : null;'''
          text = replace_once(text, old, new, 'remove customer max validation')

          old = '''      maxInstallments,'''
          new = '''      maxInstallments: null,'''
          text = replace_once(text, old, new, 'customer save null max')
          admin.write_text(text, encoding='utf-8')

          product = Path('client/src/components/AdminVipInstallmentProductsPanel.tsx')
          text = product.read_text(encoding='utf-8')
          old = '''    const maxInstallments = form.maxInstallments.trim() ? Number(form.maxInstallments) : null;\n    const interest = form.interestPercent.trim() ? Number(form.interestPercent.replace(",", ".")) : null;'''
          new = '''    const interest = form.interestPercent.trim() ? Number(form.interestPercent.replace(",", ".")) : null;'''
          text = replace_once(text, old, new, 'remove product max parsing')

          old = '''    if (maxInstallments != null && (!Number.isInteger(maxInstallments) || maxInstallments < 2 || maxInstallments > 120)) {\n      toast.error("Máximo de parcelas inválido.");\n      return;\n    }\n'''
          text = replace_once(text, old, '', 'remove product max validation')

          old = '''      maxInstallments,'''
          new = '''      maxInstallments: null,'''
          text = replace_once(text, old, new, 'product save null max')

          old = '''              <p className="mt-1 text-[11px] text-slate-500">ID {row.productId}{row.maxInstallments ? ` • até ${row.maxInstallments}x` : " • parcelas herdadas"}{row.interestBps != null ? ` • ${Number(row.interestBps) / 100}%` : " • juros herdados"}</p>'''
          new = '''              <p className="mt-1 text-[11px] text-slate-500">ID {row.productId} • parcelas pela regra GLOBAL{row.interestBps != null ? ` • ${Number(row.interestBps) / 100}%` : " • juros herdados"}</p>'''
          text = replace_once(text, old, new, 'product list text')

          old = '''              <label className="text-[11px] font-black uppercase text-slate-300">Máximo de parcelas<input type="number" min={2} max={120} value={form.maxInstallments} onChange={(event) => setForm((value) => ({ ...value, maxInstallments: event.target.value }))} placeholder="Vazio = herdar; preenchido = limitar" className={inputClass} /></label>'''
          new = '''              <div className="rounded-xl border border-white/10 bg-black/20 p-3 text-xs text-slate-400"><span className="font-black uppercase text-slate-300">Quantidade de parcelas</span><p className="mt-1">Definida somente na configuração GLOBAL.</p></div>'''
          text = replace_once(text, old, new, 'remove product max field')

          old = '''                Ativar este produto não libera ninguém sozinho. Parcelas usam o menor máximo entre Global, Produto e Cliente. Juros específicos do Cliente têm prioridade sobre Produto; Produto tem prioridade sobre Global. Qualquer bloqueio de periodicidade prevalece.'''
          new = '''                Ativar este produto não libera ninguém sozinho. A quantidade de parcelas vem somente do GLOBAL. Juros específicos do Cliente têm prioridade sobre Produto; Produto tem prioridade sobre Global. Qualquer bloqueio de periodicidade prevalece.'''
          text = replace_once(text, old, new, 'product explanation')
          product.write_text(text, encoding='utf-8')
          PY
      - name: Assert global-only installment range
        shell: bash
        run: |
          grep -n "const maxInstallments = eligibility.config.maxInstallments" server/routers/vipInstallments.ts
          grep -n "quantidade é definida somente na configuração GLOBAL" client/src/components/VipInstallmentCheckoutBox.tsx
          if grep -n "menor máximo" client/src/components/AdminVipInstallmentsPanel.tsx client/src/components/AdminVipInstallmentProductsPanel.tsx; then exit 1; fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused VIP tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts shared/vipCheckoutPricing.test.ts shared/vipInstallments.test.ts
      - name: Check VIP TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(server/routers/vipInstallments\.ts|client/src/components/VipInstallmentCheckoutBox\.tsx|client/src/components/AdminVipInstallmentsPanel\.tsx|client/src/components/AdminVipInstallmentProductsPanel\.tsx)" /tmp/tsc.log > /tmp/vip-errors.log || true
          if [ -s /tmp/vip-errors.log ]; then cat /tmp/vip-errors.log; exit 1; fi
          echo "No new VIP TypeScript errors."
      - name: Check diff
        run: git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "h2-vip-fix"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-vip-global-range-only-20260912.yml
          git add server/routers/vipInstallments.ts client/src/components/VipInstallmentCheckoutBox.tsx client/src/components/AdminVipInstallmentsPanel.tsx client/src/components/AdminVipInstallmentProductsPanel.tsx
          git commit -m "fix(vip): use global installment range only"
          git push origin HEAD:fix/vip-global-faixa-unica-2026-09-12
