name: VIP installments safe wire

on:
  push:
    branches:
      - feat/vip-parcelamento-seguro-2026-09-12

permissions:
  contents: write

jobs:
  wire-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[vip-wiring]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Wire isolated VIP installments router
        shell: python
        run: |
          from pathlib import Path

          path = Path('server/routers.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import { vipMembershipsRouter, getVipMembershipSnapshotMap, isVipMemberByPhone } from "./routers/vipMemberships";'
          import_line = 'import { vipInstallmentsRouter } from "./routers/vipInstallments";'
          route_anchor = '  vipMemberships: vipMembershipsRouter,'
          route_line = '  vipInstallments: vipInstallmentsRouter,'

          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit(f'Import anchor count unexpected: {text.count(import_anchor)}')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          if route_line not in text:
              if text.count(route_anchor) != 1:
                  raise SystemExit(f'Route anchor count unexpected: {text.count(route_anchor)}')
              text = text.replace(route_anchor, route_anchor + '\n' + route_line, 1)

          if text.count(import_line) != 1 or text.count(route_line) != 1:
              raise SystemExit('VIP installment router wiring is not unique')

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run VIP calculation tests
        run: pnpm exec vitest run shared/vipInstallments.test.ts

      - name: TypeScript validation
        run: pnpm check

      - name: Commit router wiring only after validation
        shell: bash
        run: |
          if git diff --quiet -- server/routers.ts; then
            echo "Router already wired."
            exit 0
          fi
          git config user.name "h2-vip-safe-wire"
          git config user.email "actions@users.noreply.github.com"
          git add server/routers.ts
          git commit -m "feat(vip): wire installment router after validation [vip-wiring]"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
