name: Commission Panel Audit 2026-09-18

on:
  push:
    branches:
      - fix/commission-panel-audit-2026-09-18
    paths:
      - "server/commissionResolver.ts"
      - "server/commissionResolver.test.ts"
      - "server/routers.ts"
      - "drizzle/schema.ts"
      - "scripts/apply-referral-commission-attribution-migration.ts"
      - ".github/workflows/commission-panel-audit-20260918.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commission-panel-audit-2026-09-18
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commission resolver tests
        run: pnpm vitest run server/commissionResolver.test.ts
      - name: Production build
        run: pnpm build
      - name: Verify diff
        run: git diff --check
