name: Validate storefront card responsive layout
on:
  push:
    branches:
      - fix/storefront-cards-responsive-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated layout changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const home=fs.readFileSync('client/src/pages/Home.tsx','utf8');
          const card=fs.readFileSync('client/src/components/StorefrontProductCard.tsx','utf8');
          const css=fs.readFileSync('client/src/components/StorefrontProductCard.css','utf8');
          assert.match(home, /grid min-w-0 grid-cols-1 gap-3 sm:grid-cols-3/);
          assert.match(card, /import "\.\/StorefrontProductCard\.css"/);
          for(const part of ['__price-grid','__saving','__actions','__vip-prices','__model-grid','__selection-head']) {
            assert.ok(card.includes('storefront-product-card'+part),part+' missing in JSX');
            assert.ok(css.includes('.storefront-product-card'+part),part+' missing in CSS');
          }
          assert.match(css, /@container \(max-width: 480px\)/);
          assert.match(css, /container-type: inline-size/);
          console.log('Responsive card constraints OK');
          NODE
      - name: Build same patch chain used by Render
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const docker=fs.readFileSync('Dockerfile','utf8');
          const scripts=[...docker.matchAll(/&& node (scripts\/[^\s\\]+\.mjs)/g)].map(m=>m[1]);
          for(const script of scripts){
            const job=spawnSync('node',[script],{stdio:'inherit'});
            if(job.status!==0)process.exit(job.status||1);
          }
          console.log('Docker patch chain OK:',scripts.length);
          NODE
          pnpm build
