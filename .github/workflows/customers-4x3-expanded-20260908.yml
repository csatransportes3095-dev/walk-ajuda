name: Customers 4x3 expanded 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/customers-4x3-expanded-20260908.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Backup production
        run: git push origin HEAD:refs/heads/backup/pre-customers-4x3-expanded-20260908 || true

      - name: Apply 4x3 compact expanded layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/AdminCustomers.tsx')
          text = path.read_text(encoding='utf-8')

          # Mantem 4 cards por linha no desktop.
          grid_candidates = [
              '<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">',
              '<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">',
              '<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">',
          ]
          found = [candidate for candidate in grid_candidates if candidate in text]
          if len(found) != 1:
              raise SystemExit(f'ABORT: customer grid candidates found={len(found)}')
          text = text.replace(found[0], '<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">', 1)

          # Remove o botao de expandir e deixa dados/controles sempre visiveis.
          button_block = '''                  <button type="button" onClick={() => toggleCustomerDetails(c.id)} className="mt-2 w-full rounded-lg border border-white/10 bg-white/[0.04] px-2 py-1.5 text-[10px] font-bold text-cyan-100 transition hover:bg-cyan-500/10">
                    {expandedCustomerIds.has(c.id) ? 'Ocultar detalhes' : 'Ver dados e controles'}
                  </button>
'''
          if button_block in text:
              text = text.replace(button_block, '', 1)

          old_open = "{expandedCustomerIds.has(c.id) && <div className=\"mt-2 flex gap-0 border-t pt-2.5\" style={{ borderColor: 'rgba(255,255,255,0.07)' }}>"
          new_open = "{true && <div className=\"mt-1.5 flex gap-0 border-t pt-1.5\" style={{ borderColor: 'rgba(255,255,255,0.07)' }}>"
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif new_open not in text:
              raise SystemExit('ABORT: details wrapper not found')

          # Compacta os controles de rota para ajudar a manter 3 cards na vertical.
          replacements = [
              ('rounded-xl border border-slate-500/45 bg-gradient-to-r from-slate-700/20 to-slate-700/10 p-2.5', 'rounded-xl border border-slate-500/45 bg-gradient-to-r from-slate-700/20 to-slate-700/10 p-1.5'),
              ('mb-1.5 flex items-center justify-between gap-2', 'mb-1 flex items-center justify-between gap-1.5'),
              ('<div className="grid gap-1.5">', '<div className="grid gap-1">'),
              ('grid h-10 cursor-pointer grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-2 rounded-lg border px-2.5', 'grid h-7 cursor-pointer grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-1.5 rounded-lg border px-1.5'),
              ('mt-1.5 text-[9px] font-medium leading-tight text-cyan-200/75', 'mt-1 text-[8px] font-medium leading-tight text-cyan-200/75'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('OK: 4 cards per row, expanded controls, compact vertical layout.')
          PY

          git diff --check
          git diff -- client/src/pages/AdminCustomers.tsx

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminCustomers.tsx
          git commit -m "feat(customers): quatro por linha com controles expandidos e compactos"
          git fetch origin recovery/organizar-salvos-2026-08-24
          git rebase origin/recovery/organizar-salvos-2026-08-24
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
