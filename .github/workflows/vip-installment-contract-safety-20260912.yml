name: VIP Installment Contract Safety

on:
  push:
    branches:
      - feat/vip-parcelamento-seguro-2026-09-12
    paths:
      - .github/workflows/vip-installment-contract-safety-20260912.yml

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply contract safety patch
        run: python scripts/apply_vip_installment_contract_safety_20260912.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused installment tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts
      - name: Check new contract TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(server/vipInstallmentContractService\.ts|server/vipInstallmentEligibility\.ts|server/routers/vipInstallments\.ts|server/vipInstallmentPricing\.ts|server/vipInstallmentProductRules\.ts|shared/vipInstallments\.ts|shared/vipCheckoutPricing\.ts)" /tmp/tsc.log > /tmp/vip-contract-errors.log || true
          if [ -s /tmp/vip-contract-errors.log ]; then
            cat /tmp/vip-contract-errors.log
            exit 1
          fi
          echo "No new VIP contract TypeScript errors."
      - name: Commit only after validation
        shell: bash
        run: |
          git config user.name "h2-vip-guard"
          git config user.email "actions@users.noreply.github.com"
          git add server/vipInstallmentContractService.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(vip): make installment contract reservation idempotent"
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
