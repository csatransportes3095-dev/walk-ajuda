name: H2ADS Firefox Navigation Guard Patch

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - scripts/patch-h2ads-firefox-navigation-guard-20260903.py
      - .github/workflows/h2ads-firefox-navigation-guard-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply Firefox navigation guard patch
        run: python3 scripts/patch-h2ads-firefox-navigation-guard-20260903.py

      - name: Validate JavaScript syntax
        run: node --check workers/windows/browser-session.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit patched worker files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/windows/browser-session.mjs workers/windows/H2AdsWorker.ps1
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(h2ads): bloquear Google Sorry também no Firefox"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
