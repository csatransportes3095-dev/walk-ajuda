name: Ad Video Playback Fix

on:
  push:
    branches:
      - fix/ad-video-playback-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ad-video-playback-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Apply video proxy patch
        run: node scripts/apply-video-proxy-range-fix.mjs
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run targeted test
        run: pnpm vitest run server/publicVideoRange.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          rm scripts/apply-video-proxy-range-fix.mjs .github/workflows/ad-video-playback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/index.ts server/publicVideoRange.test.ts scripts/apply-video-proxy-range-fix.mjs .github/workflows/ad-video-playback-fix.yml
          git commit -m "fix(ads): transmitir video publico com suporte a range"
          git push origin HEAD:fix/ad-video-playback-20260901
