name: Public Video Stream Safety
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'server/_core/index.ts'
      - 'server/publicVideoStreamSafety.test.ts'
      - '.github/workflows/public-video-stream-safety.yml'
permissions:
  contents: read
jobs:
  verify-public-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/publicVideoStreamSafety.test.ts
      - run: pnpm build
