name: Repair Admin Loans Performance

on:
  push:
    paths:
      - '.github/workflows/repair-admin-loans-performance.yml'
      - 'scripts/repair-admin-loans-performance.cjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe performance fixes
        run: node scripts/repair-admin-loans-performance.cjs

      - name: Commit fixes and remove temporary repair files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/repair-admin-loans-performance.cjs .github/workflows/repair-admin-loans-performance.yml
          git add server/loans/h2Score.ts server/routers/loans.ts client/src/pages/AdminLoans.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: estabiliza painel ADM de empréstimos"
          git push origin HEAD:main
