name: H2ADS Firefox Security Patch

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - scripts/patch-h2ads-firefox-security-20260903.mjs
      - .github/workflows/h2ads-firefox-security-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Allow sequential exact replacements
        run: sed -i 's/count !== 1/count < 1/' scripts/patch-h2ads-firefox-security-20260903.mjs

      - name: Apply guarded patch
        run: node scripts/patch-h2ads-firefox-security-20260903.mjs

      - name: Commit patched H2ADS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/h2ads.ts server/h2adsWorkerRoute.ts workers/windows/H2AdsWorker.ps1 workers/windows/browser-session.mjs client/src/pages/H2Ads.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(h2ads): Firefox protegido e segurança reforçada no Chrome"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
