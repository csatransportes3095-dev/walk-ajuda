name: H2 AUTO - perguntas livres sem botoes
on:
  pull_request:
    paths:
      - "shared/h2AutoPersonalization.ts"
      - "client/src/pages/AdminH2Auto.tsx"
      - "server/h2-auto-free-questions.test.ts"
      - ".github/workflows/h2-auto-free-questions.yml"
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testar perguntas livres e integridade da autenticacao
        run: pnpm exec vitest run server/h2-auto-free-questions.test.ts server/h2-auto-personalization.test.ts server/h2-auto-orders-verified-customer-regression.test.ts
      - name: Compilar site e servidor
        run: pnpm run build
