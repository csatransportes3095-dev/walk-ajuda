name: Schedule slot return rules 2026-09-08

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/schedule-slot-rules-20260908.yml
      - scripts/apply_schedule_slot_rules_20260908.py
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Backup production
        run: git push origin HEAD:refs/heads/backup/pre-schedule-slot-rules-20260908 || true

      - name: Apply schedule rules
        run: |
          python scripts/apply_schedule_slot_rules_20260908.py
          git diff --check

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test schedule slot rules
        run: pnpm vitest run server/scheduleSlotReturnRules.test.ts

      - name: Build
        run: pnpm build

      - name: Commit production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts client/src/pages/AdminSchedule.tsx server/scheduleSlotReturnRules.test.ts
          git commit -m "fix(schedule): devolver horarios ao finalizar e reagendar" || exit 0
          git fetch origin recovery/organizar-salvos-2026-08-24
          git rebase origin/recovery/organizar-salvos-2026-08-24
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
