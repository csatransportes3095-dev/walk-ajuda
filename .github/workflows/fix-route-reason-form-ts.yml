name: Fix route reason form TypeScript

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/fix-route-reason-form-ts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Fix generated state typing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-route-reason-form.yml')
          s = p.read_text(encoding='utf-8')
          old = "const [reason, setReason] = useState(RESTRICTION_PRESETS[0].text);"
          new = "const [reason, setReason] = useState<string>(RESTRICTION_PRESETS[0].text);"
          if s.count(old) != 1:
              raise SystemExit(f'linha esperada nao encontrada exatamente uma vez: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -n 'useState<string>(RESTRICTION_PRESETS\[0\].text)' .github/workflows/patch-route-reason-form.yml

      - name: Remove helper workflow
        run: git rm .github/workflows/fix-route-reason-form-ts.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(acesso): corrigir tipagem do formulario de bloqueio"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
