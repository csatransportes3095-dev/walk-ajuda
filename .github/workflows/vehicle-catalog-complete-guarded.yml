name: Vehicle Catalog Complete Guarded

on:
  push:
    branches:
      - fix/vehicle-catalog-complete-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply product presets patch
        run: python3 scripts/apply-product-version-presets.py
      - name: Validate whitespace
        run: git diff --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/productVersionVehicleFlow.test.ts
      - run: pnpm build
      - name: Remove temporary machinery
        run: rm -f scripts/apply-product-version-presets.py scripts/apply-product-version-presets.mjs .github/workflows/vehicle-catalog-complete-guarded.yml
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminProducts.tsx shared/vehicleCatalog.ts scripts/rebuild-question-tree.mjs server/productVersionVehicleFlow.test.ts
          git add -u scripts/apply-product-version-presets.py scripts/apply-product-version-presets.mjs .github/workflows/vehicle-catalog-complete-guarded.yml
          git commit -m "fix(products): completar catalogo e adicionar tres versoes prontas"
          git push origin HEAD:fix/vehicle-catalog-complete-20260901
