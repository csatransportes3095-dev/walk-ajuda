name: Vehicle Catalog Complete Guarded

on:
  push:
    branches:
      - fix/vehicle-catalog-complete-20260901

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/productVersionVehicleFlow.test.ts
      - run: pnpm build
