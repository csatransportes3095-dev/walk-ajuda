name: Fix most chosen default 2026-09-07

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-most-chosen-default-20260907.yml

permissions:
  contents: write

jobs:
  patch-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Preserve production checkpoint
        run: git push origin HEAD:refs/heads/backup/pre-most-chosen-default-20260907 || true

      - name: Fix default selected model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/components/StorefrontProductCard.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const selectablePriceModels = priceModels.filter(model => !isVipOnlyLocked(model, isVipCustomer));
  const preferredModel = selectablePriceModels[Math.min(1, Math.max(0, selectablePriceModels.length - 1))] || selectablePriceModels[0] || null;
  const [priceModelId, setPriceModelId] = useState<number | null>(preferredModel?.id ?? null);'''
          new = '''  const selectablePriceModels = priceModels.filter(model => !isVipOnlyLocked(model, isVipCustomer));
  // A opção exibida como "MAIS ESCOLHIDA" é a segunda posição original do cadastro.
  // Ela deve continuar sendo a seleção padrão mesmo quando uma opção anterior é SOMENTE VIP.
  const mostChosenModel = priceModels[1] || null;
  const preferredModel = mostChosenModel && !isVipOnlyLocked(mostChosenModel, isVipCustomer)
    ? mostChosenModel
    : selectablePriceModels[0] || null;
  const [priceModelId, setPriceModelId] = useState<number | null>(preferredModel?.id ?? null);'''

          if old not in text:
              raise SystemExit('Trecho inicial de seleção não encontrado; produção não foi alterada.')
          text = text.replace(old, new, 1)

          old_effect = '''    if (!selectablePriceModels.some((model) => model.id === priceModelId)) {
      setPriceModelId(selectablePriceModels[Math.min(1, Math.max(0, selectablePriceModels.length - 1))]?.id ?? selectablePriceModels[0]?.id ?? null);
    }'''
          new_effect = '''    if (!selectablePriceModels.some((model) => model.id === priceModelId)) {
      const nextDefault = mostChosenModel && !isVipOnlyLocked(mostChosenModel, isVipCustomer)
        ? mostChosenModel
        : selectablePriceModels[0] || null;
      setPriceModelId(nextDefault?.id ?? null);
    }'''

          if old_effect not in text:
              raise SystemExit('Trecho de fallback de seleção não encontrado; produção não foi alterada.')
          text = text.replace(old_effect, new_effect, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Audit default selection
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('client/src/components/StorefrontProductCard.tsx', 'utf8');
          const required = [
            'const mostChosenModel = priceModels[1] || null;',
            'mostChosenModel && !isVipOnlyLocked(mostChosenModel, isVipCustomer)',
            'const nextDefault = mostChosenModel',
          ];
          const missing = required.filter((needle) => !text.includes(needle));
          if (missing.length) {
            console.error('Falha na auditoria:', missing);
            process.exit(1);
          }
          console.log('OK: a opção MAIS ESCOLHIDA é priorizada antes do filtro VIP.');
          NODE

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test VIP pricing rules
        run: pnpm vitest run server/vipPricing.test.ts

      - name: Build production
        run: pnpm build

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/StorefrontProductCard.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(storefront): abrir na opcao mais escolhida"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
