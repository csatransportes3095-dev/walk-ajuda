name: Fix category sync storefront 2026-09-07

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-most-chosen-default-20260907.yml

permissions:
  contents: write

jobs:
  patch-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Preserve production checkpoint
        run: git push origin HEAD:refs/heads/backup/pre-category-sync-storefront-20260907 || true

      - name: Apply category synchronization fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Patch target missing: {label}')
              return text.replace(old, new, 1)

          p = Path('client/src/pages/AdminProducts.tsx')
          s = p.read_text(encoding='utf-8')
          if 'useState, useRef, useCallback, useEffect' not in s:
              s = replace_once(s,
                  'import { useState, useRef, useCallback } from "react";',
                  'import { useState, useRef, useCallback, useEffect } from "react";',
                  'useEffect import')
          sync_anchor = "  const [vipHighlightText, setVipHighlightText] = useState(model.vipHighlightText || 'VIP');\n  const updateMut = trpc.optionPriceModels.update.useMutation({ onSuccess: onChanged });"
          sync_block = """  const [vipHighlightText, setVipHighlightText] = useState(model.vipHighlightText || 'VIP');

  useEffect(() => {
    setLabel(model.label);
    setPrincipalPrice(model.originalPrice?.trim() ? model.originalPrice : model.price);
    setPromotionalPrice(model.originalPrice?.trim() ? model.price : '');
    setPromoEndsAt(model.promoEndsAt ? new Date(model.promoEndsAt).toISOString().slice(0, 16) : '');
    setActive(model.isActive === 1);
    setVipAccessMode(model.vipAccessMode || 'all');
    setVipDiscountType(model.vipDiscountType || 'percentage');
    setVipDiscountValue(String(model.vipDiscountValue || ''));
    setVipHighlight(model.vipHighlight === 1);
    setVipHighlightText(model.vipHighlightText || 'VIP');
  }, [model.id, model.label, model.price, model.originalPrice, model.promoEndsAt, model.isActive, model.vipAccessMode, model.vipDiscountType, model.vipDiscountValue, model.vipHighlight, model.vipHighlightText]);

  const updateMut = trpc.optionPriceModels.update.useMutation({ onSuccess: onChanged });"""
          if 'setLabel(model.label);' not in s:
              s = replace_once(s, sync_anchor, sync_block, 'row server sync')

          old_refresh = "  const refresh = () => { utils.optionPriceModels.list.invalidate({ optionId }); utils.products.list.invalidate(); };"
          new_refresh = """  const refresh = () => {
    utils.optionPriceModels.list.invalidate({ optionId });
    utils.optionPriceModels.listActive.invalidate();
    utils.products.list.invalidate();
    utils.products.listActive.invalidate();
  };"""
          if 'utils.optionPriceModels.listActive.invalidate();' not in s:
              s = replace_once(s, old_refresh, new_refresh, 'public cache invalidation')
          p.write_text(s, encoding='utf-8')

          p = Path('client/src/pages/Home.tsx')
          s = p.read_text(encoding='utf-8')
          old = """  const { data: activeOptionPriceModels = [] } = trpc.optionPriceModels.listActive.useQuery(
    { optionIds },
    { enabled: optionIds.length > 0, staleTime: 30_000, refetchOnWindowFocus: true }
  );"""
          new = """  const { data: activeOptionPriceModels = [] } = trpc.optionPriceModels.listActive.useQuery(
    { optionIds },
    {
      enabled: optionIds.length > 0,
      staleTime: 0,
      refetchInterval: 10_000,
      refetchIntervalInBackground: false,
      refetchOnWindowFocus: true,
      refetchOnReconnect: true,
    }
  );"""
          if 'refetchInterval: 10_000' not in s:
              s = replace_once(s, old, new, 'storefront freshness')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Audit fix
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const admin = fs.readFileSync('client/src/pages/AdminProducts.tsx','utf8');
          const home = fs.readFileSync('client/src/pages/Home.tsx','utf8');
          const checks = [
            admin.includes('utils.optionPriceModels.listActive.invalidate()'),
            admin.includes('utils.products.listActive.invalidate()'),
            admin.includes('setLabel(model.label);'),
            home.includes('staleTime: 0'),
            home.includes('refetchInterval: 10_000'),
            home.includes('refetchOnReconnect: true'),
          ];
          if (checks.some(v => !v)) process.exit(1);
          console.log('6/6 category sync checks OK');
          NODE

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminProducts.tsx client/src/pages/Home.tsx
          git commit -m "fix(produtos): sincronizar categoria editada com cliente"
          git fetch origin recovery/organizar-salvos-2026-08-24
          git rebase origin/recovery/organizar-salvos-2026-08-24
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
