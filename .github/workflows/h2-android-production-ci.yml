name: H2 Android - PR producao

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/src/App.tsx"
      - "client/src/pages/AdminCodes.tsx"
      - "client/src/pages/AdminH2Android.tsx"
      - "server/routers.ts"
      - "server/routers/h2Android.ts"
      - "server/h2Android.integration.test.ts"
      - ".github/workflows/h2-android-production-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencies
        run: pnpm install --no-frozen-lockfile
      - name: H2 Android regression tests
        run: pnpm exec vitest run server/h2Android.integration.test.ts
      - name: Production build
        run: pnpm build
