          '''  const runProtectedAction = async (action: "buy" | "cart") => {\n    if (requiresPriceModelSelection && !selectedPriceModel) return;\n    if (selectedPriceModel && isVipOnlyLocked(selectedPriceModel, isVipCustomer)) return;''', 'storefront protected action')
          text = replace_once(text,
          '''                const modelPromotion = promotionByModel.get(model.id);\n                return (''',
          '''                const modelPromotion = promotionByModel.get(model.id);\n                const modelLocked = isVipOnlyLocked(model, isVipCustomer);\n                const modelVipMode = normalizeVipAccessMode(model.vipAccessMode);\n                const modelVipHighlighted = isVipHighlighted(model);\n                return (''', 'storefront model VIP variables')
          text = text.replace(
          '''<button key={model.id} type="button" aria-pressed={isSelected} onClick={() => handlePriceModelSelect(model.id)} className={`relative min-h-[150px] overflow-visible rounded-[18px] border bg-gradient-to-b px-2 pb-3 pt-7 text-center transition-all ${palette.border} ${palette.bg} ${palette.shadow} ${isSelected ? `-translate-y-1 ring-2 ${palette.ring}` : "hover:-translate-y-0.5"} ${modelPromotion?.active ? "outline outline-1 outline-amber-300/60" : ""}`}>''',
          '''<button key={model.id} type="button" aria-pressed={isSelected} disabled={modelLocked} onClick={() => { if (!modelLocked) handlePriceModelSelect(model.id); }} className={`relative min-h-[150px] overflow-visible rounded-[18px] border bg-gradient-to-b px-2 pb-3 pt-7 text-center transition-all ${palette.border} ${palette.bg} ${palette.shadow} ${isSelected ? `-translate-y-1 ring-2 ${palette.ring}` : "hover:-translate-y-0.5"} ${modelPromotion?.active ? "outline outline-1 outline-amber-300/60" : ""} ${modelVipHighlighted ? "ring-1 ring-amber-300/70" : ""} ${modelLocked ? "cursor-not-allowed opacity-55 saturate-50" : ""}`}>\n                    {modelVipMode !== 'all' && <span className={`absolute -right-1 -top-2 z-20 rounded-full border px-2 py-1 text-[8px] font-black uppercase shadow-lg ${modelLocked ? 'border-rose-300/70 bg-rose-950 text-rose-200' : 'border-amber-300/70 bg-amber-400 text-amber-950'}`}>{modelLocked ? '🔒 SOMENTE VIP' : `👑 ${model.vipHighlightText || 'VIP'}`}</span>}''',
          1)
          if 'SOMENTE VIP' not in text:
              raise SystemExit('Falha ao inserir badge VIP na vitrine')
          text = replace_once(text,
          '''            {discount > 0 && <p className="mt-2 inline-flex rounded-full border border-emerald-400/45 bg-emerald-500/10 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-emerald-300 shadow-[0_0_14px_rgba(16,185,129,.16)]">Economize {discount}%</p>}''',
          '''            {discount > 0 && <p className="mt-2 inline-flex rounded-full border border-emerald-400/45 bg-emerald-500/10 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-emerald-300 shadow-[0_0_14px_rgba(16,185,129,.16)]">Economize {discount}%</p>}\n            {selectedPriceModel && normalizeVipAccessMode(selectedPriceModel.vipAccessMode) !== 'all' && <p className="ml-2 mt-2 inline-flex rounded-full border border-amber-300/45 bg-amber-400/10 px-2.5 py-1 text-[10px] font-black uppercase tracking-wide text-amber-200">{isVipCustomer ? `👑 ${vipBenefitText(selectedPriceModel) || 'ACESSO VIP'}` : '👑 BENEFÍCIO VIP DISPONÍVEL'}</p>}''', 'storefront VIP choice badge')
          write(path, text)

          # ------------------------------------------------------------------
          # Home checkout: VIP price + model id in server request
          # ------------------------------------------------------------------
          path = 'client/src/pages/Home.tsx'
          text = read(path)
          text = replace_once(text,
          '''import { getVehicleModels, getVehicleQuestionKind, VEHICLE_BRANDS, VEHICLE_COLORS, VEHICLE_YEARS } from "@shared/vehicleCatalog";''',
          '''import { getVehicleModels, getVehicleQuestionKind, VEHICLE_BRANDS, VEHICLE_COLORS, VEHICLE_YEARS } from "@shared/vehicleCatalog";\nimport { applyVipBenefitToPrice } from "@shared/vipPricing";''', 'home VIP import')
          text = replace_once(text,
          '''type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; selectorLabel?: string | null; };''',
          '''type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; selectorLabel?: string | null; vipAccessMode?: 'all' | 'benefit' | 'vip_only'; vipDiscountType?: 'percentage' | 'fixed'; vipDiscountValue?: number; vipHighlight?: number; vipHighlightText?: string | null; };''', 'home model VIP type')
          text = replace_once(text,
          '''  // Obter valor atual (usa tier se selecionado, caso contrário usa preço da opção)\n  const getCurrentServiceValue = (): string => {\n    if (selectedPriceModel) return selectedPriceModel.price;''',
          '''  const isVipCustomer = typeof window !== 'undefined' && localStorage.getItem('walk_access_type') === 'vip';\n  const getPriceModelServiceValue = (model: OptionPriceModel | null | undefined): string => model ? applyVipBenefitToPrice(model.price, model, isVipCustomer) : '';\n\n  // Obter valor atual (usa benefício VIP do Modelo/Categoria quando configurado)\n  const getCurrentServiceValue = (): string => {\n    if (selectedPriceModel) return getPriceModelServiceValue(selectedPriceModel);''', 'home current VIP price')
          text = text.replace('item.priceModel?.price || item.option?.price', 'getPriceModelServiceValue(item.priceModel) || item.option?.price')
          text = text.replace('selectedPriceModel?.price || selectedTier?.price || selectedOption?.price', 'getPriceModelServiceValue(selectedPriceModel) || selectedTier?.price || selectedOption?.price')
          text = text.replace('selectedPriceModel?.price || selectedTier?.price || selectedOption?.price;', 'getPriceModelServiceValue(selectedPriceModel) || selectedTier?.price || selectedOption?.price;')
          text = replace_once(text,
          '''              price: itemRawPrice,\n              thirdPartyName:''',
          '''              price: itemRawPrice,\n              priceModelId: item.priceModel?.id || undefined,\n              thirdPartyName:''', 'home cart priceModelId')
          # single checkout object: add id after calculated price expression, before thirdPartyName
          marker = '''        thirdPartyName: thirdPartyName.trim() || undefined,'''
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Trecho single thirdPartyName nao encontrado')
          before = text[:pos]
          if 'priceModelId: selectedPriceModel?.id' not in before[-900:]:
              text = text[:pos] + '''        priceModelId: selectedPriceModel?.id || undefined,\n''' + text[pos:]
          write(path, text)

          # ------------------------------------------------------------------
          # Bot: same rules, visual labels, blocked VIP-only, VIP price, model id
          # ------------------------------------------------------------------
          path = 'client/src/components/ColombiaBot.tsx'
          text = read(path)
          text = replace_once(text,
          '''import { getVehicleModels, getVehicleQuestionKind, VEHICLE_BRANDS, VEHICLE_COLORS, VEHICLE_YEARS } from "@shared/vehicleCatalog";''',
          '''import { getVehicleModels, getVehicleQuestionKind, VEHICLE_BRANDS, VEHICLE_COLORS, VEHICLE_YEARS } from "@shared/vehicleCatalog";\nimport { applyVipBenefitToPrice, isVipOnlyLocked, normalizeVipAccessMode, vipBenefitText } from "@shared/vipPricing";''', 'bot VIP import')
          text = replace_once(text,
          '''type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice?: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; };''',
          '''type OptionPriceModel = { id: number; optionId: number; label: string; price: string; originalPrice?: string | null; promoEndsAt?: number | null; sortOrder: number; isActive: number; vipAccessMode?: 'all' | 'benefit' | 'vip_only'; vipDiscountType?: 'percentage' | 'fixed'; vipDiscountValue?: number; vipHighlight?: number; vipHighlightText?: string | null; };''', 'bot model VIP type')
          text = replace_once(text,
          '''  const clientPhone = typeof window !== 'undefined' ? localStorage.getItem('walk_client_phone') || '' : '';''',
          '''  const clientPhone = typeof window !== 'undefined' ? localStorage.getItem('walk_client_phone') || '' : '';\n  const isVipCustomer = typeof window !== 'undefined' && localStorage.getItem('walk_access_type') === 'vip';\n  const getModelPrice = (model: OptionPriceModel | null | undefined) => model ? applyVipBenefitToPrice(model.price, model, isVipCustomer) : '';''', 'bot VIP state')

          old_fn = '''  const startOptionPricing = (product: Product, option: ProductOption) => {\n    const models = option.priceModels || [];\n    if (models.length === 0) {\n      flowState.current.priceModel = null;\n      setTimeout(() => askQuestions(product, option, {}), 200);\n      return;\n    }\n    if (models.length === 1) {\n      flowState.current.priceModel = models[0];\n      saveBotProgress('questions', 'dados');\n      setTimeout(() => askQuestions(product, option, {}), 200);\n      return;\n    }\n    saveSnapshot();\n    const msgId = uid();\n    callbacks.current[msgId] = (answer: string) => {\n      markAnswered(msgId);\n      addMsgs({ type: 'user', id: uid(), text: answer });\n      const model = models.find(item => `${item.label} — R$ ${item.price}` === answer);\n      if (!model) return;\n      flowState.current.priceModel = model;\n      saveBotProgress('questions', 'dados');\n      setTimeout(() => askQuestions(product, option, {}), 250);\n    };\n    addMsgs(\n      { type: 'bot', id: uid(), text: 'Qual modelo / categoria de preço você deseja?' },\n      { type: 'options', id: msgId, options: models.map(model => `${model.label} — R$ ${model.price}`), answered: false }\n    );\n  };'''
          new_fn = '''  const startOptionPricing = (product: Product, option: ProductOption) => {\n    const models = option.priceModels || [];\n    if (models.length === 0) {\n      flowState.current.priceModel = null;\n      setTimeout(() => askQuestions(product, option, {}), 200);\n      return;\n    }\n    const displayLabel = (model: OptionPriceModel) => {\n      const locked = isVipOnlyLocked(model, isVipCustomer);\n      const mode = normalizeVipAccessMode(model.vipAccessMode);\n      const prefix = locked ? '🔒 SOMENTE VIP • ' : (mode !== 'all' ? '👑 VIP • ' : '');\n      const benefit = isVipCustomer ? vipBenefitText(model) : '';\n      return `${prefix}${model.label} — ${getModelPrice(model)}${benefit ? ` • ${benefit}` : ''}`;\n    };\n    if (models.length === 1 && !isVipOnlyLocked(models[0], isVipCustomer)) {\n      flowState.current.priceModel = models[0];\n      saveBotProgress('questions', 'dados');\n      setTimeout(() => askQuestions(product, option, {}), 200);\n      return;\n    }\n    if (models.length === 1 && isVipOnlyLocked(models[0], isVipCustomer)) {\n      addMsgs({ type: 'bot', id: uid(), text: '🔒 Este modelo / categoria é exclusivo para clientes VIP. Escolha outro serviço ou entre com uma senha VIP.' });\n      setTimeout(() => askService(), 450);\n      return;\n    }\n    saveSnapshot();\n    const msgId = uid();\n    callbacks.current[msgId] = (answer: string) => {\n      const model = models.find(item => displayLabel(item) === answer);\n      if (!model) return;\n      if (isVipOnlyLocked(model, isVipCustomer)) {\n        addMsgs({ type: 'bot', id: uid(), text: '🔒 Este modelo / categoria é SOMENTE VIP. Entre com uma senha VIP para liberar esta escolha.' });\n        setTimeout(() => startOptionPricing(product, option), 350);\n        return;\n      }\n      markAnswered(msgId);\n      addMsgs({ type: 'user', id: uid(), text: answer });\n      flowState.current.priceModel = model;\n      saveBotProgress('questions', 'dados');\n      setTimeout(() => askQuestions(product, option, {}), 250);\n    };\n    addMsgs(\n      { type: 'bot', id: uid(), text: 'Qual modelo / categoria de preço você deseja?' },\n      { type: 'options', id: msgId, options: models.map(displayLabel), answered: false }\n    );\n  };'''
          text = replace_once(text, old_fn, new_fn, 'bot model/category selection')
          text = replace_once(text,
          '''    const price = flowState.current.priceModel?.price || option?.price || '';''',
          '''    const price = getModelPrice(flowState.current.priceModel) || option?.price || '';''', 'bot PIX VIP price')
          text = replace_once(text,
          '''            const rawPrice = flowState.current.priceModel?.price || option?.price;''',
          '''            const rawPrice = getModelPrice(flowState.current.priceModel) || option?.price;''', 'bot submit VIP price')
          text = replace_once(text,
          '''          paymentProofUrl: flowState.current.pixProofUrl || undefined,''',
          '''          priceModelId: flowState.current.priceModel?.id || undefined,\n          paymentProofUrl: flowState.current.pixProofUrl || undefined,''', 'bot submit priceModelId')
          text = replace_once(text,
          '''            cartItems: [{ service: product.name, nameOption: option?.label || option?.name || 'N/A', price: option?.price || '' }],''',
          '''            cartItems: [{ service: product.name, nameOption: option?.label || option?.name || 'N/A', price: getModelPrice(flowState.current.priceModel) || option?.price || '' }],''', 'bot complete item price')
          text = replace_once(text,
          '''            totalValue: option?.price || '', ''',
          '''            totalValue: getModelPrice(flowState.current.priceModel) || option?.price || '', ''', 'bot complete total price')
          text = text.replace(
          '''flowState.current = { product: null, option: null, answers: {},''',
          '''flowState.current = { product: null, option: null, priceModel: null, answers: {},''',
          1)
          write(path, text)

          # ------------------------------------------------------------------
          # Textual audit guarantees scope: Modelo/Categoria, not product/card
          # ------------------------------------------------------------------
          write('audit/check_model_category_vip.mjs', '''import fs from "node:fs";\nconst files = {\n  router: fs.readFileSync("server/routers/optionPriceModels.ts", "utf8"),\n  submit: fs.readFileSync("server/routers.ts", "utf8"),\n  admin: fs.readFileSync("client/src/pages/AdminProducts.tsx", "utf8"),\n  card: fs.readFileSync("client/src/components/StorefrontProductCard.tsx", "utf8"),\n  home: fs.readFileSync("client/src/pages/Home.tsx", "utf8"),\n  bot: fs.readFileSync("client/src/components/ColombiaBot.tsx", "utf8"),\n};\nconst checks = [\n  ["VIP salvo em optionPriceModels", files.router.includes("vipAccessMode") && files.router.includes("vipDiscountValue")],\n  ["admin configura modelo/categoria", files.admin.includes("VIP DESTE MODELO / CATEGORIA") && files.admin.includes("Somente VIP")],\n  ["vitrine bloqueia somente VIP", files.card.includes("isVipOnlyLocked") && files.card.includes("SOMENTE VIP")],\n  ["checkout envia priceModelId", files.home.includes("priceModelId: item.priceModel?.id") && files.home.includes("priceModelId: selectedPriceModel?.id")],\n  ["bot respeita modelo/categoria VIP", files.bot.includes("SOMENTE VIP") && files.bot.includes("priceModelId: flowState.current.priceModel?.id")],\n  ["servidor valida restricao", files.submit.includes("checkOptionPriceModelCheckoutAccess") && files.submit.includes("input.priceModelId")],\n  ["nenhum campo VIP adicionado ao produto pai", !files.submit.includes("productVipAccessMode") && !files.admin.includes("VIP DESTE CARD")],\n];\nfor (const [name, ok] of checks) console.log(`${ok ? "OK" : "FAIL"} - ${name}`);\nif (checks.some(([, ok]) => !ok)) process.exit(1);\n''')

      - name: Audit model/category VIP scope
        run: node audit/check_model_category_vip.mjs

      - name: Test VIP pricing rules
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm vitest run shared/vipPricing.test.ts

      - name: Build production client/server
        run: pnpm build

      - name: Commit production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/vipPricing.ts shared/vipPricing.test.ts server/routers/optionPriceModels.ts server/routers.ts client/src/pages/AdminProducts.tsx client/src/components/StorefrontProductCard.tsx client/src/pages/Home.tsx client/src/components/ColombiaBot.tsx audit/check_model_category_vip.mjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(pedidos): VIP por modelo e categoria"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
