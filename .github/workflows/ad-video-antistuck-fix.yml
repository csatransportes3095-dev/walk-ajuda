name: Ad Video Anti Stuck Fix

on:
  push:
    branches:
      - fix/ad-video-playback-20260901

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ad-video-playback-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Apply anti-stuck patch
        run: node scripts/apply-ad-video-antistuck-fix.mjs
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run video regression tests
        run: pnpm vitest run server/publicVideoRange.test.ts server/adCampaignVideoAntiStuck.test.ts
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          rm scripts/apply-ad-video-antistuck-fix.mjs .github/workflows/ad-video-antistuck-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx client/src/pages/OrderTracking.tsx server/adCampaignVideoAntiStuck.test.ts scripts/apply-ad-video-antistuck-fix.mjs .github/workflows/ad-video-antistuck-fix.yml
          git commit -m "fix(ads): impedir travamento quando video nao carrega"
          git push origin HEAD:fix/ad-video-playback-20260901
