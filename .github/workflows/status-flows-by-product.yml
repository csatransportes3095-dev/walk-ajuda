name: Status flows by product

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/status-flows-by-product.yml"
      - "drizzle/schema.ts"
      - "drizzle/0136_status_flows_by_product.sql"
      - "server/db.ts"
      - "server/routers.ts"
      - "server/statusFlowsByProduct.test.ts"
      - "client/src/App.tsx"
      - "client/src/pages/AdminStatusTypes.tsx"
      - "client/src/pages/AdminStatusFlows.tsx"
      - "client/src/pages/AdminOrders.tsx"
      - "client/src/pages/OrderTracking.tsx"
  push:
    branches:
      - feature/status-flows-by-product
    paths:
      - ".github/workflows/status-flows-by-product.yml"
      - "drizzle/schema.ts"
      - "drizzle/0136_status_flows_by_product.sql"
      - "server/db.ts"
      - "server/routers.ts"
      - "server/statusFlowsByProduct.test.ts"
      - "client/src/App.tsx"
      - "client/src/pages/AdminStatusTypes.tsx"
      - "client/src/pages/AdminStatusFlows.tsx"
      - "client/src/pages/AdminOrders.tsx"
      - "client/src/pages/OrderTracking.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/status-flows-by-product
          fetch-depth: 0

      - name: Validate whitespace
        run: git diff --check origin/main...HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Targeted regression tests
        run: pnpm vitest run server/statusFlowsByProduct.test.ts server/scheduleOrderSync.test.ts server/orderFixes.test.ts

      - name: Production build
        run: pnpm build
