name: Status flows by product

on:
  push:
    branches:
      - feature/status-flows-by-product
    paths:
      - "scripts/status-flows-by-product-patch.mjs"
      - ".github/workflows/status-flows-by-product.yml"
      - "drizzle/schema.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/status-flows-by-product
          fetch-depth: 0

      - name: Apply guarded status-flow patch
        run: node scripts/status-flows-by-product-patch.mjs

      - name: Validate whitespace
        run: git diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Targeted regression tests
        run: pnpm vitest run server/statusFlowsByProduct.test.ts server/scheduleOrderSync.test.ts server/orderFixes.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts drizzle/0136_status_flows_by_product.sql server/db.ts server/routers.ts client/src/App.tsx client/src/pages/AdminStatusTypes.tsx client/src/pages/AdminStatusFlows.tsx client/src/pages/AdminOrders.tsx client/src/pages/OrderTracking.tsx server/statusFlowsByProduct.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(status): add per-product status sequences [skip ci]"
          git push origin HEAD:feature/status-flows-by-product
