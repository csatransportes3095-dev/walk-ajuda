name: H2 Ads validate 1.3.4 branch

on:
  push:
    branches:
      - fix/h2ads-validation-worker-1-3-4-20260830
    paths:
      - ".github/workflows/h2ads-validation-134-branch.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run server/h2adsWorkerRoute.test.ts server/h2adsWorkerFoundation.test.ts
      - run: pnpm build
      - run: node -e "const fs=require('node:fs'); const text=fs.readFileSync('workers/windows/H2AdsWorker.ps1','utf8'); if (!text.includes('AgentVersion = \\\"1.3.4\\\"')) throw new Error('Packaged worker is not 1.3.4'); console.log('Packaged worker 1.3.4 confirmed');"
      # valida a versão empacotada; a confirmação do Render é feita fora desta CI
