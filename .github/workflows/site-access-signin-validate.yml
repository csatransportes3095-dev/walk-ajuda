name: Site Access - restricted sign-in build
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - 'client/src/main.tsx'
      - 'client/src/pages/SiteAccess.tsx'
      - '.github/workflows/site-access-signin-validate.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile visitor sign-in with production bundle
        run: pnpm build
