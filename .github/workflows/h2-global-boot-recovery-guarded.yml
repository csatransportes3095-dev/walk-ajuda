name: H2 Global Boot Recovery Guarded

on:
  push:
    branches:
      - fix/h2-global-boot-stuck-background-20260901

permissions:
  contents: write

jobs:
  validate-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply-h2-global-boot-recovery.py

      - name: Validate diff and binary
        run: |
          git diff --check
          test -s client/public/h2-colombia-background.webp
          file client/public/h2-colombia-background.webp | grep -qi webp
          git status --short

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Targeted regression tests
        run: pnpm exec vitest run server/globalBootRecovery.test.ts server/orderWarrantyDisplay.test.ts server/internalStagePersistence.test.ts server/scheduleOrderSync.test.ts

      - name: Production build
        run: pnpm build

      - name: Verify built assets and HTML
        run: |
          test -f dist/public/index.html
          test -f dist/public/h2-colombia-background.webp
          grep -q 'h2-colombia-background.webp' dist/public/assets/*.css
          grep -q 'H2 BOOT WATCHDOG v1' dist/public/index.html

      - name: Commit validated production files only
        run: |
          rm -f scripts/apply-h2-global-boot-recovery.py .github/workflows/h2-global-boot-recovery-guarded.yml
          git add client/src/index.css client/index.html client/public/sw.js server/_core/vite.ts server/globalBootRecovery.test.ts
          git add -u scripts/apply-h2-global-boot-recovery.py .github/workflows/h2-global-boot-recovery-guarded.yml
          if git diff --cached --quiet; then
            echo 'No validated changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(h2): recuperar boot global e trocar fundo Colombia [skip ci]'
          git push origin HEAD:fix/h2-global-boot-stuck-background-20260901
