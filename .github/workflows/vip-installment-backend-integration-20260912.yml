name: VIP Installment Backend Integration

on:
  push:
    branches:
      - feat/vip-parcelamento-seguro-2026-09-12
    paths:
      - .github/workflows/vip-installment-backend-integration-20260912.yml

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-parcelamento-seguro-2026-09-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply guarded backend integration
        shell: bash
        run: |
          python scripts/apply_vip_installment_contract_safety_20260912.py
          python scripts/apply_vip_installment_payment_router_20260912.py
          python scripts/apply_vip_installment_checkout_backend_20260912.py
          python - <<'PY'
          from pathlib import Path
          p = Path('server/vipInstallmentContractService.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('productRuleId: productRule.id == null ? null : Number(productRule.id),', 'productRuleId: null,')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused installment tests
        run: pnpm exec vitest run server/vipInstallments.newlogic.test.ts
      - name: Check backend TypeScript regressions
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -E "(server/vipInstallmentContractService\.ts|server/vipInstallmentEligibility\.ts|server/routers/vipInstallments\.ts|server/routers/vipInstallmentPayments\.ts|server/routers\.ts|server/vipInstallmentPricing\.ts|server/vipInstallmentProductRules\.ts|shared/vipInstallments\.ts|shared/vipCheckoutPricing\.ts)" /tmp/tsc.log \
            | grep -v "server/routers.ts(5995,30).*listOrderStatusTypes" \
            | grep -v "server/routers.ts(6005,32).*listOrderStatusTypes" \
            > /tmp/vip-backend-errors.log || true
          if [ -s /tmp/vip-backend-errors.log ]; then
            cat /tmp/vip-backend-errors.log
            exit 1
          fi
          echo "No new VIP installment backend TypeScript errors."
      - name: Commit only after validation
        shell: bash
        run: |
          git config user.name "h2-vip-guard"
          git config user.email "actions@users.noreply.github.com"
          git add server/vipInstallmentContractService.ts server/routers.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(vip): integrate idempotent installment checkout backend"
          git pull --rebase origin feat/vip-parcelamento-seguro-2026-09-12
          git push origin HEAD:feat/vip-parcelamento-seguro-2026-09-12
