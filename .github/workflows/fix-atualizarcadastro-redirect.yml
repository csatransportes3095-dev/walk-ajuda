name: Fix atualizar cadastro redirect

on:
  push:
    branches:
      - fix/atualizarcadastro-redirect
    paths:
      - .github/workflows/fix-atualizarcadastro-redirect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atualizarcadastro-redirect
          fetch-depth: 0
      - name: Apply redirect hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/AtualizarCadastro.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '\n  function acceptToken(nextToken: string) {'
          effect = '\n\n  useEffect(() => {\n    if (step !== "done" && step !== "already_done") return;\n    const timer = window.setTimeout(() => {\n      window.location.replace("/login");\n    }, 1800);\n    return () => window.clearTimeout(timer);\n  }, [step]);\n'
          if s.count(marker) != 1:
              raise SystemExit(f'marker count={s.count(marker)}')
          s = s.replace(marker, effect + marker, 1)
          s = s.replace('Os dados foram sincronizados com pedidos, cadastro, empréstimos e gastos. Aguarde a liberação do site.', 'Os dados foram sincronizados com pedidos, cadastro, empréstimos e gastos. Redirecionando para o site...', 1)
          s = s.replace('Aguarde a liberação do site.', 'Redirecionando para o site...', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Audit scope
        run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "client/src/pages/AtualizarCadastro.tsx"
      - name: Validate
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/AtualizarCadastro.tsx
          git commit -m 'fix(cadastro): redirecionar após atualização'
          git push origin HEAD:fix/atualizarcadastro-redirect
