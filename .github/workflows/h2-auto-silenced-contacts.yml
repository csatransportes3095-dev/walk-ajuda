name: H2 AUTO - Contatos Silenciados
on:
  push:
    branches: [feature/h2auto-manual-silenced-contacts-20261028]
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact phone silencing regressions
        run: pnpm exec vitest run server/h2-auto-silenced-contacts.test.ts server/h2-auto-validation-policy.test.ts
      - name: Verify changed files types
        run: |
          pnpm exec tsc --noEmit > /tmp/h2-silence-tsc.log 2>&1 && exit 0
          if grep -E '^(server/h2-auto-silenced-contacts\.ts|server/h2-auto-silenced-contacts\.test\.ts|client/src/components/H2AutoSilencedContacts\.tsx)\([0-9]+,[0-9]+\): error TS' /tmp/h2-silence-tsc.log; then
            cat /tmp/h2-silence-tsc.log
            exit 1
          fi
          echo "New silencing files have no TS errors"
      - name: Build site and backend
        run: pnpm build
