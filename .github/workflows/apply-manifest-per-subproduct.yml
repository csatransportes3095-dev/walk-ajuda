name: Apply Manifest Per Subproduct

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "scripts/apply-manifest-per-subproduct.py"
      - ".github/workflows/apply-manifest-per-subproduct.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python3 scripts/apply-manifest-per-subproduct.py
      - run: git diff --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/optionPriceModelsFlow.test.ts server/productManifestFlow.test.ts
      - run: pnpm build
      - run: rm -f .github/workflows/apply-manifest-per-subproduct.yml scripts/apply-manifest-per-subproduct.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/ProductManifestEditor.tsx client/src/components/ProductManifestGuard.tsx client/src/lib/productManifest.ts client/src/pages/AdminProducts.tsx client/src/components/StorefrontProductCard.tsx server/productManifestFlow.test.ts
          git add -u .github/workflows/apply-manifest-per-subproduct.yml scripts/apply-manifest-per-subproduct.py
          git commit -m "fix(products): manifesto individual por acao e categoria"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
