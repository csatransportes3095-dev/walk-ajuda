name: Site access own codes and 24h sessions
on:
  push:
    branches: [feature/site-access-own-codes-24h-20261020, fix/site-access-six-digits-20261020]
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'server/siteAccess*'
      - 'shared/siteAccessCodePolicy.ts'
      - 'client/src/pages/SiteAccess.tsx'
      - 'client/src/components/SiteAccessSessionBoundary.tsx'
      - 'client/src/lib/siteAccessSessionClient.ts'
      - 'client/src/main.tsx'
      - '.github/workflows/site-access-email-fallback-validation.yml'
permissions:
  contents: read
concurrency:
  group: site-own-codes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-isolated-only
          MYSQL_DATABASE: h2_site_access_test
        ports: ['33306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-isolated-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TZ: UTC
      SITE_ACCESS_TEST_DB_URL: mysql://root:test-isolated-only@127.0.0.1:33306/h2_site_access_test
      SITE_CODE_TEST_DB_URL: mysql://root:test-isolated-only@127.0.0.1:33306/h2_site_code_test
      TEST_MYSQL_URL: mysql://root:test-isolated-only@127.0.0.1:33306/h2_bulk_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies and initialize disposable databases
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
          mkdir -p /tmp/site-own-code-evidence
          node --input-type=module <<'JS'
          import {createConnection} from 'mysql2/promise';
          const url=new URL(process.env.SITE_ACCESS_TEST_DB_URL);
          if(url.hostname!=='127.0.0.1'||url.port!=='33306'||url.pathname!=='/h2_site_access_test')throw new Error('Refusing nonlocal database');
          const db=await createConnection(process.env.SITE_ACCESS_TEST_DB_URL);
          try{await db.query('CREATE DATABASE IF NOT EXISTS h2_bulk_test');await db.query('CREATE DATABASE IF NOT EXISTS h2_site_code_test');}finally{await db.end();}
          JS
      - name: Protect code generation, sessions, scheduling and delivery configuration
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import ts from 'typescript';
          const base='0183a51750d3556cb4d2b345e29af57f7931c32d';
          const before=p=>execFileSync('git',['show',base+':'+p],{encoding:'utf8'});
          const read=p=>fs.readFileSync(p,'utf8');
          for(const p of ['server/siteAccessCodeDelivery.ts','server/siteSecurityRouter.ts','server/siteAccessSchema.ts','server/siteAccessGateway.ts','server/siteAccessPolicy.ts','server/siteAccessManualAdd.ts','server/siteSecurityDirectory.ts','server/autoSchedule.ts','server/routers/schedule.ts','server/routers/customerPassword.ts','server/_core/trpc.ts','server/_core/mailer.ts','server/_core/sendMailDirect.ts','server/db.ts','client/src/pages/AdminSiteSecurity.tsx','client/src/pages/OrderTracking.tsx','client/src/App.tsx','client/src/main.tsx','client/src/components/SiteAccessSessionBoundary.tsx','client/src/lib/siteAccessSessionClient.ts','Dockerfile','package.json','pnpm-lock.yaml'])assert.equal(read(p),before(p),p+' unexpectedly changed');
          const parse=(p,source)=>ts.createSourceFile(p,source,ts.ScriptTarget.Latest,true);
          const functions=(p,source)=>new Map(parse(p,source).statements.filter(ts.isFunctionDeclaration).map(node=>[node.name?.text,node.getText()]));
          for(const [p,names] of [
            ['server/siteAccessOwnCodes.ts',['secret','ownSiteHash','ownCodeFingerprint','generateOwnSiteCode','ownSiteErrorCode','rows','ensureOwnSiteCodeStore','active','personForEmail','takeOwnSiteLimit','finishOwnSiteCodeDelivery','consumeOwnSiteCode','readOwnSiteSession','revokeOwnSiteSession']],
            ['server/siteAccessIdentity.ts',['isSiteAccessEmail','isSameOriginSiteRequest','tokenFrom','ownerSession','authorizedSiteVisitor','noStore','limited','failure']],
          ]){
            const previous=functions(p,before(p)),current=functions(p,read(p));
            for(const name of names){assert(previous.has(name)&&current.has(name),p+' missing '+name);assert.equal(current.get(name),previous.get(name),p+' changed '+name);}
          }
          const protectedRoutes=source=>{
            const found=new Map(),file=parse('identity.ts',source);
            const visit=node=>{
              if(ts.isCallExpression(node)&&/^app\.(post|get)$/.test(node.expression.getText())&&ts.isStringLiteral(node.arguments[0])){
                const route=node.arguments[0].text;
                if(['/api/site-access/verify','/api/site-access/session','/api/site-access/logout'].includes(route)){assert(!found.has(route),'Duplicate protected route');found.set(route,node.getText());}
              }
              ts.forEachChild(node,visit);
            };
            visit(file);assert.equal(found.size,3);return found;
          };
          assert.deepEqual(protectedRoutes(read('server/siteAccessIdentity.ts')),protectedRoutes(before('server/siteAccessIdentity.ts')),'Verification or session routes changed');
          const withoutDenial=source=>source.replace(/^export const SITE_ACCESS_DENIED_(?:CODE|MESSAGE) = .*;\r?\n/gm,'').trimEnd();
          assert.equal(withoutDenial(read('shared/siteAccessCodePolicy.ts')),before('shared/siteAccessCodePolicy.ts').trimEnd(),'Code format or lifetime changed');
          console.log('PASS: authorization request changes preserve the generator, ledger schema, rate-limit algorithm, verification, sessions, delivery transport and unrelated operations.');
          JS
      - name: Test six-digit lifecycle and all site regressions
        run: |
          set -o pipefail
          mapfile -t tests < <(find server -maxdepth 1 -type f -name 'site*.test.ts' | sort)
          pnpm exec vitest run "${tests[@]}" server/trackingScheduleTopCard.test.ts server/analysisSchedulePriority.test.ts server/orderStatusVisibility.test.ts 2>&1 | tee /tmp/site-own-code-evidence/tests-before.txt
      - name: Apply exact Render source preparation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const scripts=[...fs.readFileSync('Dockerfile','utf8').matchAll(/&& node (scripts\/[^\s]+)/g)].map(m=>m[1]);
          if(!scripts.length)throw new Error('Missing Render preparation');
          for(const script of scripts){if(!/^scripts\/[A-Za-z0-9._/-]+\.mjs$/.test(script))throw new Error('Unexpected preparation path');execFileSync(process.execPath,[script],{stdio:'inherit'});}
          JS
      - name: Repeat after Render preparation
        run: |
          set -o pipefail
          mapfile -t tests < <(find server -maxdepth 1 -type f -name 'site*.test.ts' | sort)
          pnpm exec vitest run "${tests[@]}" server/trackingScheduleTopCard.test.ts server/analysisSchedulePriority.test.ts server/orderStatusVisibility.test.ts 2>&1 | tee /tmp/site-own-code-evidence/tests-after.txt
      - name: Build production application
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/site-own-code-evidence/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-own-code-evidence
          path: /tmp/site-own-code-evidence
          retention-days: 3
