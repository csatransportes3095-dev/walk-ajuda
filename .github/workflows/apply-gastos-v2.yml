name: Apply Gastos V2

on:
  push:
    branches:
      - feat/gastos-v2-backup-inteligencia
    paths:
      - '.github/workflows/apply-gastos-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/gastos-v2-backup-inteligencia
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply guarded source changes
        run: python3 .github/scripts/apply_gastos_v2.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(gastos): painel inteligente backup e seguranca" || exit 0
          git push origin HEAD:feat/gastos-v2-backup-inteligencia
