name: Apply customer address final

on:
  push:
    branches:
      - feat/endereco-completo-cadastro-v2
    paths:
      - scripts/_prepare_customer_address_patch_final.py
      - scripts/_fix_admin_create_address_input.py
      - .github/workflows/apply-customer-address-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/endereco-completo-cadastro-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact patch
        run: python scripts/_prepare_customer_address_patch_final.py
      - name: Apply isolated address patch
        run: python scripts/_apply_customer_address_patch.py
      - name: Align adminCreate input
        run: python scripts/_fix_admin_create_address_input.py
      - name: Audit forbidden files
        run: |
          git status --short
          if git status --short | grep -Eq '(client/src/components/StorefrontProductCard.tsx|client/src/components/ui/tabs.tsx|client/src/pages/Gastos.tsx|client/src/pages/GastosLoginPage.tsx)$'; then
            echo 'Forbidden file changed' >&2
            exit 1
          fi
      - name: Install and validate
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore scripts/_apply_customer_address_patch.py scripts/_prepare_customer_address_patch_final.py scripts/_fix_admin_create_address_input.py .github/workflows/apply-customer-address-patch.yml .github/workflows/apply-customer-address-final.yml
          git add drizzle/schema.ts shared/customerProfileUpdate.ts server/customerAccess.ts server/routers/customerUpdate.ts client/src/pages/AtualizarCadastro.tsx client/src/components/PasswordGate.tsx server/routers.ts client/src/pages/AdminCustomers.tsx client/src/pages/AdminOrders.tsx scripts/apply-customer-address-migration.ts scripts/render-start.sh
          git commit -m 'feat(cadastro): endereço completo obrigatório'
          git push origin HEAD:feat/endereco-completo-cadastro-v2
