name: H2ADS worker headless watchdog

on:
  push:
    branches:
      - fix/h2ads-worker-headless-watchdog-20260831
    paths:
      - ".github/workflows/h2ads-worker-headless-watchdog-20260831.yml"
      - "scripts/patch-h2ads-worker-headless-watchdog-20260831.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-worker-headless-watchdog-20260831
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-h2ads-worker-headless-watchdog-20260831.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: H2ADS worker tests
        run: pnpm vitest run server/h2adsWorkerFoundation.test.ts server/h2adsWorkerRoute.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/windows/H2AdsWorker.ps1 server/h2adsWorkerFoundation.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(h2ads): executar Walk1 invisivel com watchdog [skip ci]"
          git push origin HEAD:fix/h2ads-worker-headless-watchdog-20260831
