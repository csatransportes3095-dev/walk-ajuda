name: Chassis year 2027 isolated validation
on:
  push:
    branches:
      - fix/chassis-year-2027-only-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm exact 2027-only change
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const page = readFileSync('client/src/pages/GeradorChassiPublico.tsx','utf8');
          const shared = readFileSync('shared/chassisService.ts','utf8');
          if (!page.includes('{ code: "T", ano: 2026 },\n  { code: "V", ano: 2027 },')) throw new Error('2027 option absent');
          if (!shared.includes('"S", "T", "V"] as const')) throw new Error('2027 code not accepted');
          const years=[...page.matchAll(/\{ code: "[A-Z]", ano: (20\d\d) \}/g)].map(m=>+m[1]);
          if (years.length!==12 || years[0]!==2016 || years.at(-1)!==2027) throw new Error('Year range changed unexpectedly');
          console.log('Only 2016-2027 year selector and shared validator updated.');
          JS
      - name: Chassis service regression tests
        run: pnpm exec vitest run server/chassisServiceCore.test.ts server/chassisServiceRouter.test.ts
      - name: TypeScript on changed files
        shell: bash
        run: |
          set +e
          pnpm check > /tmp/typecheck.log 2>&1
          set -e
          if grep -E '^(client/src/pages/GeradorChassiPublico\.tsx|shared/chassisService\.ts)\(' /tmp/typecheck.log | grep -q 'error TS'; then
            echo 'TypeScript error in changed Chassis files'
            exit 1
          fi
      - name: All Render Dockerfile patches and production build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          docker=Path('Dockerfile').read_text()
          start=docker.index('RUN npm install -g pnpm@10.4.1')
          end=docker.index('\n\nENV NODE_ENV',start)
          chain=docker[start:end].replace('\\\n',' ').strip()
          marker='&& node scripts/'
          assert marker in chain
          chain='node scripts/'+chain.split(marker,1)[1]
          subprocess.run(chain,shell=True,check=True)
          PY
