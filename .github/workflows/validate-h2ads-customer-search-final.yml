name: Validate H2ADS customer search final
on:
  push:
    branches: [fix/h2ads-new-instance-customer-search-20260830]
    paths: [.github/workflows/validate-h2ads-customer-search-final.yml]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-new-instance-customer-search-20260830
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused tests
        run: pnpm vitest run server/h2adsOrderSearch.test.ts server/h2adsOrderLink.test.ts
      - name: Production build
        run: pnpm build
