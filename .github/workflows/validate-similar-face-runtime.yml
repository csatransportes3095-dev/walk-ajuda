name: Validate Similar Face runtime

on:
  push:
    branches:
      - feat/similar-face-reference-runtime-20260926
    paths:
      - "client/src/lib/similarFaceReference.ts"
      - "server/similarFaceReference.test.ts"
      - "client/src/lib/similarFaceTfliteRuntime.ts"
      - "client/src/pages/AdminSimilarity.tsx"
      - ".github/workflows/validate-similar-face-runtime.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Similar Face unit test
        run: pnpm vitest run server/similarFaceReference.test.ts

      - name: Build
        run: pnpm build
