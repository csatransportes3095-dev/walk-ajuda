name: Cofre de Placas - testes isolados
on:
  pull_request:
    paths:
      - 'shared/plateSimilarity.ts'
      - 'client/src/components/PlateSimilarityPanel.tsx'
      - 'client/src/pages/AdminVehicleUsage.tsx'
      - 'server/routers/plateSimilarity.ts'
      - 'server/routers/vehicleVault.ts'
      - 'server/plateSimilarity.test.ts'
      - '.github/workflows/cofre-placas-ci.yml'
permissions:
  contents: read
jobs:
  placas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testar somente geracao e formato das placas
        run: pnpm exec vitest run server/plateSimilarity.test.ts
