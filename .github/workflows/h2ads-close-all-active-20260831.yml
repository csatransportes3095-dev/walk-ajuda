name: H2 Ads close all active

on:
  push:
    branches:
      - feat/h2ads-close-all-active-20260831
    paths:
      - ".github/workflows/h2ads-close-all-active-20260831.yml"
      - "scripts/patch-h2ads-close-all-active-20260831.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h2ads-close-all-active-20260831
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-h2ads-close-all-active-20260831.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: H2 Ads focused tests
        run: pnpm vitest run server/h2adsWorkerRoute.test.ts server/h2adsWorkerFoundation.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/H2Ads.tsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(h2ads): fechar todas instancias ativas [skip ci]"
          git push origin HEAD:feat/h2ads-close-all-active-20260831
