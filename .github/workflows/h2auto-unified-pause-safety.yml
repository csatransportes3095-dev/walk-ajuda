name: H2 AUTO Unified Pause Safety
on:
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'server/h2-auto-remote.ts'
      - 'server/h2-auto-diagnostics.ts'
      - 'server/h2AutoSinglePauseAuthority.test.ts'
      - 'server/h2AutoLegacyPauseVisibility.test.ts'
      - 'server/h2-auto-local-pause-diagnostics.test.ts'
      - 'client/src/components/H2AutoManualControls.tsx'
      - 'client/src/pages/AdminH2Auto.tsx'
      - '.github/workflows/h2auto-unified-pause-safety.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/h2AutoSinglePauseAuthority.test.ts server/h2AutoLegacyPauseVisibility.test.ts server/h2-auto-local-pause-diagnostics.test.ts server/h2-auto-silenced-contacts.test.ts server/h2-auto-otp-continuity.test.ts
      - name: Check TypeScript errors in modified H2 Auto paths
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit > /tmp/h2-tsc.log 2>&1 || true
          if grep -E '^((client/src/components/H2AutoManualControls.tsx)|(client/src/pages/AdminH2Auto.tsx)|(server/h2-auto-remote.ts)|(server/h2-auto-diagnostics.ts))\\(' /tmp/h2-tsc.log; then
            echo "New TypeScript errors in the H2 Auto pause change"
            exit 1
          fi
          echo "No TypeScript errors in modified H2 Auto paths; baseline project-wide diagnostics are out of scope."
          grep -c 'error TS' /tmp/h2-tsc.log || true
      - run: node scripts/patch-media-local-export-20260910.mjs
      - run: pnpm build
