name: Fix Loan Dashboard Zero State

on:
  push:
    paths:
      - 'scripts/fix-loan-dashboard-zero.cjs'
      - '.github/workflows/fix-loan-dashboard-zero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/fix-loan-dashboard-zero.cjs
      - name: Commit dashboard zero-state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-loan-dashboard-zero.cjs .github/workflows/fix-loan-dashboard-zero.yml
          git add client/src/pages/AdminLoans.tsx
          git commit -m "fix: mantém dashboard de empréstimos visível com valores zerados"
          git push origin HEAD:main
