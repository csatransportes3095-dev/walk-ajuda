name: Global promotion isolated validation
on:
  push:
    branches: [feature/desconto-geral-site-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run shared/globalPromotion.test.ts server/vipPricing.test.ts
      - run: pnpm build
      - run: pnpm check
