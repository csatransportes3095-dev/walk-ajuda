name: Validate Gastos V2 Build

on:
  push:
    branches:
      - feat/gastos-v2-backup-inteligencia
    paths:
      - '.github/workflows/validate-gastos-v2-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gastos-v2-backup-inteligencia
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Remove temporary validation workflow
        run: |
          rm -f .github/workflows/validate-gastos-v2-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(gastos): remover workflow temporario de validacao" || exit 0
          git push origin HEAD:feat/gastos-v2-backup-inteligencia
