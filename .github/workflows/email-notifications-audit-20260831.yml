name: Email notifications audit temporary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Email notification tests
        run: pnpm vitest run server/email-notifications.test.ts
      - name: Type check
        run: pnpm check
      - name: Production build
        run: pnpm build
