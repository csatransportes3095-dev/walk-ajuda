name: Site security manual authorization
on:
  push:
    branches: [fix/site-security-manual-registration-20261019, fix/site-security-filter-suspend-20261019, feature/site-security-authorizations-directory-20261019]
  pull_request:
    branches: [recovery/organizar-salvos-2026-08-24]
    paths:
      - 'server/siteSecurityRouter.ts'
      - 'server/siteAccessManualAdd*'
      - 'shared/siteSecurityManualFeedback.ts'
      - 'client/src/pages/AdminSiteSecurity.tsx'
      - 'client/src/components/SiteSecurityFilteredCandidate.tsx'
      - 'shared/siteSecurityFilteredAccess.ts'
      - 'server/siteSecurityFilteredActions.test.ts'
      - 'client/src/components/SiteSecurityDirectoryControls.tsx'
      - 'shared/siteSecurityDirectory.ts'
      - 'server/siteSecurityDirectory*'
      - '.github/workflows/site-security-manual-registration-validation.yml'
permissions:
  contents: read
concurrency:
  group: site-security-manual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-isolated-only
          MYSQL_DATABASE: h2_site_access_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-isolated-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TZ: UTC
      SITE_ACCESS_TEST_DB_URL: mysql://root:test-isolated-only@127.0.0.1:33306/h2_site_access_test
      TEST_MYSQL_URL: mysql://root:test-isolated-only@127.0.0.1:33306/h2_bulk_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 40
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
          mkdir -p /tmp/site-security-manual-evidence
      - name: Initialize separate disposable bulk database
        run: |
          node --input-type=module <<'JS'
          import {createConnection} from 'mysql2/promise';
          const url=new URL(process.env.SITE_ACCESS_TEST_DB_URL);
          const bulk=new URL(process.env.TEST_MYSQL_URL);
          if(url.hostname!=='127.0.0.1'||url.port!=='33306'||url.pathname!=='/h2_site_access_test'||bulk.origin!==url.origin||bulk.pathname!=='/h2_bulk_test')throw new Error('Refusing non-local test database');
          const db=await createConnection(process.env.SITE_ACCESS_TEST_DB_URL);
          try{await db.query('CREATE DATABASE IF NOT EXISTS h2_bulk_test');}finally{await db.end();}
          JS
      - name: Confirm only directory reads and its list presentation changed
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const base='f43add9ede2f63b698ddb944841381381bab496a';
          const before=p=>execFileSync('git',['show',base+':'+p],{encoding:'utf8'});
          const read=p=>fs.readFileSync(p,'utf8');
          for(const p of ['server/siteAccessManualAdd.ts','shared/siteSecurityManualFeedback.ts','server/siteAccessSchema.ts','server/siteAccessIdentity.ts','server/autoSchedule.ts','server/routers/schedule.ts','server/_core/trpc.ts','server/_core/sendMailDirect.ts','server/db.ts','shared/siteSecurityBulk.ts','shared/siteSecurityFilteredAccess.ts','server/siteSecurityProfilePhotos.ts','client/src/components/SiteSecurityFilteredCandidate.tsx','client/src/pages/OrderTracking.tsx','Dockerfile','package.json','pnpm-lock.yaml']) {
            assert.equal(read(p),before(p),p+' unexpectedly changed');
          }
          const stripRouter=s=>s.replace(/^import \{ loadSiteDirectory \} from "\.\/siteSecurityDirectory";\r?\n/m,'').replace(/  list: adminProcedure[\s\S]*?(?=  bulkCandidates:)/,'');
          assert.equal(stripRouter(read('server/siteSecurityRouter.ts')),stripRouter(before('server/siteSecurityRouter.ts')),'Mutation or permission code changed');
          const stripUi=s=>s
            .replace(/^import .* from "(?:@shared\/siteSecurityDirectory|@\/components\/SiteSecurityDirectoryControls)";\r?\n/gm,'')
            .replace(/^ const \[directory(?:Filter|Search),.*\r?\n/gm,'')
            .replace(/^ const directoryPeople=.*\r?\n/m,'')
            .replace(/^ <SiteSecurityDirectoryControls .*\r?\n/m,'')
            .replace(/ \{people\.isLoading\?[\s\S]*?(?=\n <\/section>\n \{photoModal)/,'');
          assert.equal(stripUi(read('client/src/pages/AdminSiteSecurity.tsx')),stripUi(before('client/src/pages/AdminSiteSecurity.tsx')),'UI outside directory state/list changed');
          console.log('PASS: only list metadata, independent search and directory row presentation changed. All writes, permissions, OTP, schema, bulk operations and scheduling preserved.');
          JS
      - name: Directory, filter actions, isolated MySQL and security regressions
        run: |
          set -o pipefail
          mapfile -t tests < <(find server -maxdepth 1 -type f -name 'site*.test.ts' | sort)
          pnpm exec vitest run "${tests[@]}" server/trackingScheduleTopCard.test.ts server/analysisSchedulePriority.test.ts server/orderStatusVisibility.test.ts 2>&1 | tee /tmp/site-security-manual-evidence/tests-before.txt
      - name: Apply exact Render source preparation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const scripts=[...fs.readFileSync('Dockerfile','utf8').matchAll(/&& node (scripts\/[^\s]+)/g)].map(m=>m[1]);
          if(!scripts.length)throw new Error('Missing Render preparation');
          for(const script of scripts){
            if(!/^scripts\/[A-Za-z0-9._/-]+\.mjs$/.test(script))throw new Error('Unexpected preparation path');
            execFileSync(process.execPath,[script],{stdio:'inherit'});
          }
          JS
      - name: Repeat after Render preparation
        run: |
          set -o pipefail
          mapfile -t tests < <(find server -maxdepth 1 -type f -name 'site*.test.ts' | sort)
          pnpm exec vitest run "${tests[@]}" server/trackingScheduleTopCard.test.ts server/analysisSchedulePriority.test.ts server/orderStatusVisibility.test.ts 2>&1 | tee /tmp/site-security-manual-evidence/tests-after.txt
      - name: Build production application
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/site-security-manual-evidence/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-security-manual-evidence
          path: /tmp/site-security-manual-evidence
          retention-days: 3
