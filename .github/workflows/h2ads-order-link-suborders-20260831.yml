name: H2ADS order link suborders

on:
  push:
    branches:
      - fix/h2ads-order-link-suborders-20260831
    paths:
      - ".github/workflows/h2ads-order-link-suborders-20260831.yml"
      - "scripts/patch-h2ads-order-link-suborders-20260831.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-order-link-suborders-20260831
          fetch-depth: 0
      - name: Repair temporary patch script
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/patch-h2ads-order-link-suborders-20260831.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)', 'updated, count = re.subn(pattern, lambda _match: replacement, source, count=1, flags=re.S)')
          s = s.replace('''source = replace_once(\n    source,\n    '#{order.orderNumber || order.registrationId} · {[order.serviceName, order.serviceOption].filter(Boolean).join(" · ") || "Pedido"}',\n    source='#{order.orderNumber || order.registrationId}{order.subOrderIndex > 0 ? ` · item ${order.subOrderIndex + 1}` : ""} · {[order.serviceName, order.serviceOption].filter(Boolean).join(" · ") || "Pedido"}',\n    label='item resultado',\n)''', '''source = replace_once(\n    source,\n    '#{order.orderNumber || order.registrationId} · {[order.serviceName, order.serviceOption].filter(Boolean).join(" · ") || "Pedido"}',\n    '#{order.orderNumber || order.registrationId}{order.subOrderIndex > 0 ? ` · item ${order.subOrderIndex + 1}` : ""} · {[order.serviceName, order.serviceOption].filter(Boolean).join(" · ") || "Pedido"}',\n    'item resultado',\n)''')
          p.write_text(s, encoding='utf-8')
      - name: Apply patch
        run: python scripts/patch-h2ads-order-link-suborders-20260831.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml
      - name: H2ADS focused tests
        run: pnpm vitest run server/h2adsOrderBrowserShortcut.test.ts server/h2adsOrderLink.test.ts server/h2adsWorkerFoundation.test.ts server/h2adsWorkerRoute.test.ts
      - name: Source guards
        shell: python
        run: |
          from pathlib import Path
          backend = Path('server/h2adsOrderLink.ts').read_text(encoding='utf-8')
          picker = Path('client/src/components/H2AdsNewInstanceOrderPicker.tsx').read_text(encoding='utf-8')
          shortcut = Path('client/src/components/OrderH2AdsBrowserShortcut.tsx').read_text(encoding='utf-8')
          admin = Path('client/src/pages/AdminOrders.tsx').read_text(encoding='utf-8')
          section = backend[backend.index('export async function searchH2AdsCustomersForNewInstance'):backend.index('export async function listH2AdsOrderLinks')]
          if 'subOrderIndex: 0,' in section:
              raise SystemExit('nova instância ainda força subOrderIndex 0')
          for marker in [
              'const subOrders = splitH2AdsOrderHistory(historyNewestFirst, initialStatus);',
              'SELECT registrationId, subOrderIndex FROM h2ads_order_links',
              'item ${order.subOrderIndex + 1}',
              'resolveH2AdsOrderLinkRepairCandidate',
              'VINCULAR',
              'customerNumber={order.customerNumber}',
          ]:
              if marker not in (backend + picker + shortcut + admin):
                  raise SystemExit(f'marcador ausente: {marker}')
          print('H2ADS_ORDER_LINK_SUBORDER_GUARDS_OK')
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/h2adsOrderLink.ts client/src/components/H2AdsNewInstanceOrderPicker.tsx shared/h2adsOrderBrowserShortcut.ts client/src/components/OrderH2AdsBrowserShortcut.tsx client/src/pages/AdminOrders.tsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(h2ads): vincular pedido e subpedido corretos [skip ci]"
          git push origin HEAD:fix/h2ads-order-link-suborders-20260831
