name: Generate Passkey dependency lock
on:
  push:
    branches: [feat/customer-passkey-remember-20261124]
    paths: [package.json, .github/workflows/passkey-lock-preparation.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pinned dependencies without executing package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Emit dependency lock diff
        run: |
          echo PASSKEY_LOCK_DIFF_BEGIN
          git diff --no-color --no-ext-diff -- pnpm-lock.yaml
          echo PASSKEY_LOCK_DIFF_END
