name: H2 Android - rota canonica ADM

on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - "client/src/App.tsx"
      - "client/src/pages/AdminCodes.tsx"
      - "client/public/route-fallback-guard-v1.js"
      - "client/index.html"
      - "client/route-fallback-indicacoes.test.ts"
      - "server/route-fallback-indicacoes.test.ts"
      - "server/h2Android.integration.test.ts"
      - "server/siteAccessPolicy.test.ts"
      - ".github/workflows/h2-android-canonical-adm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify admin route, old redirects and privacy gates
        run: pnpm exec vitest run server/h2Android.integration.test.ts server/siteAccessPolicy.test.ts client/route-fallback-indicacoes.test.ts server/route-fallback-indicacoes.test.ts
      - name: Production build
        run: pnpm build
