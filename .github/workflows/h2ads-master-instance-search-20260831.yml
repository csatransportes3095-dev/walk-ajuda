name: H2ADS master search validation

on:
  push:
    branches:
      - feat/h2ads-master-instance-search-20260831

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-h2ads-master-search-20260831.py

      - name: Verify source
        run: |
          grep -Fq 'Pesquisar instância em todos os grupos...' client/src/pages/H2Ads.tsx
          grep -Fq 'normalizeH2AdsSearch(instance.name).includes(instanceSearchKey)' client/src/pages/H2Ads.tsx
          grep -Fq 'visibleGroups.map(group => <GroupSection' client/src/pages/H2Ads.tsx
          grep -Fq 'expanded={instanceSearchKey ? true : expandedGroups.has(group.id)}' client/src/pages/H2Ads.tsx

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml

      - name: TypeScript guard
        run: |
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if grep -Fq 'client/src/pages/H2Ads.tsx' /tmp/tsc.log; then
            echo 'TypeScript error introduced in H2Ads.tsx'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Only pre-existing TypeScript errors outside H2Ads.tsx remain.'
          fi

      - name: Production build
        run: pnpm build

      - name: Commit validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/H2Ads.tsx
          git commit -m 'feat(h2ads): adicionar filtro mestre de instancias [skip ci]'
          git push origin HEAD:feat/h2ads-master-instance-search-20260831
