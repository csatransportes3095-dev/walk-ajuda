name: Harden model category VIP price v2 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/model-category-vip-price-hardening-v2-20260907.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Apply server-side VIP price validation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server/routers/optionPriceModels.ts')
          text = p.read_text(encoding='utf-8')
          import_line = 'import { adminProcedure, publicProcedure, router } from "../_core/trpc";'
          if 'applyVipBenefitToPrice' not in text:
              text = text.replace(import_line, import_line + '\nimport { applyVipBenefitToPrice } from "../../shared/vipPricing";', 1)
          start = text.index('export async function checkOptionPriceModelCheckoutAccess(')
          end = text.index('\n\nexport const optionPriceModelsRouter', start)
          helper = '''export async function checkOptionPriceModelCheckoutAccess(priceModelId: number, isVipCustomer: boolean): Promise<{ allowed: boolean; reason?: string; effectivePrice?: string }> {
            await ensureInfrastructure();
            const db = await getDb();
            if (!db) return { allowed: false, reason: "Banco de dados indisponível." };
            const result = await db.execute(sql`
              SELECT id, optionId, label, price, originalPrice, promoEndsAt, sortOrder, isActive,
                     COALESCE(vipAccessMode, 'all') AS vipAccessMode,
                     COALESCE(vipDiscountType, 'percentage') AS vipDiscountType,
                     COALESCE(vipDiscountValue, 0) AS vipDiscountValue,
                     COALESCE(vipHighlight, 0) AS vipHighlight,
                     vipHighlightText
              FROM optionPriceModels WHERE id=${priceModelId} LIMIT 1
            `);
            const row = asRows<OptionPriceModel>(result)[0];
            if (!row || Number(row.isActive) !== 1) return { allowed: false, reason: "Este modelo/categoria não está disponível." };
            if (row.vipAccessMode === "vip_only" && !isVipCustomer) {
              return { allowed: false, reason: "Este modelo/categoria é exclusivo para clientes VIP." };
            }
            const effectivePrice = applyVipBenefitToPrice(String(row.price || ''), row, isVipCustomer);
            return { allowed: true, effectivePrice };
          }'''
          text = text[:start] + helper + text[end:]
          p.write_text(text, encoding='utf-8')

          p = Path('server/routers.ts')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r"(\s*if \(input\.priceModelId\) \{\s*const modelAccess = await checkOptionPriceModelCheckoutAccess\(input\.priceModelId, isVipModelAccess\);\s*if \(!modelAccess\.allowed\) return \{ success: false, message: modelAccess\.reason \|\| 'Modelo/categoria indisponível\.' \};)(\s*\})", re.S)
          m = pattern.search(text)
          if not m:
              raise SystemExit('Bloco de validacao de priceModelId nao encontrado')
          replacement = m.group(1) + "\n            // Preco do Modelo/Categoria e recalculado no servidor conforme a sessao VIP validada.\n            if (modelAccess.effectivePrice) input.price = modelAccess.effectivePrice;" + m.group(2)
          text = text[:m.start()] + replacement + text[m.end():]
          p.write_text(text, encoding='utf-8')

          p = Path('server/vipPricing.test.ts')
          text = p.read_text(encoding='utf-8')
          if 'cliente comum nao recebe beneficio' not in text:
              text = text.replace('describe("VIP por modelo/categoria", () => {', '''describe("VIP por modelo/categoria", () => {
            it("cliente comum nao recebe beneficio", () => {
              expect(applyVipBenefitToPrice("R$ 200,00", { vipAccessMode: "benefit", vipDiscountType: "percentage", vipDiscountValue: 50 }, false)).toBe("R$ 200,00");
            });''', 1)
              p.write_text(text, encoding='utf-8')

      - name: Verify hardening markers
        run: |
          grep -q "effectivePrice" server/routers/optionPriceModels.ts
          grep -q "input.price = modelAccess.effectivePrice" server/routers.ts
          grep -q "applyVipBenefitToPrice" server/routers/optionPriceModels.ts

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test VIP rules
        run: pnpm vitest run server/vipPricing.test.ts

      - name: Build production
        run: pnpm build

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers/optionPriceModels.ts server/routers.ts server/vipPricing.test.ts
          git commit -m "fix(pedidos): validar preco VIP por modelo no servidor"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
