name: Patch coupon start and end date time

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - .github/workflows/patch-coupon-schedule.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0

      - name: Patch coupon schedule
        shell: bash
        run: |
          awk 'BEGIN{in_coupons=0} /export const coupons = mysqlTable\("coupons"/{in_coupons=1} {print} in_coupons && /currentUses: int\("currentUses"\)\.default\(0\),/{print "  startsAt: timestamp(\"startsAt\"),"; in_coupons=0}' drizzle/schema.ts > drizzle/schema.ts.tmp
          mv drizzle/schema.ts.tmp drizzle/schema.ts
          sed -i '13,19d' .github/scripts/patch_coupon_schedule.py
          python3 .github/scripts/patch_coupon_schedule.py

      - name: Validate patch scope
        shell: bash
        run: |
          git diff --check
          grep -n 'startsAt: timestamp("startsAt")' drizzle/schema.ts
          grep -n 'ensureCouponScheduleInfrastructure' server/db.ts
          grep -n 'Este cupom ainda não iniciou' server/db.ts
          grep -n 'startsAt: z.string().optional()' server/routers.ts
          test "$(grep -c 'type="datetime-local"' client/src/pages/AdminCoupons.tsx)" -eq 2
          test "$(git diff --name-only | grep -Ev '^(drizzle/schema.ts|server/db.ts|server/routers.ts|client/src/pages/AdminCoupons.tsx|.github/scripts/patch_coupon_schedule.py)$' | wc -l)" -eq 0

      - name: TypeScript regression check
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          set +e
          pnpm check > /tmp/tsc.log 2>&1
          check_code=$?
          set -e
          cat /tmp/tsc.log
          if [ "$check_code" -ne 0 ]; then
            if grep -Eq 'client/src/pages/AdminCoupons\.tsx|server/db\.ts|drizzle/schema\.ts|server/routers\.ts\((4[8-9][0-9]|5[0-4][0-9]),' /tmp/tsc.log; then
              echo 'Erro TypeScript relacionado ao ajuste de cupons.'
              exit 1
            fi
            echo 'TypeScript possui erros preexistentes fora do ajuste de cupons; continuando sem amplia-los.'
          fi

      - name: Remove temporary patch files
        run: |
          git rm .github/workflows/patch-coupon-schedule.yml
          git rm -f .github/scripts/patch_coupon_schedule.py

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(coupons): configurar inicio e fim com data e hora"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
