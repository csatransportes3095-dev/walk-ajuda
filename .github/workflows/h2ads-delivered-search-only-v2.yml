name: H2ADS delivered search only v2

on:
  push:
    branches:
      - fix/h2ads-search-delivered-only-20260830
    paths:
      - ".github/workflows/h2ads-delivered-search-only-v2.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/h2ads-search-delivered-only-20260830
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-h2ads-delivered-search.py
      - name: Ensure AdminOrders unchanged
        run: test -z "$(git diff -- client/src/pages/AdminOrders.tsx)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm vitest run server/h2adsOrderSearch.test.ts
      - name: Build
        run: pnpm build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/h2adsOrderSearch.ts client/src/components/H2AdsOrderLinkControl.tsx server/h2adsOrderSearch.test.ts
          git commit -m "fix(h2ads): liberar entregues somente na busca de vinculo"
          git push origin HEAD:fix/h2ads-search-delivered-only-20260830
