name: Global order progress sequence validation

on:
  push:
    branches:
      - feat/global-order-progress-sequence-20260831
    paths:
      - ".github/workflows/global-order-progress-sequence-20260831.yml"
      - "scripts/patch-global-order-progress-sequence-20260831.py"
      - "shared/orderProgressSequence.ts"
      - "server/orderProgressSequence.test.ts"
      - "server/globalOrderProgressIntegration.test.ts"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JWT_SECRET: "global-progress-test-secret-20260831-minimum-32-chars"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-order-progress-sequence-20260831
          fetch-depth: 0

      - name: Apply audited patch
        run: python3 scripts/patch-global-order-progress-sequence-20260831.py

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Global progress tests
        run: pnpm vitest run server/orderProgressSequence.test.ts server/globalOrderProgressIntegration.test.ts server/adminOrdersOperationalFilters.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminOrders.tsx client/src/pages/AdminStatusTypes.tsx client/src/pages/OrderTracking.tsx server/db.ts server/routers.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat(progress): padronizar sequência global do cliente [skip ci]"
          git push origin HEAD:feat/global-order-progress-sequence-20260831
