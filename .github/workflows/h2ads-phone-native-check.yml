name: H2ADS Windows phone visual syntax
on:
  pull_request:
    paths:
      - "workers/windows/h2ads-phone-window.ps1"
      - "workers/windows/browser-session.mjs"
      - "workers/windows/H2AdsWorker.ps1"
      - ".github/workflows/h2ads-phone-native-check.yml"
  push:
    paths:
      - "workers/windows/h2ads-phone-window.ps1"
      - ".github/workflows/h2ads-phone-native-check.yml"
jobs:
  native-visual-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax and GUI types
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "workers/windows/h2ads-phone-window.ps1"),
            [ref]$tokens, [ref]$errorsFound
          ) | Out-Null
          if ($errorsFound.Count -gt 0) {
            $errorsFound | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $script = Get-Content -Raw "workers/windows/h2ads-phone-window.ps1"
          if ($script -match 'Invoke-WebRequest|--proxy-server|Start-Process') {
            throw "Native visual must never control browser/network"
          }
          if ($script -match 'CreateRoundRectRgn|DeleteObject') {
            throw "Hard clipping the Chrome HWND can truncate content at 175 percent display scaling."
          }
          if ($script -match 'function Set-PhoneCorners') {
            throw "Conflicting phone region algorithms make corners inconsistent."
          }
          if (-not $script.Contains('SetWindowRgn(hwnd,IntPtr.Zero,true)')) {
            throw "Phone companion must clear previous Chrome clipping before DWM."
          }
          Write-Host "Windows PowerShell syntax and GUI dependencies validated."
          # Exercise Add-Type P/Invoke compilation without creating a Chrome window.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "workers/windows/h2ads-phone-window.ps1" -BrowserPid 2147483646 -InstanceName "Smoke"
          if ($LASTEXITCODE -ne 0) { throw "Native phone script failed to compile on Windows PowerShell 5.1." }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "workers/windows/h2ads-phone-window.ps1" -BrowserPid 2147483646 -InstanceName "PaintSmoke" -VisualSelfTest
          if ($LASTEXITCODE -ne 0) { throw "Phone body failed to paint on Windows PowerShell 5.1." }
      - name: Ensure browser session refreshes phone visual even if locally cached
        shell: powershell
        run: |
          $runner = Get-Content -Raw "workers/windows/browser-session.mjs"
          if ($runner.Contains('if (!existsSync(script))')) { throw "Stale local phone visual cache can block updates." }
          if (-not $runner.Contains('cache: "no-store"')) { throw "Native phone visual must refresh from the current panel build." }
          if (-not $runner.Contains('h2ads-phone-window-${instanceId}.ps1')) { throw "Phone visual must use a per-instance script copy." }
