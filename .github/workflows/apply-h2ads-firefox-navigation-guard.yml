name: Apply H2ADS Firefox navigation guard

on:
  push:
    branches:
      - recovery/organizar-salvos-2026-08-24
    paths:
      - scripts/patch-h2ads-firefox-navigation-guard-20260903.py
      - .github/workflows/apply-h2ads-firefox-navigation-guard.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/organizar-salvos-2026-08-24
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/patch-h2ads-firefox-navigation-guard-20260903.py
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/windows/browser-session.mjs workers/windows/H2AdsWorker.ps1
          git diff --cached --check
          git commit -m "fix(h2ads): proteger Firefox contra Google Sorry"
          git push origin HEAD:recovery/organizar-salvos-2026-08-24
