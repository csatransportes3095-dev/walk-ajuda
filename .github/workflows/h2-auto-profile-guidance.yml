name: H2 AUTO - Orientacao cadastro incompleto
on:
  pull_request:
    branches:
      - recovery/organizar-salvos-2026-08-24
  push:
    branches:
      - fix/h2auto-cadastro-incompleto-login-20261028
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test profile guidance and existing phone validation
        run: pnpm exec vitest run server/h2-auto-customer-profile-guidance.test.ts server/h2-auto-validation-policy.test.ts
      - name: Verify H2 AUTO access endpoint compiles
        run: pnpm exec esbuild server/h2-auto-access.ts --bundle --platform=node --packages=external --format=esm --outfile=/tmp/h2-auto-access.js
      - name: Build website and backend
        run: pnpm build
