name: Orders H2ADS browser shortcuts

on:
  push:
    branches:
      - feat/orders-h2ads-browser-shortcuts-20260831
    paths:
      - ".github/workflows/orders-h2ads-browser-shortcuts-20260831.yml"
      - "scripts/patch-orders-h2ads-browser-shortcuts-20260831.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orders-h2ads-browser-shortcuts-20260831
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-orders-h2ads-browser-shortcuts-20260831.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Restore lockfile
        run: git checkout -- pnpm-lock.yaml
      - name: Shortcut tests
        run: pnpm vitest run server/h2adsOrderBrowserShortcut.test.ts server/h2adsWorkerFoundation.test.ts server/h2adsWorkerRoute.test.ts
      - name: Source guard
        shell: python
        run: |
          from pathlib import Path
          page = Path('client/src/pages/AdminOrders.tsx').read_text(encoding='utf-8')
          component = Path('client/src/components/OrderH2AdsBrowserShortcut.tsx').read_text(encoding='utf-8')
          if page.count('<OrderH2AdsBrowserShortcut registrationId={order.id} subOrderIndex={order.subOrderIndex ?? 0} />') != 1:
              raise SystemExit('atalho não está exatamente uma vez no card do pedido')
          for marker in ['trpc.h2Ads.launchBrowser.useMutation()', 'trpc.h2Ads.closeBrowser.useMutation()', 'if (!shortcut) return null;', 'event.stopPropagation()']:
              if marker not in component:
                  raise SystemExit(f'marcador ausente: {marker}')
          print('ORDERS_H2ADS_SHORTCUT_GUARD_OK')
      - name: Production build
        run: pnpm build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/h2adsOrderBrowserShortcut.ts client/src/components/OrderH2AdsBrowserShortcut.tsx client/src/pages/AdminOrders.tsx server/h2adsOrderBrowserShortcut.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(orders): atalhos H2ADS para abrir e fechar browser [skip ci]"
          git push origin HEAD:feat/orders-h2ads-browser-shortcuts-20260831
